# Dependabot keeps the GitHub Actions used by the checks, the guide's Astro and Starlight, the minifier and
# type checker in tools/build/, the browser tests in tools/a11y/, Lighthouse in tools/lighthouse/ and Stylelint
# in tools/lint/ up to date.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request for all action updates, so the workflows never mix old and new versions.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/tools/build"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/tools/a11y"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/tools/lighthouse"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/tools/lint"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/guide-src"
    schedule:
      interval: "weekly"
