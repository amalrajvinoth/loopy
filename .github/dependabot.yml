# Dependabot keeps the GitHub Actions used by the checks, the guide's Astro and Starlight, the two minifiers in
# tools/requirements.txt, and the accessibility checker in tools/a11y/, up to date.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/tools/a11y"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/guide-src"
    schedule:
      interval: "weekly"
