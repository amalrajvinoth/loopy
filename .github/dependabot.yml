# Dependabot keeps the GitHub Actions used by the checks, and the two minifiers in
# tools/requirements.txt, up to date.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
