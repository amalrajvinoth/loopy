# Safety checks on every change. They must pass before a pull request is merged.
#
# The fast checks run on every change. The long browser tests and the guide check run only when
# a pull request changes files they read (tools/ci_changes.py says which). Pushes to main run
# everything. "All checks" at the end always reports, so it is the one check to mark as required.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request stops its older run. Runs on main are never stopped.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.which.outputs.site }}
      guide: ${{ steps.which.outputs.guide }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit: its first parent is the base branch.
          fetch-depth: 2
      - name: Which long checks this change needs
        id: which
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tools/ci_changes.py HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            printf 'site=true\nguide=true\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every page's security policy matches its code
        run: python3 tools/csp.py --check
      - name: Nothing is loaded from other websites
        run: python3 tools/check_external.py
      - name: Every game has a page in the guide, in English and German
        run: python3 tools/guide_check.py
      - name: The Family sync server answers right (sync/, with a stand-in database)
        run: node sync/test.mjs
      - name: Install the minifiers (exact versions, checked by hash)
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --no-binary :all: -r tools/requirements.txt
      - name: loopy.js and loopy.css match their sources in src/
        run: '"$RUNNER_TEMP/venv/bin/python" tools/build.py --check'
      - name: The Claude Code plugins match the repo
        run: |
          python3 plugins/sync.py --check
          python3 plugins/loopy/scripts/drift.py
          python3 plugins/test_hooks.py

  accessibility:
    name: accessibility (part ${{ matrix.part }} of 2)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checker (exact versions from the lock file, no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: Every page works with a keyboard and a screen reader
        run: node tools/a11y/check.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
          SHARD: ${{ matrix.part }}/2

  play:
    name: play test (part ${{ matrix.part }} of 2)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checker (exact versions from the lock file, no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: Every game plays, and no question comes back too soon
        run: node tools/e2e/play.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
          SHARD: ${{ matrix.part }}/2

  retry:
    name: Try again test
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checker (exact versions from the lock file, no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: A mistake comes back in every game until it is fixed
        run: node tools/e2e/retry.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: After an update, phones save the new pages, never an old one
        run: node tools/e2e/offline.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: Family sync keeps two devices in step, and sends nothing when it is off
        run: node tools/e2e/sync.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: Levels follow the child: up by itself when ready, kept over the birthday
        run: node tools/e2e/levels.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y

  # The loopy guide (guide-src/): it builds, every page passes the same safety checks as the games,
  # links work, and no page has an error in Chrome. See guide-src/README.md.
  guide:
    needs: changes
    if: needs.changes.outputs.guide == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Keep installs exact from the lock files, with no shared npm cache.
          package-manager-cache: false
      - name: Install Astro and Starlight (exact versions from the lock file)
        run: npm ci --prefix guide-src --no-audit --no-fund
      - name: Build the guide (this also writes each page's security policy)
        run: npm run build --prefix guide-src
      - name: Every guide page's security policy matches its code
        run: python3 tools/csp.py --check
      - name: Nothing in the guide is loaded from other websites
        run: python3 tools/check_external.py
      - name: Install the Chrome driver (same as the accessibility check)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: Links work, no errors, search works, no accessibility problems
        run: node guide-src/scripts/check.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y

  # One check that always reports: it fails if any job above failed or was stopped.
  # A job that was skipped because the change does not need it counts as passed.
  all:
    name: All checks
    needs: [changes, checks, accessibility, play, retry, guide]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: v["result"] for job, v in json.loads(os.environ["NEEDS"]).items()}
          for job, result in results.items():
              print(f"{job}: {result}")
          sys.exit(any(r not in ("success", "skipped") for r in results.values()))
          PY
