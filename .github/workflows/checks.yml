# Safety checks on every change. They must pass before a pull request is merged.
#
# The fast checks run on every change. The long browser tests and the guide check run only when
# a pull request changes files they read (tools/ci_changes.py says which). Pushes to main run
# everything. "All checks" at the end always reports, so it is the one check to mark as required.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  # After a Dependabot merge (dependabot-merge.yml), which GitHub does not start workflows for by itself.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request stops its older run. Runs on main are never stopped.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.which.outputs.site }}
      guide: ${{ steps.which.outputs.guide }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit: its first parent is the base branch.
          fetch-depth: 2
      - name: Which long checks this change needs
        id: which
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tools/ci_changes.py HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            printf 'site=true\nguide=true\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every page's security policy matches its code
        run: python3 tools/csp.py --check
      - name: Nothing is loaded from other websites
        run: python3 tools/check_external.py
      - name: Every game has a page in the guide, in English and German
        run: python3 tools/guide_check.py
      - name: The Family sync server answers right (sync/, with a stand-in database)
        run: node sync/test.mjs
      - name: The Family sync usage report prints counts only (tools/sync-usage.mjs)
        run: node tools/sync-usage.test.mjs
      - name: Install the minifier and the type checker (exact versions from the lock file)
        run: npm ci --prefix tools/build --ignore-scripts --no-audit --no-fund
      - name: loopy.js and loopy.css match their sources in src/
        run: python3 tools/build.py --check
      - name: The shared script and its parts type-check against src/loopy.d.ts
        run: node tools/build/node_modules/typescript/bin/tsc -p tools/build
      - name: Install Stylelint (exact versions from the lock file)
        run: npm ci --prefix tools/lint --ignore-scripts --no-audit --no-fund
      - name: The styles use only CSS every browser has had for 30 months (Baseline) and theme colours, and nothing is broken or doubled
        run: node tools/lint/check.mjs
      - name: The Claude Code plugins match the repo
        run: |
          python3 plugins/sync.py --check
          python3 plugins/loopy/scripts/drift.py
          python3 plugins/test_hooks.py
      - name: Every page stays in its size budget (100 KB sent; loopy.js and loopy.css grow by at most 2 KB)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 tools/review.py --budget --base "origin/$BASE"

  # The browser tests run twice: in Chromium and in WebKit, the engine behind Safari on iPhone and iPad.
  accessibility:
    name: accessibility (part ${{ matrix.part }} of 2, ${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checker (exact versions from the lock file, no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: Install WebKit, the engine behind Safari (only for the WebKit run)
        if: matrix.engine == 'webkit'
        run: node "$RUNNER_TEMP/a11y/node_modules/playwright-core/cli.js" install --with-deps webkit
      - name: Every page works with a keyboard and a screen reader
        run: node tools/a11y/check.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
          SHARD: ${{ matrix.part }}/2
          ENGINE: ${{ matrix.engine }}

  play:
    name: play test (part ${{ matrix.part }} of 2, ${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checker (exact versions from the lock file, no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: Install WebKit, the engine behind Safari (only for the WebKit run)
        if: matrix.engine == 'webkit'
        run: node "$RUNNER_TEMP/a11y/node_modules/playwright-core/cli.js" install --with-deps webkit
      - name: Every game plays, and no question comes back too soon
        run: node tools/e2e/play.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
          SHARD: ${{ matrix.part }}/2
          ENGINE: ${{ matrix.engine }}

  retry:
    name: Try again test
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checker (exact versions from the lock file, no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: A mistake comes back in every game until it is fixed
        run: node tools/e2e/retry.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: After an update, phones save the new pages, never an old one
        run: node tools/e2e/offline.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: Family sync keeps two devices in step, and sends nothing when it is off
        run: node tools/e2e/sync.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: "Levels follow the child: up by itself when ready, kept over the birthday"
        run: node tools/e2e/levels.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: "Switching the child mid-game: each child keeps their own stars, log and last game"
        run: node tools/e2e/switch.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
      - name: "The first visit: the welcome sheet once, the family code row until a code is set"
        run: node tools/e2e/hello.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y

  # The home page and six games must still look the same: pictures at four sizes, English and German, compared
  # with tools/e2e/pictures/. Playwright's own pinned Chromium, so the runner's Chrome updates cannot move a pixel.
  pictures:
    name: picture test
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the checker (exact versions from the lock file, no browser download)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Chromium build the pictures were taken with
        run: node "$RUNNER_TEMP/a11y/node_modules/playwright-core/cli.js" install chromium-headless-shell
      - name: The home page and six games still look the same
        run: node tools/e2e/pictures.mjs --out "$RUNNER_TEMP/pictures-out"
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y
          ENGINE: pinned
      - name: Keep the new pictures and the diffs (only when a picture changed)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pictures-that-changed
          path: ${{ runner.temp }}/pictures-out
          retention-days: 14

  # Lighthouse on the pages this change touches (tools/ci_changes.py --pages), served with gzip like GitHub Pages,
  # with budgets: every score 95 or more, no layout shift; the 100 KB size line is a warning here and a gate in review.py --budget (tools/lighthouse/lighthouserc.json).
  lighthouse:
    name: Lighthouse budgets
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Lighthouse CI (exact versions from the lock file)
        run: npm ci --prefix tools/lighthouse --ignore-scripts --no-audit --no-fund
      - name: Which pages this change touches
        id: pages
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python3 tools/ci_changes.py --pages HEAD^1 HEAD > "$RUNNER_TEMP/pages.txt"
          else
            printf '%s\n' "" math/make-10/ languages/word-detective/ progress/ > "$RUNNER_TEMP/pages.txt"
          fi
          cat "$RUNNER_TEMP/pages.txt"
      - name: Score them on a phone, with the budgets
        run: |
          node tools/lighthouse/serve.mjs 8787 &
          sleep 1
          urls=""
          while IFS= read -r page; do urls="$urls --url=http://127.0.0.1:8787/loopy/$page"; done < "$RUNNER_TEMP/pages.txt"
          lhci=tools/lighthouse/node_modules/.bin/lhci
          # shellcheck disable=SC2086
          "$lhci" collect --config=tools/lighthouse/lighthouserc.json $urls
          "$lhci" assert --config=tools/lighthouse/lighthouserc.json
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-pull-request
          path: .lighthouseci
          include-hidden-files: true # the folder starts with a dot
          retention-days: 14

  # The loopy guide (guide-src/): it builds, every page passes the same safety checks as the games,
  # links work, and no page has an error in Chrome. See guide-src/README.md.
  guide:
    needs: changes
    if: needs.changes.outputs.guide == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Keep installs exact from the lock files, with no shared npm cache.
          package-manager-cache: false
      - name: Install Astro and Starlight (exact versions from the lock file)
        run: npm ci --prefix guide-src --no-audit --no-fund
      - name: Build the guide (this also writes each page's security policy)
        run: npm run build --prefix guide-src
      - name: Every guide page's security policy matches its code
        run: python3 tools/csp.py --check
      - name: Nothing in the guide is loaded from other websites
        run: python3 tools/check_external.py
      - name: Install the Chrome driver (same as the accessibility check)
        run: |
          mkdir -p "$RUNNER_TEMP/a11y"
          cp tools/a11y/package.json tools/a11y/package-lock.json "$RUNNER_TEMP/a11y/"
          npm ci --prefix "$RUNNER_TEMP/a11y" --ignore-scripts --no-audit --no-fund
      - name: Links work, no errors, search works, no accessibility problems
        run: node guide-src/scripts/check.mjs
        env:
          A11Y_DEPS: ${{ runner.temp }}/a11y

  # One check that always reports: it fails if any job above failed or was stopped.
  # A job that was skipped because the change does not need it counts as passed.
  all:
    name: All checks
    needs: [changes, checks, accessibility, play, retry, pictures, lighthouse, guide]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every needed check passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: v["result"] for job, v in json.loads(os.environ["NEEDS"]).items()}
          for job, result in results.items():
              print(f"{job}: {result}")
          sys.exit(any(r not in ("success", "skipped") for r in results.values()))
          PY
