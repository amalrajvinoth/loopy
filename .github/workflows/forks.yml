# Who uses loopy? Every Monday this lists the forks that are new since its last run, says when the star
# count went up, gives the totals, and (when a token allows it) how often the repo was cloned in the last
# two weeks. The Summary of the run shows it all. The one "Forks and stars" issue, assigned to the owner,
# keeps the last counts in its text; when there is a new fork or star, the job adds a comment there, so
# the owner gets an email. Nothing is sent anywhere else. GitHub itself has no notification for a new
# fork or star, which is why this job exists.
#
# What the Actions token may read (tried on 2 November 2026): the forks list and the totals, yes; the
# list of who starred, no (403), so stars are counted, not named; clone counts, no. Optional: a
# fine-grained token with "Administration: read" on this repo as the secret TRAFFIC_TOKEN gives the
# clone counts. Without it the clone line says why it is missing.
# Run it any time: Actions → Forks and stars → Run workflow.
name: Forks and stars

on:
  schedule:
    - cron: "13 5 * * 1" # Mondays, 05:13 UTC, before the owner's Monday check
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: New forks and stars since the last run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          R="$GITHUB_REPOSITORY"
          # Since the last green run of this job, or the last 7 days the first time.
          since=$(gh api "repos/$R/actions/workflows/forks.yml/runs?status=success&per_page=1" \
                    --jq '.workflow_runs[0].run_started_at // empty' 2>/dev/null || true)
          [ -n "$since" ] || since=$(date -u -d '7 days ago' +%FT%TZ)
          echo "Looking for forks and stars since $since."

          forks=$(gh api "repos/$R/forks?sort=newest&per_page=100" --paginate \
                    --jq ".[] | select(.created_at > \"$since\") | \"- \(.created_at[:10]) [\(.full_name)](\(.html_url))\"")
          read -r fork_total star_total < <(gh api "repos/$R" --jq '"\(.forks_count) \(.stargazers_count)"')

          # The one issue that carries the reports. Its text keeps the counts of the last run.
          gh label create usage --repo "$R" --color 0E8A16 --description "Who uses loopy: forks, stars and clones" --force >/dev/null
          issue=$(gh issue list --repo "$R" --label usage --state open --json number --jq '.[0].number // empty')
          last_stars=""
          if [ -n "$issue" ]; then
            last_stars=$(gh issue view "$issue" --repo "$R" --json body --jq '.body' \
                           | sed -n 's/.*<!-- loopy-counts forks=[0-9]* stars=\([0-9]*\) -->.*/\1/p' | head -1)
          fi
          stars=""
          if [ -n "$last_stars" ] && [ "$star_total" -gt "$last_stars" ]; then
            stars="$((star_total - last_stars)) new (was $last_stars, now $star_total). GitHub does not tell this job who; the star button on the repo page shows the names."
          fi

          clones="Clone counts need the optional TRAFFIC_TOKEN secret with Administration: read (see the top of forks.yml)."
          if [ -n "$TRAFFIC_TOKEN" ]; then
            clones=$(GH_TOKEN="$TRAFFIC_TOKEN" gh api "repos/$R/traffic/clones" 2>/dev/null \
                       --jq '"Cloned \(.count) times by \(.uniques) people in the last 14 days."' \
                     || echo "Clone counts: the TRAFFIC_TOKEN secret did not work (it needs Administration: read on this repo).")
          fi

          {
            echo "## Forks and stars"
            echo
            echo "New since $(echo "$since" | cut -c1-10):"
            echo
            if [ -n "$forks" ]; then echo "Forks:"; echo "$forks"; else echo "No new forks."; fi
            echo
            if [ -n "$stars" ]; then echo "Stars: $stars"; else echo "No new stars."; fi
            echo
            echo "In all: $fork_total forks, $star_total stars. $clones"
          } > "$RUNNER_TEMP/report.md"
          cat "$RUNNER_TEMP/report.md" | tee -a "$GITHUB_STEP_SUMMARY"

          body="Every Monday the Forks and stars job adds a comment here when someone new forked or starred loopy. Nothing to do; it is only so the owner hears about it. Close it any time: the next run opens a new one.

          Last counted: $fork_total forks, $star_total stars.
          <!-- loopy-counts forks=$fork_total stars=$star_total -->"
          body=$(echo "$body" | sed 's/^          //')
          if [ -z "$issue" ]; then
            issue=$(gh issue create --repo "$R" --title "Forks and stars" --label usage --assignee "$OWNER" --body "$body" \
                    | grep -oE '[0-9]+$')
            echo "Made issue #$issue to keep the counts. It gets a comment when they go up."
          else
            gh issue edit "$issue" --repo "$R" --body "$body" >/dev/null
          fi

          if [ -z "$forks" ] && [ -z "$stars" ]; then
            echo "Nothing new, so no comment on issue #$issue."
            exit 0
          fi
          gh issue comment "$issue" --repo "$R" --body-file "$RUNNER_TEMP/report.md"
          echo "Added the report to issue #$issue."
