# Put loopy live on GitHub Pages: the games exactly as they are in the repo, and the guide,
# built from guide-src/, at /loopy/guide/.
#
# One-time setup by the repo owner: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then Pages keeps serving the main branch as before, and this workflow's deploy step fails.
#
# The last job opens the live site and checks that it serves this very version. If it does not within
# ten minutes, the run goes red, so nobody has to open the site by hand after a merge.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # Keep installs exact from the lock files, with no shared npm cache.
          package-manager-cache: false
      - name: Build the guide
        run: |
          npm ci --prefix guide-src --no-audit --no-fund
          npm run build --prefix guide-src
      - name: The same safety checks as on every pull request
        run: |
          python3 tools/csp.py --check
          python3 tools/check_external.py
          python3 tools/guide_check.py
      - name: Put the site together
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          # The games: every file a visitor's browser can load. Left out: what is only for people working on
          # loopy (the same folders tools/build.py keeps out of the offline list): the sources in src/, the
          # tools and their saved pictures, the pull request screenshots in docs/, the Claude Code plugins,
          # the workflows, the Markdown files and the tool configs. sync/ is Family sync's server code (it
          # runs on Cloudflare, see sync/README.md). Before this (20 November 2026) every deploy carried the
          # whole repo, about 92 MB, of which 71 MB were screenshots no page loads.
          tar --exclude=./.git --exclude=./.github --exclude=./.claude --exclude=./.claude-plugin --exclude=./.ralph \
              --exclude=./docs --exclude=./plugins --exclude=./src --exclude=./sync --exclude=./tools \
              --exclude=./guide-src --exclude=./node_modules --exclude='./*.md' --exclude=./.coderabbit.yaml \
              --exclude=./.mcp.json --exclude=./.talismanrc --exclude=./.gitignore \
              -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
          # The guide.
          cp -R guide-src/dist "$RUNNER_TEMP/site/guide"
          tar --dereference --hard-dereference -C "$RUNNER_TEMP/site" -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Nothing a visitor loads was left out
        run: |
          # Every file the offline helper saves (tools/build.py knows the list), the helper itself, the
          # manifest, security.txt and the guide must be in the site that goes live.
          python3 - "$RUNNER_TEMP/site" <<'PY'
          import pathlib, sys
          sys.path.insert(0, "tools")
          import build
          site = pathlib.Path(sys.argv[1])
          want = [p.relative_to(build.ROOT) for p in build.offline_files().values()]
          want += [pathlib.Path(x) for x in ("sw.js", "manifest.webmanifest", ".well-known/security.txt", ".nojekyll", "guide/index.html")]
          missing = [str(w) for w in want if not (site / w).is_file()]
          print(f"{len(want) - len(missing)} of {len(want)} files are in the site.")
          if missing:
              print("::error::Missing from the deploy: " + ", ".join(missing[:20]))
              sys.exit(1)
          PY
          du -sh "$RUNNER_TEMP/site" | cut -f1 | xargs -I{} echo "The site is {} on disk."
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          # GitHub Pages sometimes takes far longer than the 10-minute default to pick a deployment up
          # (6 November 2026: three runs timed out with an empty status). Wait up to 30 minutes.
          timeout: 1800000

  check:
    name: Live site check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The live site serves what was just deployed
        env:
          SITE: https://amalrajvinoth.github.io/loopy
        run: |
          # Pages hands out the new version a little after the deploy says done, so this tries for up to
          # ten minutes. The ?v= part makes every fetch skip any older copy a cache still holds.
          # sw.js is the one file that changes with every release (it lists a hash per page), so when it
          # matches, the whole site is this version. The home page and the guide must answer too.
          for try in $(seq 1 20); do
            if curl -fsS "$SITE/sw.js?v=$GITHUB_SHA" -o "$RUNNER_TEMP/sw.js" \
               && cmp -s "$RUNNER_TEMP/sw.js" sw.js \
               && curl -fsS -o /dev/null "$SITE/?v=$GITHUB_SHA" \
               && curl -fsS -o /dev/null "$SITE/guide/?v=$GITHUB_SHA"; then
              echo "The live site has this version: sw.js matches, the home page and the guide answer."
              exit 0
            fi
            echo "Not live yet (try $try of 20). Waiting 30 seconds."
            sleep 30
          done
          echo "::error::Ten minutes after the deploy the live site still serves an older version, or a page does not answer. Compare $SITE/sw.js with sw.js in this commit, and look at Settings → Pages for the last deploy."
          exit 1
