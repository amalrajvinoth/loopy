# Merges a Dependabot pull request by itself once every check is green, then puts the site live.
#
# GitHub runs this from the main branch each time a "Checks" run finishes. It merges only when that run
# passed, was for a pull request against main, came from Dependabot's own branch in this repo, and every
# bump in it is a patch or minor version. Nothing else is ever merged here. A red Dependabot pull request,
# and one with a major version in it (1.x to 2.x), stays open for a person to look at: a major version can
# change what a tool does, and two of these tools shape what visitors load (esbuild builds loopy.js, Astro
# builds the guide). Dependabot also waits 7 days after a release before proposing it (.github/dependabot.yml).
#
# The merge uses the Actions token. GitHub starts no workflows for pushes made with that token, so the
# last step starts the Pages deploy and the checks on main itself (starting a workflow is the one exception).
name: Dependabot merge

on:
  # workflow_run gives this workflow write rights, which zizmor calls a dangerous trigger. It is the only
  # trigger that runs after another workflow's checks, and the if: below lets it merge nothing but a green
  # Dependabot pull request from this very repository; nothing from the pull request itself is run here.
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows: [Checks]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge the green Dependabot pull request, then put the site live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The open pull request from this branch, at the very commit the checks passed on.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=${GITHUB_REPOSITORY%%/*}:$BRANCH" \
                 --jq ".[] | select(.head.sha == \"$SHA\" and .user.login == \"dependabot[bot]\") | .number")
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request at this commit on $BRANCH, so there is nothing to merge."
            exit 0
          fi
          # Dependabot writes "from 1.2.3 to 1.3.0" for each package, in the title and (for a group) in the body.
          # Only when every bump keeps its first number is the pull request merged here.
          gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json title,body > "$RUNNER_TEMP/pr.json"
          if ! python3 - "$RUNNER_TEMP/pr.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, re, sys
          pr = json.load(open(sys.argv[1]))
          bumps = sorted(set(re.findall(r"from (\d+)((?:\.[\w-]+)*) to (\d+)((?:\.[\w-]+)*)", pr["title"] + "\n" + (pr["body"] or ""))))
          majors = [f"{a}{b} to {c}{d}" for a, b, c, d in bumps if a != c]
          if not bumps:
              print("Could not tell which versions this pull request bumps, so it waits for a person.")
          elif majors:
              print("A major version bump (" + ", ".join(majors) + ") waits for a person; only patch and minor bumps merge by themselves.")
          else:
              print(f"{len(bumps)} patch or minor bump(s): merging.")
          sys.exit(1 if not bumps or majors else 0)
          PY
          then
            cat "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$GITHUB_STEP_SUMMARY"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          echo "Merged #$pr. Starting the Pages deploy and the checks on main."
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref main
