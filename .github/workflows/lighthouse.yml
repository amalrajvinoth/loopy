# Once a month, Lighthouse scores the live site the way a phone on slow data sees it: the home page, one
# game and the guide. The run goes red when a score drops under 90, so a slow page shows up before a parent
# notices. The reports are kept with the run. Run it any time: Actions → Lighthouse → Run workflow.
name: Lighthouse

on:
  schedule:
    - cron: "23 6 1 * *" # the 1st of every month, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Score the home page, a game and the guide on a phone
        env:
          SITE: https://amalrajvinoth.github.io/loopy
          # An exact version, at least two weeks old.
          LIGHTHOUSE: lighthouse@13.5.0
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          for page in "home:" "make-10:math/make-10/" "guide:guide/"; do
            name="${page%%:*}"; path="${page#*:}"
            npx --yes "$LIGHTHOUSE" "$SITE/$path" --quiet \
              --only-categories=performance,accessibility,best-practices \
              --chrome-flags="--headless=new --no-sandbox" \
              --output=json --output=html --output-path="$RUNNER_TEMP/reports/$name"
          done
      - name: Every score is 90 or more
        run: |
          node -e '
            const fs = require("fs"), dir = process.env.RUNNER_TEMP + "/reports";
            let bad = 0;
            for (const f of fs.readdirSync(dir).filter(f => f.endsWith(".report.json")).sort()) {
              const r = JSON.parse(fs.readFileSync(dir + "/" + f, "utf8"));
              const row = Object.values(r.categories).map(c => {
                const score = Math.round(c.score * 100);
                if (score < 90) bad++;
                return c.title + " " + score + (score < 90 ? " (under 90)" : "");
              });
              console.log(f.replace(".report.json", "") + ": " + row.join(", "));
            }
            if (bad) { console.log("::error::" + bad + " score(s) under 90. Open the reports kept with this run to see why."); process.exit(1); }
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: ${{ runner.temp }}/reports
          retention-days: 90
