# Put the Family sync server (sync/) live on Cloudflare's free plan. See sync/README.md.
#
# One-time setup by the repo owner (sync/README.md has the steps): two repository secrets,
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. Until they are set, this job does nothing and passes.
# It makes the database the first time (loopy-sync), sets up its table, and deploys the Worker.
name: Family sync server

on:
  push:
    branches: [main]
    paths:
      - "sync/**"
      - ".github/workflows/sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # An exact version, at least two weeks old.
      WRANGLER: wrangler@4.149.0
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "No Cloudflare secrets yet, so nothing to deploy. See sync/README.md."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
          package-manager-cache: false
      - name: The server answers right
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node sync/test.mjs
      - name: Make the database once, set up its table, deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: sync
        run: |
          w() { npx --yes "$WRANGLER" "$@"; }
          find_id() { w d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="loopy-sync");process.stdout.write(d?d.uuid:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then
            w d1 create loopy-sync --update-config=false
            id=$(find_id)
          fi
          test -n "$id"
          sed -i "s/DATABASE_ID/$id/" wrangler.toml
          w d1 execute loopy-sync --remote --yes --file schema.sql
          w deploy
