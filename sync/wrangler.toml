# loopy Family sync server on Cloudflare (free plan). See sync/README.md.
# GitHub Actions deploys it (.github/workflows/sync.yml). Both database_id values are filled in by that job.
name = "loopy-sync"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Pages that may read and write. A comma-separated list of origins.
ORIGINS = "https://amalrajvinoth.github.io"

[[d1_databases]]
binding = "DB"
database_name = "loopy-sync"
database_id = "DATABASE_ID"

# "Stay in touch" emails, apart from the family copies and kept in the EU (made with --location weur).
[[d1_databases]]
binding = "GROWNUPS"
database_name = "loopy-grownups"
database_id = "GROWNUPS_ID"

[triggers]
crons = ["17 3 * * *"]

# Too many requests from one address get 429 (security review, 21 November 2026). Cloudflare's Rate Limiting
# binding, free on every plan, counted per caller address at each Cloudflare location, so the limit is about
# this, not exact. LIMIT covers the family copies and /stats: a family's devices on one Wi-Fi make a few requests
# a minute. LIMIT_MAIL covers Stay in touch (/g), so nobody fills the list with junk addresses from one place.
# period may only be 10 or 60 seconds. The tests (sync/test.mjs) use a stand-in; without the binding nothing is limited.
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LIMIT_MAIL"
namespace_id = "1002"
simple = { limit = 6, period = 60 }
