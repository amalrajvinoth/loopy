<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; manifest-src 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%23ffd23f%22 d=%22M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z%22/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loopy">
<title>Loopy</title>
<meta name="description" content="Loopy: free learning games for kids. Learn. Play. Repeat.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a big bouncy wordmark, then one section per subject with chunky colorful game cards. */
:root {
  --bg: #fff8ec; --card: #ffffff; --ink: #1d2a3f; --muted: #5d6b82; --line: #f0e2c8;
  --c1: #2457c5; --c2: #e2622b; --c3: #1f8a4c; --c4: #b0359c; --c5: #d9a400;
  --chip: #fdeccc; --mark: #e2622b;
  --display: "Fredoka", "Lexend", "Segoe UI", Arial, sans-serif;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(28px, env(safe-area-inset-top, 0px)) 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; }
h1 { margin: 0; font-family: var(--display); font-size: clamp(4rem, 20vw, 6.5rem); font-weight: 700; line-height: 1; letter-spacing: 0.01em; }
h1 span { display: inline-block; animation: hop 2.4s ease-in-out infinite; }
h1 span:nth-child(5n+1) { color: var(--c1); }
h1 span:nth-child(5n+2) { color: var(--c2); animation-delay: .12s; }
h1 span:nth-child(5n+3) { color: var(--c3); animation-delay: .24s; }
h1 span:nth-child(5n+4) { color: var(--c4); animation-delay: .36s; }
h1 span:nth-child(5n)   { color: var(--c5); animation-delay: .48s; }
@keyframes hop { 0%, 70%, 100% { transform: translateY(0); } 80% { transform: translateY(-0.12em); } }
.lead { margin: 0; font-family: var(--display); font-weight: 600; font-size: 1.35rem; color: var(--muted); text-wrap: balance; }
.subject { display: flex; flex-direction: column; gap: 12px; }
.subject h2.sub { margin: 0; font-family: var(--display); font-size: 1.6rem; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.quiz {
  --tone: var(--c1);
  display: flex; flex-direction: column; gap: 8px; padding: 20px; min-height: 170px;
  background: var(--card); border: 3px solid var(--tone); border-radius: 24px;
  box-shadow: 0 6px 0 var(--tone);
  color: inherit; text-decoration: none; transition: transform .1s ease, box-shadow .1s ease;
}
.quiz:nth-child(5n+2) { --tone: var(--c2); }
.quiz:nth-child(5n+3) { --tone: var(--c3); }
.quiz:nth-child(5n+4) { --tone: var(--c4); }
.quiz:nth-child(5n)   { --tone: var(--c5); }
.quiz:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--tone); }
.quiz:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--tone); }
.quiz:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.tag { align-self: flex-start; background: var(--chip); color: var(--ink); font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.quiz h3 { margin: 0; font-family: var(--display); font-size: 1.6rem; font-weight: 700; color: var(--tone); }
.quiz p { margin: 0; color: var(--muted); line-height: 1.45; }
.go { margin-top: auto; align-self: flex-start; background: var(--tone); color: var(--card); font-family: var(--display); font-weight: 700; font-size: 1.1rem; padding: 6px 16px; border-radius: 999px; }
.empty { margin: 0; color: var(--muted); font-size: 1.1rem; text-align: center; }
footer { color: var(--muted); font-size: 0.95rem; text-align: center; display: flex; flex-direction: column; gap: 8px; }
footer p { margin: 0; }
.help-link { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<link rel="stylesheet" href="loopy.css">
<script src="loopy.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 aria-label="Loopy"><span>L</span><span>o</span><span>o</span><span>p</span><span>y</span></h1>
    <p class="lead" data-t="tagline">Learn. Play. Repeat.</p>
    <div class="controls" style="justify-content:center"><div id="age-picker"></div><div id="theme-picker"></div><button id="sound-toggle"></button><div id="lang-picker"></div></div>
  </header>
  <section class="shelf" aria-labelledby="shelf-title">
    <div class="shelf-top">
      <h2 id="shelf-title" data-t="myStars">My stars</h2>
      <span id="star-chip"></span>
    </div>
    <p class="shelf-next" id="shelf-next"></p>
    <div class="meter" aria-hidden="true"><i id="meter-fill"></i></div>
    <div class="badges" id="badges"></div>
    <details class="transfer">
      <summary data-t="moveStars">Move my stars to another device</summary>
      <div class="transfer-body">
        <p data-t="moveHow">Copy this code on this device, then paste it on the other one.</p>
        <div class="transfer-row"><input id="code-out" readonly data-t-aria="yourCode" aria-label="Your stars code"><button type="button" id="code-copy" data-t="copy">Copy</button></div>
        <div class="transfer-row"><input id="code-in" placeholder="Paste a code here" data-t-placeholder="pasteHere" data-t-aria="pasteCode" aria-label="Paste a stars code"><button type="button" id="code-load" data-t="load">Load</button></div>
        <p id="code-msg" aria-live="polite"></p>
      </div>
    </details>
  </section>
  <main id="list" style="display:flex;flex-direction:column;gap:28px"></main>
  <footer><p data-t="moreSoon">More games are on the way!</p><p><a class="help-link" href="help/" data-t="helpLink">Help and feedback</a></p></footer>
</div>
<script>
Loopy.addStrings({
  en: {
    tagline: "Learn. Play. Repeat.", myStars: "My stars", moveStars: "Move my stars to another device",
    moveHow: "Copy this code on this device, then paste it on the other one.", yourCode: "Your stars code", copy: "Copy",
    pasteHere: "Paste a code here", pasteCode: "Paste a stars code", load: "Load", moreSoon: "More games are on the way!", helpLink: "Help and feedback",
    copied: "Copied!", copyByHand: "Select the code and copy it.", badCode: "That code didn't work. Check it was copied in full.",
    toNext: "{n} more stars to the {name} badge. Every right answer earns a star.", toNextOne: "1 more star to the {name} badge. Every right answer earns a star.",
    allBadges: "You have every badge. You're a Loopy Master!", earned: "Earned", nStars: "{n} stars",
    play: "Play →", ages: "Ages {a}–{b}", more: "More to explore", noneForAge: "No games for age {n} yet. Try the ones below.",
    math: "Math",
    pmTitle: "Plus and Minus", pmTag: "Adding and taking away", pmText: "Worksheet-style sums typed on a big number pad. The numbers grow with your age.",
    tsTitle: "Times and Share", tsTag: "Times and division", tsText: "Times tables with dots to count, and sharing into equal groups. Bigger numbers as you grow.",
    clTitle: "What Time Is It?", clTag: "Telling time", clText: "Read the hands on the clock and pick the right time, from half hours down to the minute."
  },
  de: {
    tagline: "Lernen. Spielen. Wiederholen.", myStars: "Meine Sterne", moveStars: "Sterne auf ein anderes Gerät bringen",
    moveHow: "Kopiere diesen Code hier und füge ihn auf dem anderen Gerät ein.", yourCode: "Dein Sterne-Code", copy: "Kopieren",
    pasteHere: "Code hier einfügen", pasteCode: "Sterne-Code einfügen", load: "Laden", moreSoon: "Bald kommen mehr Spiele!", helpLink: "Hilfe und Feedback",
    copied: "Kopiert!", copyByHand: "Markiere den Code und kopiere ihn.", badCode: "Der Code hat nicht geklappt. Prüfe, ob er ganz kopiert wurde.",
    toNext: "Noch {n} Sterne bis zum Abzeichen {name}. Jede richtige Antwort gibt einen Stern.", toNextOne: "Noch 1 Stern bis zum Abzeichen {name}. Jede richtige Antwort gibt einen Stern.",
    allBadges: "Du hast alle Abzeichen. Du bist ein Loopy-Meister!", earned: "Geschafft", nStars: "{n} Sterne",
    play: "Spielen →", ages: "{a}–{b} Jahre", more: "Mehr entdecken", noneForAge: "Noch keine Spiele für {n} Jahre. Probier die unten.",
    math: "Mathe",
    pmTitle: "Plus und Minus", pmTag: "Plus und Minus rechnen", pmText: "Aufgaben wie auf dem Arbeitsblatt, getippt auf einem großen Zahlenfeld. Die Zahlen wachsen mit deinem Alter.",
    tsTitle: "Mal und Teilen", tsTag: "Malnehmen und Teilen", tsText: "Einmaleins mit Punkten zum Zählen und Teilen in gleiche Gruppen. Größere Zahlen, wenn du wächst.",
    clTitle: "Wie spät ist es?", clTag: "Uhr lesen", clText: "Lies die Zeiger der Uhr und wähle die richtige Zeit, von halben Stunden bis zur Minute."
  }
});
// To add a game: put it in <subject>/<folder>/index.html and add one line below.
// ages: the youngest and oldest age it suits. Games for the picked age show first.
// The words for each game (title, tag, text) live in the strings above, under the game's "id" prefix.
const GAMES = [
  { subject: "math", path: "math/plus-minus/", id: "pm", ages: [5, 16] },
  { subject: "math", path: "math/times-share/", id: "ts", ages: [6, 16] },
  { subject: "math", path: "math/what-time-is-it/", id: "cl", ages: [5, 10] },
];
const t = Loopy.t;
const list = document.getElementById("list");

function card(g) {
  const a = document.createElement("a");
  a.className = "quiz";
  a.href = g.path;
  a.innerHTML = '<span class="tag"></span><h3></h3><p></p><span class="go"></span>';
  a.children[0].textContent = t(g.id + "Tag") + " · " + t("ages", { a: g.ages[0], b: g.ages[1] });
  a.children[1].textContent = t(g.id + "Title");
  a.children[2].textContent = t(g.id + "Text");
  a.children[3].textContent = t("play");
  return a;
}
function section(title) {
  const sec = document.createElement("section");
  sec.className = "subject";
  sec.innerHTML = '<h2 class="sub"></h2><div class="grid"></div>';
  sec.firstChild.textContent = title;
  list.appendChild(sec);
  return sec.lastChild;
}
function render() {
  const age = window.Loopy ? Loopy.getAge() : 8;
  list.innerHTML = "";
  const fits = GAMES.filter(g => age >= g.ages[0] && age <= g.ages[1]);
  const others = GAMES.filter(g => !fits.includes(g));
  const groups = {};
  for (const g of fits) (groups[g.subject] = groups[g.subject] || section(t(g.subject))).appendChild(card(g));
  if (!fits.length) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = t("noneForAge", { n: age });
    list.appendChild(p);
  }
  if (others.length) {
    const grid = section(t("more"));
    for (const g of others) grid.appendChild(card(g));
  }
}
render();
window.addEventListener("loopy:age", render);

// Badge shelf: every right answer in any game earns a star.
(function shelf() {
  const R = window.Loopy && Loopy.rewards;
  if (!R) return;
  const stars = R.get().stars;
  const next = R.nextBadge(stars);
  const prev = R.BADGES.filter(b => b.stars <= stars).pop();
  const from = prev ? prev.stars : 0;
  document.getElementById("shelf-next").textContent = next
    ? t(next.stars - stars === 1 ? "toNextOne" : "toNext", { n: next.stars - stars, name: next.name })
    : t("allBadges");
  document.getElementById("meter-fill").style.width = next ? Math.round((stars - from) / (next.stars - from) * 100) + "%" : "100%";
  const out = document.getElementById("code-out"), msg = document.getElementById("code-msg");
  out.value = R.exportCode();
  document.getElementById("code-copy").addEventListener("click", () => {
    out.select();
    navigator.clipboard.writeText(out.value).then(() => { msg.textContent = t("copied"); }, () => { msg.textContent = t("copyByHand"); });
  });
  document.getElementById("code-load").addEventListener("click", () => {
    if (R.importCode(document.getElementById("code-in").value)) location.reload();
    else msg.textContent = t("badCode");
  });
  const box = document.getElementById("badges");
  for (const b of R.BADGES) {
    const got = stars >= b.stars;
    const d = document.createElement("div");
    d.className = "badge" + (got ? " got" : "");
    d.style.setProperty("--tone", "var(" + b.color + ")");
    d.innerHTML = '<span class="medal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + R.STAR_PATH + '"/></svg></span><span></span><small></small>';
    d.children[1].textContent = b.name;
    d.children[2].textContent = got ? t("earned") : t("nStars", { n: Loopy.num(b.stars) });
    box.appendChild(d);
  }
})();
</script>
</body>
</html>
