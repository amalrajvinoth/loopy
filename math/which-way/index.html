/* Layout: a small times table grid on the card with one cell marked, the number pad below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;

* { box-sizing: border-box; }

.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 4px; min-height: 44px; cursor: pointer;
}
.seg button:last-child { grid-column: 1 / -1; }

}

.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);

/* Which Way?: one sum, three ways to work it out (Tens first, Nearly round, Place by place), and one question about them.
   The way on show sits in a card with the accent line; the steps of the Fill level are boxes like Tens and Ones. */
.tag { margin: 0; font-size: 0.85rem; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 4px 12px; }
.sum { margin: 0; font-size: clamp(2rem, 11vw, 3.4rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; letter-spacing: 0.02em; }

.steps .box.ask { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; background: var(--card); color: var(--accent); }
.steps .box.ask:empty::after { content: "?"; color: var(--muted); }
.steps .box.todo { color: var(--muted); }
.steps .box.todo:empty::after { content: "?"; }
.problem-card.good .steps .box.ask { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; color: var(--good); }
.problem-card.bad .steps .box.ask { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.08em; }
.question { margin: 0; font-size: clamp(1.05rem, min(4.8vw, 3dvh), 1.5rem); font-weight: 700; line-height: 1.3; text-align: center; text-wrap: balance; }

.pick[hidden], .pad[hidden] { display: none; }
.choices { display: grid; grid-template-columns: 1fr; gap: 8px; }
.choices button {
  font: inherit; font-size: clamp(0.98rem, 4.2vw, 1.2rem); font-weight: 600; line-height: 1.3; color: var(--ink); background: var(--key); border: 2px solid var(--line); border-radius: 16px;
  min-height: 48px; padding: 8px 14px; text-align: left; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform .08s ease, border-color .15s ease;
}

.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.faded { opacity: 0.45; }
.pick .go { font: inherit; font-size: 1.35rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 2px solid var(--accent); border-radius: 18px; min-height: clamp(50px, 7dvh, 72px); cursor: pointer; }
.pick .go:disabled { opacity: 0.4; cursor: default; }

      if (p.type === "f") {
        const f = el("div", "fill");
        p.steps.forEach((s, i) => { if (i) f.appendChild(document.createElement("br")); f.appendChild(document.createTextNode(fmt(s[0]) + " " + s[1] + " " + fmt(s[2]) + " = ")); f.appendChild(el("i", "")); });
        box.appendChild(el("div", "way", wayName(p.w)));
        box.appendChild(f);
        return box;
      }
      WAYS.forEach(w => { const row = el("div", "way"); row.appendChild(el("i", "")); row.appendChild(document.createTextNode(wayName(w))); box.appendChild(row); });
      for (let i = 0; i < 2; i++) { const line = el("span", "line", i === 0 ? t("wyBecause") : ""); line.appendChild(el("i", "ws-line")); box.appendChild(line); }
      return box;
    },
    // Every way is right on the tick sheets (the line at the top says so), so the answer shows one of them.
    answer: (p) => { const w = p.type === "f" ? p.w : "tens"; return wayName(w) + ": " + stepsText(p.a, p.b, w) + "."; }
  });

  newRound();
})();
</script>
</body>
</html>
