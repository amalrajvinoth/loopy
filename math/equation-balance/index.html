/* Layout: one centered column; a see-saw and the equation on a card, big number pad below, settings behind the gear. */

<script>
Loopy.addStrings({
  en: {
    ebName: "Equation Balance", ebLevel: "Level",
    ebHint: "Find x so both sides weigh the same.", ebHintBox: "Which number goes in the box?",
    ebSay: "{eq}. What is x?", ebSayBox: "{eq}. Which number goes in the box?",
    ebPlusW: "plus", ebMinusW: "minus", ebEqW: "equals", ebBoxW: "box",
    ebBoxAdd: "Count back: {c} − {a} = {x}. So the box is {x}.",
    ebBoxSub: "Add it back: {c} + {a} = {x}. So the box is {x}.",
    ebTake: "Take {a} from both sides: {lhs} = {c} − {a} = {m}.",
    ebAdd: "Add {a} to both sides: {lhs} = {c} + {a} = {m}.",
    ebShare: "Share both sides by {a}: x = {c} ÷ {a} = {x}.",
    ebTakeX: "Take {t} from both sides: {lhs} = {c}.",
    ebLevelBox: "□ + 4 = 9", ebLevelAdd: "x + 4 = 9", ebLevelMul: "3x = 12", ebLevelTwo: "3x + 4 = 19", ebLevelBoth: "x on both sides",
   
    ebHow: "Find the number that makes both sides equal."
  },
  de: {
    ebName: "Waage", ebLevel: "Stufe",
    ebHint: "Finde x, damit beide Seiten gleich schwer sind.", ebHintBox: "Welche Zahl gehört ins Kästchen?",
    ebSay: "{eq}. Was ist x?", ebSayBox: "{eq}. Welche Zahl gehört ins Kästchen?",
    ebPlusW: "plus", ebMinusW: "minus", ebEqW: "ist gleich", ebBoxW: "Kästchen",
    ebBoxAdd: "Rechne zurück: {c} − {a} = {x}. Ins Kästchen gehört {x}.",
    ebBoxSub: "Rechne zurück: {c} + {a} = {x}. Ins Kästchen gehört {x}.",
    ebTake: "Nimm auf beiden Seiten {a} weg: {lhs} = {c} − {a} = {m}.",
    ebAdd: "Rechne auf beiden Seiten + {a}: {lhs} = {c} + {a} = {m}.",
    ebShare: "Teile beide Seiten durch {a}: x = {c} ÷ {a} = {x}.",
    ebTakeX: "Nimm auf beiden Seiten {t} weg: {lhs} = {c}.",
    ebLevelBox: "□ + 4 = 9", ebLevelAdd: "x + 4 = 9", ebLevelMul: "3x = 12", ebLevelTwo: "3x + 4 = 19", ebLevelBoth: "x auf beiden Seiten",
   
    ebHow: "Finde die Zahl, mit der beide Seiten gleich sind."
  }
});

// GEN START
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const fmt = (n) => Loopy.num(n);
const t = Loopy.t;

// The levels, easiest first: a missing number, x + a, a·x, a·x + b, and x on both sides.
const LEVELS = ["box", "add", "mul", "two", "both"];
const levelName = (lv) => ({ box: "ebLevelBox", add: "ebLevelAdd", mul: "ebLevelMul", two: "ebLevelTwo", both: "ebLevelBoth" })[lv];
function levelForAge(age) {
  if (age <= 10) return "box";
  if (age === 11) return "add";
  if (age === 12) return "mul";
  if (age <= 14) return "two";
  return "both";
}

// A side of the see-saw is a list of terms: { k } is k lots of x, { n } a number (minus pulls up), { box: true } the empty box.
// value(side, x) is what that side weighs when x is the given number.
const value = (side, x) => side.reduce((s, p) => s + (p.box ? x : p.k ? p.k * x : p.n), 0);
const xTerm = (k) => (k === 1 ? "" : fmt(k)) + "x";
// The side as text, like "3x − 4". The box is "□".
function sideText(side) {
  return side.map((p, i) => {
    const neg = p.n < 0, body = p.box ? "□" : p.k ? xTerm(p.k) : fmt(Math.abs(p.n));
    return i === 0 ? (neg ? "−" + body : body) : (neg ? " − " : " + ") + body;
  }).join("");
}

// One problem: the two sides, the answer x and a key for "no repeats".
function makeProblem(lv, age) {
  const small = age <= 8;
  let L, R, x, key;
  if (lv === "box") {
    const form = randInt(0, 2), a = randInt(1, small ? 9 : 20);
    x = randInt(1, small ? 10 : 20);
    if (form === 0) { L = [{ box: true }, { n: a }]; R = [{ n: x + a }]; }
    else if (form === 1) { L = [{ n: a }, { box: true }]; R = [{ n: a + x }]; }
    else { x += a; L = [{ box: true }, { n: -a }]; R = [{ n: x - a }]; }
    key = "box:" + form + ":" + a + ":" + x;
  } else if (lv === "add") {
    const form = randInt(0, 2), a = randInt(2, 30);
    x = randInt(1, 30);
    if (form === 0) { L = [{ k: 1 }, { n: a }]; R = [{ n: x + a }]; }
    else if (form === 1) { L = [{ n: a }, { k: 1 }]; R = [{ n: a + x }]; }
    else { x += a; L = [{ k: 1 }, { n: -a }]; R = [{ n: x - a }]; }
    key = "add:" + form + ":" + a + ":" + x;
  } else if (lv === "mul") {
    const a = randInt(2, 10);
    x = randInt(2, 12);
    L = [{ k: a }]; R = [{ n: a * x }];
    key = "mul:" + a + ":" + x;
  } else if (lv === "two") {
    const a = randInt(2, 9), b = randInt(1, 20), minus = Math.random() < 0.4;
    x = randInt(1, 12);
    if (minus && a * x - b < 1) x = Math.ceil((b + 1) / a) + randInt(0, 3);
    L = [{ k: a }, { n: minus ? -b : b }]; R = [{ n: a * x + (minus ? -b : b) }];
    key = "two:" + a + ":" + (minus ? -b : b) + ":" + x;
  } else {
    const c = randInt(1, 4), k = randInt(1, 4), b = randInt(1, 15);
    x = randInt(1, 10);
    L = [{ k: c + k }, { n: b }]; R = [{ k: c }, { n: k * x + b }];
    if (Math.random() < 0.3) { const s = L; L = R; R = s; }
    key = "both:" + c + ":" + k + ":" + b + ":" + x + ":" + (L[0].k === c ? "r" : "l");
  }
  return { lv, L, R, x, key, text: sideText(L) + " = " + sideText(R) };
}

// The steps to solve it, one short sentence each: undo the number, then share.
function explain(p) {
  const L = p.L, R = p.R, x = p.x;
  if (p.lv === "box") {
    const a = L.find(q => q.n !== undefined).n, c = R[0].n;
    return a > 0 ? t("ebBoxAdd", { a: fmt(a), c: fmt(c), x: fmt(x) }) : t("ebBoxSub", { a: fmt(-a), c: fmt(c), x: fmt(x) });
  }
  const steps = [];
  // x on both sides: take the smaller lot of x away first, so x is only on the bigger side.
  let k, b, c;
  if (p.lv === "both") {
    const big = L[0].k > R[0].k ? L : R, other = big === L ? R : L;
    k = big[0].k - other[0].k; b = big[1].n; c = other[1].n;
    steps.push(t("ebTakeX", { t: xTerm(other[0].k), lhs: xTerm(k) + " + " + fmt(b), c: fmt(c) }));
  } else {
    const xs = L.find(q => q.k), num = L.find(q => q.n !== undefined);
    k = xs.k; b = num ? num.n : 0; c = R[0].n;
  }
  if (b > 0) steps.push(t("ebTake", { a: fmt(b), lhs: xTerm(k), c: fmt(c), m: fmt(c - b) }));
  else if (b < 0) steps.push(t("ebAdd", { a: fmt(-b), lhs: xTerm(k), c: fmt(c), m: fmt(c - b) }));
  if (k > 1) steps.push(t("ebShare", { a: fmt(k), c: fmt(c - b), x: fmt(x) }));
  return steps.join(" ");
}
// GEN END

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), eqEl = $("eq"), solveEl = $("solve"), feedbackEl = $("feedback"), goBtn = $("k-go"), svg = $("seesaw");
  const lvBtns = [...document.querySelectorAll("#lv-seg button")];
  const digitBtns = [...document.querySelectorAll("#pad [data-d]")];
  const NS = "http://www.w3.org/2000/svg";

  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = window.Loopy ? Loopy.getAge() : 12;
  let lv;
  // The level is remembered per age, so each age starts at the right one.
  const loadForAge = () => {
    lv = store.get("eb.lv.a" + age, levelForAge(age), LEVELS);
    // Opened from the grown-ups' page to practise one level: set it for this visit, without saving.
    const m = /^eb-([a-z]+)$/.exec(Loopy.log.hint || "");
    if (m && LEVELS.includes(m[1])) { lv = m[1]; Loopy.log.hint = ""; }
  };
  loadForAge();
  if (window.Loopy && Loopy.levels) Loopy.levels.init({ names: LEVELS.map(levelName),
    get: () => LEVELS.indexOf(lv), base: () => LEVELS.indexOf(levelForAge(age)),
    set: (i) => { lv = LEVELS[i]; store.set("eb.lv.a" + age, lv); recent = []; render(); } });

  let right = 0, tried = 0, streak = 0;
  let current = null, typed = "", answered = false, recent = [];
  let ansEl = null, beam = null;

  // The see-saw: a beam on a stand. x is a blue block, a number a weight, a minus number a balloon that pulls up.
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function label(parent, x, y, text, size, color) {
    const n = el("text", { x, y, "text-anchor": "middle", "dominant-baseline": "central", "font-size": size, fill: color }, parent);
    n.textContent = text;
  }
  // The things on one side, side by side and centred on cx. Many x blocks become one wide block ("5x").
  function drawSide(side, cx) {
    const items = [];
    side.forEach(p => {
      if (p.box) items.push({ w: 46, kind: "box" });
      else if (p.k && p.k <= 3) for (let i = 0; i < p.k; i++) items.push({ w: 42, kind: "x", text: "x" });
      else if (p.k) items.push({ w: 66, kind: "x", text: xTerm(p.k) });
      else items.push({ w: 30 + 14 * String(Math.abs(p.n)).length, kind: p.n < 0 ? "up" : "n", text: fmt(Math.abs(p.n)) });
    });
    // Too wide for its half of the beam: the x blocks become one wide block.
    if (items.filter(i => i.kind === "x").length > 1 && items.reduce((s, i) => s + i.w + 5, 0) > 165) {
      const k = side.find(p => p.k).k, at = items.findIndex(i => i.kind === "x");
      const rest = items.filter(i => i.kind !== "x");
      rest.splice(at, 0, { w: 66, kind: "x", text: xTerm(k) });
      items.length = 0; items.push(...rest);
    }
    const gap = 5, total = items.reduce((s, i) => s + i.w, 0) + gap * (items.length - 1);
    let x0 = cx - total / 2;
    const TOP = 144;
    items.forEach(i => {
      const mid = x0 + i.w / 2;
      if (i.kind === "x") {
        el("rect", { x: x0, y: TOP - 42, width: i.w, height: 42, rx: 7, fill: "var(--c1)" }, beam);
        label(beam, mid, TOP - 21, i.text, 24, "var(--on-accent)");
      } else if (i.kind === "box") {
        el("rect", { x: x0 + 1.5, y: TOP - 44.5, width: i.w - 3, height: 43, rx: 7, fill: "var(--card)", stroke: "var(--c1)", "stroke-width": 3, "stroke-dasharray": "6 4" }, beam);
        label(beam, mid, TOP - 22, "?", 24, "var(--c1)");
      } else if (i.kind === "n") {
        el("path", { d: `M${x0 + 6} ${TOP - 3} L${x0 + i.w - 6} ${TOP - 3} L${x0 + i.w - 11} ${TOP - 38} L${x0 + 11} ${TOP - 38} Z`, fill: "var(--c2)", "stroke-linejoin": "round", stroke: "var(--c2)", "stroke-width": 6 }, beam);
        el("path", { d: `M${mid - 9} ${TOP - 42} a9 9 0 0 1 18 0`, fill: "none", stroke: "var(--c2)", "stroke-width": 5 }, beam);
        label(beam, mid, TOP - 20, i.text, 22, "var(--on-accent)");
      } else {
        // A balloon tied to the beam: it lifts, so it takes weight away.
        el("path", { d: `M${mid} ${TOP} q-7 -18 0 -36`, fill: "none", stroke: "var(--muted)", "stroke-width": 2 }, beam);
        const r = Math.max(22, i.w / 2);
        el("ellipse", { cx: mid, cy: TOP - 36 - r * 1.1, rx: r, ry: r * 1.1, fill: "var(--c4)" }, beam);
        label(beam, mid, TOP - 36 - r * 1.1, "−" + i.text, 20, "var(--on-accent)");
      }
      x0 += i.w + gap;
    });
  }
  function drawSeesaw() {
    svg.innerHTML = "";
    el("path", { d: "M200 152 L176 192 L224 192 Z", fill: "var(--muted)", "stroke-linejoin": "round", stroke: "var(--muted)", "stroke-width": 4 }, svg);
    el("rect", { x: 140, y: 192, width: 120, height: 6, rx: 3, fill: "var(--line)" }, svg);
    beam = el("g", { class: "beam" }, svg);
    el("rect", { x: 22, y: 144, width: 356, height: 10, rx: 5, fill: "var(--ink)" }, beam);
    el("circle", { cx: 200, cy: 150, r: 5, fill: "var(--card)" }, beam);
    drawSide(current.L, 108);
    drawSide(current.R, 292);
  }
  // Level when both sides weigh the same; otherwise the heavier side goes down (at most 14 degrees).
  function tilt(y) {
    beam.classList.remove("wobble");
    const d = value(current.R, y) - value(current.L, y);
    const deg = d === 0 ? 0 : Math.sign(d) * Math.min(14, 5 + Math.abs(d) / Math.max(1, Math.abs(value(current.R, current.x))) * 20);
    beam.style.transform = "rotate(" + deg.toFixed(1) + "deg)";
  }

  const isBox = () => current.lv === "box";
  function spoken() {
    const words = current.text.replace(/□/g, t("ebBoxW")).replace(/(\d)x/g, "$1 x").replace(/ \+ /g, " " + t("ebPlusW") + " ")
      .replace(/ − /g, " " + t("ebMinusW") + " ").replace(/ = /g, " " + t("ebEqW") + " ");
    return t(isBox() ? "ebSayBox" : "ebSay", { eq: words });
  }

  // The equation line. In the box level the answer is written in the box; otherwise on a second line, "x = ?".
  function drawEquation() {
    eqEl.innerHTML = ""; solveEl.innerHTML = "";
    const ans = document.createElement("span");
    ans.className = "ans empty"; ans.setAttribute("role", "textbox"); ans.setAttribute("aria-readonly", "true");
    ans.setAttribute("aria-label", t("yourAnswer"));
    const part = (text, cls) => { const s = document.createElement("span"); if (cls) s.className = cls; s.textContent = text; return s; };
    current.text.split(" ").forEach(w => {
      if (w === "□") eqEl.appendChild(ans);
      else if (w === "+" || w === "−") eqEl.appendChild(part(w, "op"));
      else if (w === "=") eqEl.appendChild(part(w, "eqs"));
      else if (/x$/.test(w)) { const s = part(w.slice(0, -1)); s.appendChild(part("x", "xv")); eqEl.appendChild(s); }
      else eqEl.appendChild(part(w));
    });
    solveEl.hidden = isBox();
    if (!isBox()) { solveEl.appendChild(part("x", "xv")); solveEl.appendChild(part("=", "eqs")); solveEl.appendChild(ans); }
    eqEl.setAttribute("aria-label", spoken());
    ansEl = ans;
  }

  function render() {
    if (window.Loopy && Loopy.levels) Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    lvBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lv === lv)));
    ansEl.textContent = typed === "" ? "" : fmt(parseInt(typed, 10));
    ansEl.classList.toggle("empty", !answered && typed === "");
    goBtn.textContent = t(answered ? "next" : "check");
    goBtn.disabled = !answered && typed === "";
    digitBtns.forEach(b => b.disabled = answered);
    $("k-erase").disabled = answered || typed === "";
  }

  // Try again: a missed equation comes back later (Loopy.retry). The note is the problem's key, which holds the
  // level and every number: "box:0:5:12", "add:2:7:20", "mul:3:4", "two:3:-5:7" or "both:2:1:5:3:l".
  const note = (p) => p.key;
  function rebuild(r) {
    const m = /^(box|add|mul|two|both)((?::(?:0|-?[1-9]\d{0,2})){2,4})(?::([lr]))?$/.exec(r);
    if (!m) return null;
    const level = m[1], v = m[2].slice(1).split(":").map(Number), [a, b, c, d] = v, side = m[3];
    const within = (x, lo, hi) => x >= lo && x <= hi;
    let L, R, x;
    if ((level === "box" || level === "add") && v.length === 3 && !side) {
      const lo = level === "box" ? 1 : 2, top = level === "box" ? 20 : 30;
      x = c;
      if (!within(a, 0, 2) || !within(b, lo, top) || !within(x - (a === 2 ? b : 0), 1, top)) return null;
      const one = level === "box" ? { box: true } : { k: 1 };
      if (a === 0) { L = [one, { n: b }]; R = [{ n: x + b }]; }
      else if (a === 1) { L = [{ n: b }, one]; R = [{ n: b + x }]; }
      else { L = [one, { n: -b }]; R = [{ n: x - b }]; }
    } else if (level === "mul" && v.length === 2 && !side) {
      x = b;
      if (!within(a, 2, 10) || !within(x, 2, 12)) return null;
      L = [{ k: a }]; R = [{ n: a * x }];
    } else if (level === "two" && v.length === 3 && !side) {
      x = c;
      if (!within(a, 2, 9) || !b || !within(Math.abs(b), 1, 20) || !within(x, 1, 20) || a * x + b < 1) return null;
      L = [{ k: a }, { n: b }]; R = [{ n: a * x + b }];
    } else if (level === "both" && v.length === 4 && side) {
      x = d;
      if (!within(a, 1, 4) || !within(b, 1, 4) || !within(c, 1, 15) || !within(x, 1, 10)) return null;
      L = [{ k: a + b }, { n: c }]; R = [{ k: a }, { n: b * x + c }];
      if (side === "r") { const s = L; L = R; R = s; }
    } else return null;
    return { lv: level, L, R, x, key: r, text: sideText(L) + " = " + sideText(R) };
  }

  function newRound() {
    current = Loopy.retry.fresh("equation-balance", recent, () => makeProblem(lv, age), rebuild);
    typed = ""; answered = false;
    card.className = "problem-card";
    feedbackEl.className = "feedback";
    feedbackEl.innerHTML = '<span class="hint"></span>';
    feedbackEl.firstChild.textContent = t(isBox() ? "ebHintBox" : "ebHint");
    drawSeesaw();
    beam.classList.add("wobble");
    drawEquation();
    render();
    Loopy.speech.read();
  }

  function press(d) {
    if (answered || typed.length >= 3) return;
    if (typed === "0") typed = "";
    typed += d;
    render();
  }
  function erase() {
    if (answered) return;
    typed = typed.slice(0, -1);
    render();
  }
  function check() {
    if (answered || typed === "") return;
    answered = true; tried++;
    const y = parseInt(typed, 10), ok = y === current.x;
    if (ok) { right++; streak++; } else { streak = 0; }
    if (window.Loopy && Loopy.rewards) ok ? Loopy.rewards.correct("equation-balance", streak) : Loopy.rewards.wrong("equation-balance", { q: current.text, a: fmt(current.x), y: fmt(y), k: "eb-" + current.lv, r: note(current) });
    tilt(y);
    card.className = "problem-card " + (ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    const head = ok
      ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct"))
      : t("notQuite") + " " + (isBox() ? "□" : "x") + " = " + fmt(current.x) + ".";
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = head;
    feedbackEl.appendChild(document.createTextNode(explain(current)));
    render();
  }
  function go() { answered ? newRound() : check(); }

  digitBtns.forEach(b => b.addEventListener("click", () => press(b.dataset.d)));
  $("k-erase").addEventListener("click", erase);
  goBtn.addEventListener("click", go);
  lvBtns.forEach(b => b.addEventListener("click", () => {
    lv = b.dataset.lv; store.set("eb.lv.a" + age, lv); recent = []; newRound();
  }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; if (window.Loopy && Loopy.recent) Loopy.recent.clear("equation-balance"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".loopy-cheer.big")) return;
    if (e.target.tagName === "INPUT") return;
    if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { erase(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement !== goBtn) return;
      go(); e.preventDefault();
    }
  });

  // Read aloud: "3 x plus 5 equals 20. What is x?"
  Loopy.speech.question({ host: card, text: spoken });

  // Print worksheet: 20 equations at the same level, like "3x + 5 = 20   x = ____".
  Loopy.worksheet({
    title: () => t("ebName"),
    level: () => [t("ageLabel", { n: age }), t(levelName(lv))].join(" · "),
    how: () => t("ebHow"),
    layout: "line",
    make: (n) => { const list = [], keys = []; for (let i = 0; list.length < n; i++) { const p = makeProblem(lv, age); if (keys.includes(p.key) && i < 400) continue; keys.push(p.key); list.push(p); } return list; },
    cell: (p) => {
      const line = document.createElement("span");
      line.className = "ws-sl";
      const blank = document.createElement("span");
      blank.className = "ws-blank";
      if (p.lv === "box") {
        const [a, b] = p.text.split("□");
        line.appendChild(document.createTextNode(a));
        line.appendChild(blank);
        line.appendChild(document.createTextNode(b));
      } else {
        line.appendChild(document.createTextNode(p.text));
        const xs = document.createElement("span");
        xs.className = "eb-x";
        xs.textContent = "x =";
        line.appendChild(xs);
        line.appendChild(blank);
      }
      return line;
    },
    answer: (p) => (p.lv === "box" ? p.text.replace("□", fmt(p.x)) : p.text + " → x = " + fmt(p.x))
  });

  newRound();
})();
</script>
