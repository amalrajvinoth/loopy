<style>
/* Layout: one centered column like a worksheet strip; problem written vertically on a card, big number pad below, toggles in a quiet bar on top. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

/* Vertical problem, written like the worksheets: operator on the left, digits right-aligned. */
.vert {
  display: grid; grid-template-columns: auto auto; column-gap: 0.35em;
  font-size: clamp(3.4rem, 15vw, 4.6rem); font-weight: 600; line-height: 1.12;
  font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
}
.vert .num { grid-column: 2; text-align: right; min-width: 3ch; }
.vert .op { grid-column: 1; grid-row: 2; color: var(--accent); }
.vert .rule { grid-column: 1 / -1; height: 0.07em; background: var(--ink); border-radius: 2px; margin: 0.1em 0 0.12em; }
.vert .ans {
  grid-column: 2; text-align: right; min-width: 3ch; min-height: 1.12em;
  color: var(--accent); position: relative;
}
.vert .ans.empty::after {
  content: ""; position: absolute; right: 0; bottom: 0.12em; width: 0.55em; height: 0.07em;
  background: var(--mark); border-radius: 2px; animation: blink 1s steps(2, start) infinite;
}
.problem-card.good .ans { color: var(--good); }
.problem-card.bad .ans { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.06em; }
@keyframes blink { to { visibility: hidden; } }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .erase { font-size: 1.15rem; color: var(--muted); }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .pad button { min-height: 64px; font-size: 1.8rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .vert .ans.empty::after { animation: none; }
}
</style>

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 14px 14px 12px; gap: 8px; }
.vert { font-size: clamp(2.4rem, min(15vw, 8.5vh), 5rem); font-size: clamp(2.4rem, min(15vw, 8.5dvh), 5rem); }
.feedback { min-height: 2.9em; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }
.pad { gap: 8px; }
.pad button { min-height: clamp(50px, 8vh, 92px); min-height: clamp(50px, 8dvh, 92px); }
@media (min-width: 600px) and (orientation: portrait) {
  .vert { font-size: clamp(3rem, 10dvh, 7rem); }
  .pad button { min-height: clamp(60px, 10dvh, 120px); font-size: 2.4rem; }
}
@media (orientation: landscape) and (min-width: 640px) {
  .problem-card { height: 100%; justify-content: center; }
  .vert { font-size: clamp(2.2rem, min(7vw, 13dvh), 7rem); }
  .pad button { min-height: clamp(44px, calc((100dvh - 150px) / 4.4), 130px); }
}
/* Short phones: keep long explanations from pushing the number pad off screen. */
@media (max-height: 760px) and (orientation: portrait) {
  .feedback { font-size: 0.95rem; line-height: 1.35; }
  .feedback strong { font-size: 1.15rem; }
}

/* Portrait: the page is exactly one screen tall; the pad or answers stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
}
@media (orientation: portrait) {
  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .problem-card { min-height: 0; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
/* After answering on smaller screens, shrink the sum so the reason has room. */
@media (max-height: 900px), (max-width: 599px) {
  .problem-card.good .vert, .problem-card.bad .vert { zoom: 0.7; }
}
@media (max-height: 500px) {
  .feedback { font-size: 0.9rem; line-height: 1.3; }
  .feedback strong { font-size: 1.05rem; }
}
</style>

<body>

<div class="wrap">
  <header class="game-bar">
    <a class="home-link" href="../../">&larr; Loopy</a>
    <div class="bar-right">
      <span id="star-chip"></span>
      <button type="button" id="settings-toggle" aria-controls="settings-panel"></button>
    </div>
  </header>
  <div class="top">
    <h1 id="title">Plus and Minus to 100</h1>
    <div class="score" aria-live="polite">
      <div class="pill"><span data-t="score">Score</span><b id="score">0 / 0</b></div>
      <div class="pill"><span data-t="streak">Streak</span><b id="streak">0</b></div>
    </div>
  </div>
  <div class="settings-panel" id="settings-panel" hidden>
    <div class="controls"><div id="age-picker"></div><div id="theme-picker"></div><button id="sound-toggle"></button><div id="lang-picker"></div></div>
    <div>
      <p class="seg-label" id="op-label" data-t="problems">Problems</p>
      <div class="seg" role="group" aria-labelledby="op-label" id="op-seg">
        <button type="button" id="op-add" data-op="add" data-t="adding">Adding</button>
        <button type="button" id="op-sub" data-op="sub" data-t="takingAway">Taking away</button>
        <button type="button" id="op-mix" data-op="mix" data-t="both">Both</button>
      </div>
    </div>
    <div>
      <p class="seg-label" id="rg-label" data-t="regrouping">Regrouping</p>
      <div class="seg" role="group" aria-labelledby="rg-label" id="rg-seg">
        <button type="button" id="rg-no" data-rg="no" data-t="none">None</button>
        <button type="button" id="rg-mix" data-rg="mix" data-t="some">Some</button>
        <button type="button" id="rg-yes" data-rg="yes" data-t="always">Always</button>
      </div>
    </div>
    <div class="panel-foot">
      <p data-t="kbdHint">Keyboard works too: numbers, Backspace, Enter.</p>
      <button type="button" class="reset" id="reset" data-t="resetScore">Reset score</button>
    </div>
  </div>

  <main class="play">
    <div class="problem-card" id="card">
      <div class="vert" id="vert" aria-live="polite">
        <div class="num" id="top-num">47</div>
        <div class="op" id="op-sign">+</div>
        <div class="num" id="bot-num">25</div>
        <div class="rule"></div>
        <div class="ans empty" id="ans" aria-label="Your answer" data-t-aria="yourAnswer"></div>
      </div>
      <p class="feedback" id="feedback"><span class="hint" data-t="tapHint">Tap the numbers to write your answer.</span></p>
    </div>

    <div class="pad" id="pad">
      <button type="button" id="k1" data-d="1">1</button>
      <button type="button" id="k2" data-d="2">2</button>
      <button type="button" id="k3" data-d="3">3</button>
      <button type="button" id="k4" data-d="4">4</button>
      <button type="button" id="k5" data-d="5">5</button>
      <button type="button" id="k6" data-d="6">6</button>
      <button type="button" id="k7" data-d="7">7</button>
      <button type="button" id="k8" data-d="8">8</button>
      <button type="button" id="k9" data-d="9">9</button>
      <button type="button" id="k-erase" class="erase" aria-label="Erase last digit" data-t-aria="eraseAria" data-t="erase">Erase</button>
      <button type="button" id="k0" data-d="0">0</button>
      <button type="button" id="k-go" class="go" data-t="check">Check</button>
    </div>
  </main>
</div>

<script>
Loopy.addStrings({
  en: {
    pmName: "Plus and Minus", pmTitle: "Plus and Minus to {max}",
    problems: "Problems", adding: "Adding", takingAway: "Taking away",
    regrouping: "Regrouping", none: "None", some: "Some", always: "Always",
    place0: "Ones", place1: "Tens", place2: "Hundreds", place3: "Thousands", place4: "Ten thousands",
    one1: "ten", one2: "hundred", one3: "thousand", one4: "ten thousand",
    pmCarry: "Write {w} and carry 1 {next}",
    pmCant: "you can't take {b} from {a}, so trade 1 {next} for 10 {place}",
    pmTrade: "trade 1 {next} for 10 {place}",
    pmTrySome: "Try some regrouping problems", pmTryAll: "Try regrouping in every problem",
    pmTryMix: "Try adding and taking away mixed together", plus: "plus", minus: "minus"
  },
  de: {
    pmName: "Plus und Minus", pmTitle: "Plus und Minus bis {max}",
    problems: "Aufgaben", adding: "Plus", takingAway: "Minus",
    regrouping: "Übertrag", none: "Nie", some: "Manchmal", always: "Immer",
    place0: "Einer", place1: "Zehner", place2: "Hunderter", place3: "Tausender", place4: "Zehntausender",
    one1: "Zehner", one2: "Hunderter", one3: "Tausender", one4: "Zehntausender",
    pmCarry: "Schreibe {w} und übertrage 1 {next}",
    pmCant: "{b} von {a} geht nicht, also tausche 1 {next} gegen 10 {place}",
    pmTrade: "tausche 1 {next} gegen 10 {place}",
    pmTrySome: "Probiere ein paar Aufgaben mit Übertrag", pmTryAll: "Probiere Übertrag in jeder Aufgabe",
    pmTryMix: "Probiere Plus und Minus gemischt", plus: "plus", minus: "minus"
  }
});

// GEN START
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

// How big the numbers get for each age (grade 1 is about age 6).
function maxForAge(age) {
  if (age <= 6) return 20;
  if (age <= 8) return 100;
  if (age <= 10) return 1000;
  return 10000;
}
function defaultsForAge(age) {
  return { op: age <= 6 ? "add" : "mix", rg: age <= 7 ? "no" : "mix" };
}

const digitSum = (n) => String(n).split("").reduce((t, d) => t + +d, 0);
// Does this problem need regrouping (carrying or trading) in any column?
function needsRegroup(op, a, b) {
  return op === "add" ? digitSum(a) + digitSum(b) !== digitSum(a + b) : digitSum(a - b) + digitSum(b) !== digitSum(a);
}

// One random problem: numbers and results up to max, never negative, never zero.
function makeProblem(opMode, rgMode, avoid, max) {
  max = max || 100;
  const lo = max >= 1000 ? max / 10 : (max >= 100 ? 10 : 2);
  for (let tries = 0; tries < 5000; tries++) {
    const op = opMode === "mix" ? (Math.random() < 0.5 ? "add" : "sub") : opMode;
    const wantRg = rgMode === "mix" ? Math.random() < 0.5 : rgMode === "yes";
    const small = Math.random() < 0.2 ? 2 : lo;
    let a, b;
    if (op === "add") {
      a = randInt(lo, max - lo);
      if (max - a < small) continue;
      b = randInt(small, max - a);
    } else {
      a = randInt(lo + 1, max);
      if (a - 1 < small) continue;
      b = randInt(small, a - 1);
    }
    if (needsRegroup(op, a, b) !== wantRg) continue;
    const k = op + a + "," + b;
    if (avoid && avoid.includes(k)) continue;
    return { op, a, b, key: k, answer: op === "add" ? a + b : a - b };
  }
  return { op: "add", a: 12, b: 5, key: "add12,5", answer: 17 };
}

const t = Loopy.t;
const place = (i) => t("place" + i);
const digit = (n, i) => Math.floor(n / Math.pow(10, i)) % 10;

// A short reason, column by column, the way it is done on paper.
function explain(p) {
  const cols = String(Math.max(p.a, p.b)).length;
  const parts = [];
  if (p.op === "add") {
    let carry = 0;
    for (let i = 0; i < cols; i++) {
      const da = digit(p.a, i), db = digit(p.b, i), s = da + db + carry;
      let line = place(i) + ": " + da + " + " + db + (carry ? " + 1" : "") + " = " + s;
      if (s >= 10 && i < cols - 1) line += ". " + t("pmCarry", { w: s - 10, next: t("one" + (i + 1)) });
      parts.push(line + ".");
      carry = s >= 10 ? 1 : 0;
    }
  } else {
    let borrow = 0;
    for (let i = 0; i < cols; i++) {
      const da = digit(p.a, i) - borrow, db = digit(p.b, i);
      if (i === cols - 1 && da === 0 && db === 0) break;
      if (da < db) {
        const v = { a: da, b: db, next: t("one" + (i + 1)), place: Loopy.lang === "de" ? place(i) : place(i).toLowerCase() };
        parts.push(place(i) + ": " + t(da >= 0 ? "pmCant" : "pmTrade", v) + ": " + (da + 10) + " − " + db + " = " + (da + 10 - db) + ".");
        borrow = 1;
      } else {
        parts.push(place(i) + ": " + da + " − " + db + " = " + (da - db) + ".");
        borrow = 0;
      }
    }
  }
  return parts.join(" ");
}
// GEN END

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), ansEl = $("ans"), feedbackEl = $("feedback"), goBtn = $("k-go");
  const opBtns = [...document.querySelectorAll("#op-seg button")];
  const rgBtns = [...document.querySelectorAll("#rg-seg button")];
  const digitBtns = [...document.querySelectorAll("#pad [data-d]")];

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let age = window.Loopy ? Loopy.getAge() : 8;
  let max, opMode, rgMode;
  // Settings are remembered per age, so each age starts at the right level.
  function loadForAge() {
    const d = defaultsForAge(age);
    max = maxForAge(age);
    opMode = store.get("pm100.op.a" + age, d.op);
    rgMode = store.get("pm100.rg.a" + age, d.rg);
    $("title").textContent = t("pmTitle", { max: Loopy.num(max) });
  }
  loadForAge();
  let right = 0, tried = 0, streak = 0;
  let current = null, typed = "", answered = false, recent = [];

  function render() {
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    opBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.op === opMode)));
    rgBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.rg === rgMode)));
    ansEl.textContent = typed === "" ? "" : Loopy.num(parseInt(typed, 10));
    ansEl.classList.toggle("empty", !answered && typed === "");
    goBtn.textContent = t(answered ? "next" : "check");
    goBtn.disabled = !answered && typed === "";
    digitBtns.forEach(b => b.disabled = answered);
    $("k-erase").disabled = answered || typed === "";
  }

  function newRound() {
    current = makeProblem(opMode, rgMode, recent, max);
    recent.push(current.key);
    if (recent.length > 15) recent.shift();
    typed = ""; answered = false;
    $("top-num").textContent = Loopy.num(current.a);
    $("bot-num").textContent = Loopy.num(current.b);
    $("op-sign").textContent = current.op === "add" ? "+" : "−";
    $("vert").setAttribute("aria-label", current.a + " " + t(current.op === "add" ? "plus" : "minus") + " " + current.b);
    card.className = "problem-card";
    feedbackEl.className = "feedback";
    feedbackEl.innerHTML = '<span class="hint"></span>';
    feedbackEl.firstChild.textContent = t("tapHint");
    render();
  }

  function press(d) {
    if (answered || typed.length >= String(max).length) return;
    if (typed === "0") typed = "";
    typed += d;
    render();
  }
  function erase() {
    if (answered) return;
    typed = typed.slice(0, -1);
    render();
  }
  function check() {
    if (answered || typed === "") return;
    answered = true; tried++;
    const ok = parseInt(typed, 10) === current.answer;
    if (ok) { right++; streak++; } else { streak = 0; }
    if (window.Loopy && Loopy.rewards) ok ? Loopy.rewards.correct("plus-minus", streak, harder()) : Loopy.rewards.wrong();
    card.className = "problem-card " + (ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    const sign = current.op === "add" ? " + " : " − ";
    const fmtN = Loopy.num;
    const head = ok
      ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct"))
      : t("notQuite") + " " + fmtN(current.a) + sign + fmtN(current.b) + " = " + fmtN(current.answer) + ".";
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = head;
    feedbackEl.appendChild(document.createTextNode(explain(current)));
    render();
  }
  // What "Make it harder" does after 10 in a row: more regrouping first, then mixed adding and taking away.
  function harder() {
    if (rgMode !== "yes") {
      const next = rgMode === "no" ? "mix" : "yes";
      return { label: t(next === "mix" ? "pmTrySome" : "pmTryAll"),
        apply: () => { rgMode = next; store.set("pm100.rg.a" + age, rgMode); render(); } };
    }
    if (opMode !== "mix") {
      return { label: t("pmTryMix"),
        apply: () => { opMode = "mix"; store.set("pm100.op.a" + age, opMode); render(); } };
    }
    return null;
  }
  function go() { answered ? newRound() : check(); }

  digitBtns.forEach(b => b.addEventListener("click", () => press(b.dataset.d)));
  $("k-erase").addEventListener("click", erase);
  goBtn.addEventListener("click", go);
  opBtns.forEach(b => b.addEventListener("click", () => {
    opMode = b.dataset.op; store.set("pm100.op.a" + age, opMode); newRound();
  }));
  rgBtns.forEach(b => b.addEventListener("click", () => {
    rgMode = b.dataset.rg; store.set("pm100.rg.a" + age, rgMode); newRound();
  }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".loopy-cheer.big")) return;
    if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { erase(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement !== goBtn) return;
      go(); e.preventDefault();
    }
  });

  newRound();
})();
</script>
</body>
</html>
