<style>
/* Layout: a chart and a question, answer buttons below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 14px 14px 12px; gap: 8px; }
.feedback { min-height: 2.9em; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }
/* Short phones: keep long explanations from pushing the answers off screen. */
@media (max-height: 760px) and (orientation: portrait) {
  .feedback { font-size: 0.95rem; line-height: 1.35; }
  .feedback strong { font-size: 1.15rem; }
}

/* Portrait: the page is exactly one screen tall; the answers stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
}
@media (orientation: portrait) {
  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .problem-card { min-height: 0; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (max-height: 500px) {
  .feedback { font-size: 0.9rem; line-height: 1.3; }
  .feedback strong { font-size: 1.05rem; }
}

/* Graphs and Data: a chart (SVG drawn by the script) or a small table, a question, and answers to pick from. */
/* The chart yields its height first: on a short phone it shrinks until the question and the answers fit. */
.chart { width: 100%; max-width: 380px; display: flex; align-items: center; justify-content: center; flex: 1 1 auto; min-height: 0; }
.chart svg { width: 100%; height: 100%; max-height: min(28dvh, 200px); display: block; font-weight: 600; }
.feedback:empty { min-height: 0; }
.chart .bar { fill: var(--c1); }
.chart .bar.b { fill: var(--c2); }
.chart .ta { fill: var(--c1); }
.chart .tb { fill: var(--c2); }
.chart .ln { fill: none; stroke: var(--c1); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--c1); }
.chart .grid { stroke: currentColor; opacity: 0.18; }
.chart .base { stroke: currentColor; stroke-width: 1.5; }
.chart .lbl { font-weight: 400; }
.chart .muted { opacity: 0.7; }
table.data { border-collapse: collapse; font-size: clamp(0.9rem, 2.4dvh, 1.15rem); font-variant-numeric: tabular-nums; }
.data th, .data td { padding: 2px 12px; text-align: left; border-bottom: 1px solid var(--line); line-height: 1.35; }
.data td:not(:first-child), .data th:not(:first-child) { text-align: right; }
.data thead th { color: var(--muted); font-weight: 600; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.04em; }
.data tbody th { font-weight: 600; }
.data td.b, .data th.b { color: var(--c2); }
.data td.a, .data th.a { color: var(--c1); }
.question { margin: 0; font-size: clamp(1.05rem, min(5vw, 3.1dvh), 1.7rem); font-weight: 700; line-height: 1.25;
  text-align: center; max-width: 32ch; text-wrap: balance; }
.side { display: flex; flex-direction: column; gap: 10px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
/* Three answers: one column, so no answer looks bigger than the others. */
.choices.three { grid-template-columns: 1fr; }
.choices.three button { min-height: clamp(48px, 7dvh, 80px); }
.choices button {
  font: inherit; font-size: clamp(1.1rem, min(5.2vw, 3.4dvh), 1.8rem); font-weight: 700; color: var(--ink); line-height: 1.2;
  font-variant-numeric: tabular-nums;
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: clamp(56px, 9dvh, 96px); padding: 6px 10px; cursor: pointer;
  overflow-wrap: anywhere; hyphens: auto;
  transition: transform .08s ease, border-color .15s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button:active:not(:disabled) { transform: scale(0.96); }
.choices button:disabled { cursor: default; }
.choices button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.faded { opacity: 0.45; }
.next { font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(52px, 7dvh, 72px); cursor: pointer; width: 100%; }
.seg button { padding-inline: 4px; }
@media (min-width: 600px) and (orientation: portrait) {
  .choices button { min-height: clamp(64px, 10dvh, 120px); }
  .chart svg { max-height: min(32dvh, 300px); }
  .chart { max-width: 520px; }
}
@media (orientation: landscape) and (min-width: 640px) {
  .problem-card { height: 100%; justify-content: center; }
  .side { height: 100%; justify-content: center; }
  .choices button { min-height: clamp(52px, 14dvh, 130px); }
  .chart svg { max-height: min(48dvh, 300px); }
}
/* After the answer the chart gets smaller, so the question and the reason have room. */
@media (max-height: 900px), (max-width: 599px) {
  .problem-card.good .chart, .problem-card.bad .chart { zoom: 0.7; }
}
@media (max-height: 700px) {
  .question { font-size: clamp(1rem, min(4.6vw, 3dvh), 1.4rem); }
  .problem-card.good .chart, .problem-card.bad .chart { display: none; }
}
@media (max-height: 500px) {
  .question { font-size: 1rem; }
  .problem-card.good .chart, .problem-card.bad .chart { display: none; }
}

/* Worksheet cells (only printed): a small chart, the question, and a line to write the answer. */
@media print {
  .sheet-grid li > div.ws-gd { align-items: center; gap: 1mm; padding: 0 2mm; width: 100%; }
  .ws-gd .ws-chart { width: 38mm; height: 19mm; display: block; }
  .ws-gd .ws-q { margin: 0; font-size: 7.5pt; font-weight: 600; line-height: 1.2; text-align: center; }
  .ws-gd .ws-blank { display: inline-block; width: 16mm; border-bottom: 0.4mm solid #000; height: 5mm; }
  .ws-gd table.data { font-size: 7pt; border-collapse: collapse; }
  .ws-gd .data th, .ws-gd .data td { padding: 0 2mm; border-bottom: 0.2mm solid #999; line-height: 1.3; text-align: left; }
  .ws-gd .data td:not(:first-child), .ws-gd .data th:not(:first-child) { text-align: right; }
  .ws-gd .data thead th { font-weight: 600; color: #444; }
}
</style>

    render();
    Loopy.speech.read();
  }
  function choose(btn) {
    if (answered) return;
    answered = true; tried++;
    const ok = btn.dataset.correct === "true";
    [...choicesEl.children].forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === "true") b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    if (ok) { right++; streak++; } else { streak = 0; }
    // The progress page keeps 40 letters of the question.
    const q = current.q.length > 40 ? current.q.slice(0, 39) + "…" : current.q;
    if (ok) Loopy.rewards.correct("graphs-data", streak);
    else Loopy.rewards.wrong("graphs-data", { q, a: current.answer, y: btn.textContent, k: current.kind, r: note(current) });
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    // One line of why after every answer; after a wrong one, the right answer first.
    feedbackEl.appendChild(document.createTextNode((ok ? "" : t("gdAnswerIs", { a: current.answer }) + " ") + current.why));
    render();
    nextBtn.focus({ preventScroll: true });
  }

  nextBtn.addEventListener("click", newRound);
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; want = ""; store.set("gd.level.a" + age, level); newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; want = ""; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("graphs-data"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") { newRound(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !answered) { const b = choicesEl.children[n - 1]; if (b) choose(b); }
  });

  // Read aloud: the data as a sentence, then the question and the choices.
  Loopy.speech.question({ host: card, text: () => {
    const o = current.options;
    return t("gdReadQ", { data: current.dataText, q: current.q, list: o.slice(0, -1).join(", ") + " " + t("orWord") + " " + o[o.length - 1] });
  } });

  // Print worksheet: 20 problems at the game's level, each with its own small chart and a line to write on.
  Loopy.worksheet({
    title: () => t("gdName"),
    level: () => [t("ageLabel", { n: age }), t("gdLevel") + ": " + t("gdL" + level)].join(" · "),
    how: () => t("gdHow"),
    layout: "clock",
    make: (n) => {
      const list = [], keys = new Set();
      for (let tries = 0; list.length < n; tries++) {
        const p = makeProblem(level, want);
        if (keys.has(p.key) && tries < 500) continue;
        keys.add(p.key); list.push(p);
      }
      return list;
    },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-gd";
      box.appendChild(draw(p, true));
      const q = document.createElement("p");
      q.className = "ws-q"; q.textContent = p.q;
      box.appendChild(q);
      const blank = document.createElement("span");
      blank.className = "ws-blank";
      box.appendChild(blank);
      return box;
    },
    answer: (p) => p.answer
  });

  newRound();
})();
</script>
</body>
</html>
