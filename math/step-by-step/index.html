<style>
/* Layout: the sum on top of a card, one line per step under it, a number line on the easy levels, the number pad below. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
.seg button:disabled { opacity: 0.4; cursor: default; }
.seg-note { margin: 4px 0 0 4px; font-size: 0.85rem; color: var(--muted); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

/* The three stages when "Split first" is on. */
.stage { display: flex; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.stage span { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.stage span.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }

/* The sum, and under it one line per step: "47 + 20 =" and a box for the number. */
.sum { font-size: clamp(1.8rem, 4.5dvh, 2.6rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.03em; line-height: 1.1; }
.steps { display: flex; flex-direction: column; gap: clamp(6px, 1.2dvh, 10px); width: 100%; max-width: 320px; }
.step { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; font-size: clamp(1.1rem, 2.8dvh, 1.45rem); font-weight: 600; font-variant-numeric: tabular-nums; }
.step span { text-align: right; color: var(--muted); }
.step.now span { color: var(--ink); }
.box {
  display: inline-flex; align-items: center; justify-content: center; min-width: 3.2ch; height: clamp(40px, 6.2dvh, 54px); padding: 0 10px;
  border: 2px solid var(--line); border-radius: 14px; background: var(--chip); font-size: clamp(1.2rem, 3dvh, 1.6rem); position: relative; color: var(--ink);
}
.box.todo { border-style: dashed; color: var(--muted); }
.box.ok { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.box.cur { border-color: var(--accent); color: var(--accent); background: var(--card); }
.box.cur.empty::after {
  content: ""; width: 0.5em; height: 3px; background: var(--mark); border-radius: 2px; animation: blink 1s steps(2, start) infinite;
}
.box.no { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.box.no s { text-decoration-thickness: 2px; }
.box.no b { margin-left: 8px; color: var(--good); font-weight: 700; }
@keyframes blink { to { visibility: hidden; } }

/* The split chips: which two numbers make 25? */
.split { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.split button {
  font: inherit; font-size: clamp(1rem, 2.6dvh, 1.25rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 16px; min-height: clamp(44px, 7dvh, 56px); padding: 0 16px; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.split button.ok { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.split button.no { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.split button:disabled { cursor: default; }

/* The number line: a jump for each step. */
.nl { display: block; width: 100%; max-width: 320px; height: clamp(56px, 11dvh, 96px); overflow: visible; }
.nl text { font-family: var(--font); font-weight: 700; font-size: 15px; fill: var(--ink); }
.nl .rail { stroke: var(--line); stroke-width: 3; stroke-linecap: round; }
.nl .done { stroke: var(--good); fill: none; stroke-width: 3; }
.nl .done-t { fill: var(--good); }
.nl .now { stroke: var(--accent); fill: none; stroke-width: 3; stroke-dasharray: 6 5; }
.nl .now-t { fill: var(--accent); }
.nl .todo { stroke: var(--muted); fill: none; stroke-width: 2; stroke-dasharray: 3 5; opacity: 0.7; }
.nl .todo-t { fill: var(--muted); }
.nl .dot { fill: var(--ink); } .nl .dot.done { fill: var(--good); stroke: none; } .nl .dot.now { fill: var(--accent); stroke: none; } .nl .dot.todo { fill: var(--muted); stroke: none; opacity: 0.7; }

.feedback { min-height: 2.6em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.3rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .erase { font-size: 1.15rem; color: var(--muted); }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .pad button { min-height: 64px; font-size: 1.8rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .box.cur.empty::after { animation: none; }
}
</style>

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }

.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 12px 14px 10px; gap: clamp(6px, 1.4dvh, 12px); }
.feedback { min-height: 2.4em; font-size: 1.02rem; }

.pad { gap: 8px; }
.pad button { min-height: clamp(50px, 8vh, 92px); min-height: clamp(50px, 8dvh, 92px); }
@media (min-width: 600px) and (orientation: portrait) {

  .steps { max-width: 440px; }
  .step { font-size: clamp(1.3rem, 3dvh, 2rem); }
  .box { height: clamp(48px, 6dvh, 72px); font-size: clamp(1.4rem, 3.2dvh, 2.1rem); }
  .nl { max-width: 420px; }
  .pad button { min-height: clamp(60px, 10dvh, 120px); font-size: 2.4rem; }
}
@media (orientation: landscape) and (min-width: 640px) {
  .problem-card { height: 100%; justify-content: center; }
  .pad button { min-height: clamp(44px, calc((100dvh - 150px) / 4.4), 130px); }
  .nl { height: clamp(44px, 14dvh, 96px); }
  .feedback { min-height: 1.5em; }
}
/* Short screens: the number line goes, so the steps and the pad keep their size. */
@media (max-height: 700px) and (orientation: portrait), (max-height: 420px) and (orientation: landscape) {
  .nl { display: none; }
  .feedback { font-size: 0.95rem; line-height: 1.35; min-height: 1.4em; }

  .stage { font-size: 0.75rem; }
  .problem-card.good .sum, .problem-card.bad .sum { font-size: 1.4rem; }
  /* While picking the split, the empty step lines wait, so the question fits. */
  .problem-card.splitting .steps { display: none; }
}

/* Portrait: the page is exactly one screen tall; the pad stays at the bottom and the card shrinks to fit. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

}

}

const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const pick = (list) => list[Math.floor(Math.random() * list.length)];
// The ladder: over the ten (to 20), to 100, to 100 with carrying, to 1,000, with carrying, to 10,000.
const LEVELS = [
  { max: 20, rg: "ten" }, { max: 100, rg: "no" }, { max: 100, rg: "mix" },
  { max: 1000, rg: "no" }, { max: 1000, rg: "mix" }, { max: 10000, rg: "mix" }

const levelForAge = (age) => age <= 6 ? 0 : age <= 10 ? age - 6 : 5;
const WAYS = ["tens", "place", "round"];
// Which ways a level allows: over the ten has its own; place by place needs sums up to 100.
const waysAt = (lv) => lv === 0 ? ["ten"] : lv <= 2 ? WAYS : ["tens", "round"];
const wayAt = (lv, way) => waysAt(lv).includes(way) ? way : waysAt(lv)[0];

const digitSum = (n) => String(n).split("").reduce((t, d) => t + +d, 0);

// The steps of one sum, for one way. Each step: { from, d (signed), to, kind }. fromStep / dStep: the step

function stepsFor(op, a, b, way) {
  const s = op === "add" ? 1 : -1, total = op === "add" ? a + b : a - b;
  const chain = (list) => list.map((st, i) => Object.assign(st, { fromStep: i - 1, dStep: -1 }));
  if (way === "ten") {
    const c1 = op === "add" ? 10 - a : a - 10;
    return chain([{ from: a, d: s * c1, to: 10, kind: "ten" }, { from: 10, d: s * (b - c1), to: total, kind: "rest" }]);
  }
  if (way === "place") {
    const ta = 10 * digit(a, 1), tb = 10 * digit(b, 1), oa = digit(a, 0), ob = digit(b, 0);
    const T = ta + s * tb, O = oa + s * ob;

      { from: oa, d: s * ob, to: O, kind: "place", place: 0, fromStep: -1, dStep: -1 },
      { from: T, d: O, to: total, kind: "together", fromStep: 0, dStep: 1 }];

    const unit = b >= 100 ? 100 : 10, r = Math.round(b / unit) * unit, d = b - r;

  }

  return chain(ps.map((p, i) => { const st = { from: cur, d: s * p, to: cur + s * p, kind: "tens", place: String(p).length - 1, n: i, last: i === ps.length - 1 }; cur = st.to; return st; }));
}

// One random sum for a level, way and kind of problem. Never negative, never zero.
function makeSum(lv, way, opMode, avoid) {
  const L = LEVELS[lv], max = L.max;
  for (let tries = 0; tries < 5000; tries++) {
    const op = opMode === "mix" ? (Math.random() < 0.5 ? "add" : "sub") : opMode;
    let a, b;
    if (way === "ten") {
      if (op === "add") { a = randInt(5, 9); b = randInt(11 - a, 9); }
      else { a = randInt(11, 18); b = randInt(a - 9, 9); }
    } else if (way === "place") {
      // Both numbers have tens and ones. Taking away does not trade, so each place works on its own.
      a = 10 * randInt(1, 8) + randInt(1, 9); b = 10 * randInt(1, 8) + randInt(1, 9);
      if (op === "add" && a + b > 100) continue;
      if (op === "sub" && (digit(a, 1) <= digit(b, 1) || digit(a, 0) < digit(b, 0))) continue;
      if (L.rg === "no" && needsRegroup(op, a, b)) continue;
    } else if (way === "round") {

      const unit = max >= 1000 ? 100 : 10, lo = max >= 1000 ? 100 : 10;

      if (op === "add" && max - b < lo + 1) continue;
      a = op === "add" ? randInt(lo + 1, max - b) : randInt(b + lo, max);
      if (digit(a, 0) === 0) continue;
    } else {
      // Tens first: the number added or taken away has two parts up to 100, three parts above that.
      b = max === 100 ? 10 * randInt(1, 8) + randInt(1, 9) : 100 * randInt(1, 8) + 10 * randInt(1, 9) + randInt(1, 9);

      if (op === "add" && max - b < lo) continue;
      a = op === "add" ? randInt(lo, max - b) : randInt(b + lo, max);
      if (digit(a, 0) === 0) continue;
      const rg = needsRegroup(op, a, b);
      if (L.rg === "no" && rg) continue;
      if (L.rg === "mix" && !rg && Math.random() < 0.6) continue;
    }
    const key = op + a + "," + b + ":" + way;
    if (avoid && avoid.some(k => k.startsWith(key + ":"))) continue;
    return { op, a, b, way, key, answer: op === "add" ? a + b : a - b, steps: stepsFor(op, a, b, way) };

const t = Loopy.t, num = Loopy.num;

// A short reason for one step.

  function check() {
    if (answered || pos.type !== "step" || typed === "") return;
    const st = sum.steps[pos.i], y = parseInt(typed, 10), ok = y === st.to;
    const last = quick() || pos.i === sum.steps.length - 1;
    count(ok, { q: line(st), a: num(st.to), y: num(y), k: "st-" + sum.op, r: note() });
    filled.push(pos.i);
    if (!ok) missed[pos.i] = y;
    // A right step goes straight on to the next one; the box stays green.
    if (ok && !last) return nextStep(pos.i + 1);
    result(ok, ok ? t("stDone", { q: num(sum.a) + sign(sum.op) + num(sum.b), a: num(sum.answer) }) : explain(st, sum));
  }
  function go() { answered ? moveOn() : check(); }

  digitBtns.forEach(b => b.addEventListener("click", () => press(b.dataset.d)));
  $("k-erase").addEventListener("click", erase);
  goBtn.addEventListener("click", go);
  segs.lv.forEach((b, i) => b.addEventListener("click", () => setLevel(i)));
  segs.op.forEach(b => b.addEventListener("click", () => { opMode = b.dataset.op; store.set("st.op.a" + age, opMode); newSum(); }));
  segs.mode.forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; store.set("st.mode", mode); newSum(); }));
  segs.way.forEach(b => b.addEventListener("click", () => { way = b.dataset.way; store.set("st.way.a" + age, way); recent = []; newSum(); }));
  segs.split.forEach(b => b.addEventListener("click", () => { splitFirst = b.dataset.split; store.set("st.split", splitFirst); newSum(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newSum(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; if (window.Loopy && Loopy.recent) Loopy.recent.clear("step-by-step"); newSum(); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".loopy-cheer.big")) return;
    if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { erase(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement !== goBtn) return;
      go(); e.preventDefault();
    }
  });

  // Read aloud: the step on screen, "What is 47 plus 20?", or "How do you split 25?"
  Loopy.speech.question({ host: card, text: () => {
    if (pos.type === "split") return t("stPickSplit", { n: sum.b });
    const st = sum.steps[pos.i];
    return t("whatIs", { q: st.from + " " + t(st.d < 0 ? "minus" : "plus") + " " + Math.abs(st.d) });
  } });

  // Print worksheet: 20 sums at the same level and way. Page 2 has the steps and the answers.
  Loopy.worksheet({
    title: () => t("stName"),
    level: () => [t("ageLabel", { n: age }), levelName(lv), t("problems") + ": " + t({ add: "adding", sub: "takingAway", mix: "both" }[opMode])].join(" · "),
    how: () => t("stHow"),
    layout: "line",
    make: (n) => { const list = [], keys = []; while (list.length < n) { const p = makeSum(lv, curWay(), opMode, keys); keys.push(p.key + ":0"); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("span"), s = document.createElement("span"), blank = document.createElement("span");
      s.className = "ws-sl"; s.textContent = num(p.a) + sign(p.op) + num(p.b) + " =";
      blank.className = "ws-blank";
      box.appendChild(s); box.appendChild(blank);
      return box;
    },
    // The answer with its steps; long ones (big numbers, three steps) keep only the numbers in between, so page 2 fits.
    answer: (p) => {
      const head = num(p.a) + sign(p.op) + num(p.b) + " = " + num(p.answer), full = head + " (" + p.steps.map(done).join(", ") + ")";
      return full.length <= 44 ? full : head + " (" + p.steps.slice(0, -1).map(st => num(st.to)).join(", ") + ")";
    }
  });

  newSum();
})();
</script>
</body>
