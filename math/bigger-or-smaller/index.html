/* Layout: a problem card with a number line, answer buttons below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }
.prompt { margin: 0; color: var(--muted); font-size: 1rem; text-align: center; padding: 0 48px; }

/* The problem: "37 ( ) 73", "__ < __ < __" or "4,567 rounds to __". */
.show {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.25em 0.4em;
  font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; text-align: center;
}
.show.cmp { font-size: clamp(2rem, min(11vw, 10dvh), 5rem); }
.show.ord { font-size: clamp(1.4rem, min(7vw, 7dvh), 3.4rem); }
.show.rnd { font-size: clamp(2rem, min(11vw, 10dvh), 5rem); align-items: baseline; }
.show .ring {
  display: inline-grid; place-items: center; width: 1.3em; height: 1.3em; border-radius: 50%;
  border: 0.07em solid var(--line); color: var(--accent);
}
.show .ring.empty::after { content: "?"; color: var(--muted); }
.show .gap { display: inline-block; min-width: 2.6ch; border-bottom: 0.08em solid var(--accent); color: var(--accent); text-align: center; }
.show .gap.empty::after { content: "?"; color: var(--muted); }
.show .sign { color: var(--muted); }
.show .to { font-size: 0.45em; font-weight: 600; color: var(--muted); }
/* After an answer the circle or gap shows the right answer, so it is always green. */
.problem-card.good .ring, .problem-card.good .gap, .problem-card.bad .ring, .problem-card.bad .gap { color: var(--good); border-color: var(--good); }

/* Number line: hidden (but keeping its room) until the answer is in, so it never gives the answer away. */
.nl { width: 100%; max-width: 520px; height: auto; display: block; }
.nl.off { visibility: hidden; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 40ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }

.side { display: flex; flex-direction: column; gap: 10px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choices.three { grid-template-columns: repeat(3, 1fr); }
.choices button {
  font: inherit; font-size: clamp(1.4rem, min(6vw, 5dvh), 2.6rem); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 3px solid var(--line); border-radius: 18px; min-height: clamp(56px, 9dvh, 96px); cursor: pointer;

.choices button .sym { font-size: 1.5em; line-height: 1; }
.choices button small { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button:active:not(:disabled) { transform: scale(0.96); }
.choices button:disabled { cursor: default; }
.choices button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.faded { opacity: 0.45; }
.choices button.right small, .choices button.wrong small { color: inherit; }
/* Order: the place a number goes (1st, 2nd, 3rd), shown on the tile once it is known. */
.choices .place {
  position: absolute; top: -11px; left: 50%; transform: translateX(-50%); min-width: 1.6em; height: 1.6em; border-radius: 999px;
  display: grid; place-items: center; font-size: 0.85rem; background: var(--card); border: 2px solid currentColor;
}

.next { font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(52px, 7dvh, 72px); cursor: pointer; width: 100%; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .seg button { font-size: 0.85rem; }
}

}

/* Portrait: the page is exactly one screen tall; the answers stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  .play { flex: 1 1 auto; min-height: 0; }
  .problem-card { flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .nl { flex: 0 1 auto; min-height: 56px; }
  .feedback { flex: 0 1 auto; min-height: 0; max-height: 6.5em; overflow-y: auto; }
}
/* Landscape: the same one-screen fit, problem on the left, answers on the right. */
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  .choices button { min-height: clamp(52px, 14dvh, 130px); }
}
/* Small phones: a little less room around the problem, so the whole reason fits. */
@media (max-height: 700px) and (orientation: portrait) {
  .problem-card { padding: 10px 12px; gap: 4px; }
  .nl { min-height: 48px; }
}
/* After answering on smaller screens, shrink the problem so the number line and the reason have room. */
@media (max-height: 900px), (max-width: 599px) {

}
@media (max-height: 500px) {

}

}

  // Each age starts at its own level; a level or problem kind picked by hand is remembered for that age.
  const levelForAge = (a) => a <= 6 ? 0 : a >= 11 ? 5 : a - 6;
  const modeForAge = (a) => a <= 6 ? "cmp" : "mix";
  let age = Loopy.getAge();
  let lv = store.get("bs.level.a" + age, levelForAge(age), LVS);
  let mode = store.get("bs.mode.a" + age, modeForAge(age), MODES);
  Loopy.levels.init({ names: LVS.map(i => i < 5 ? () => t("bsUpTo", { n: Loopy.num(LEVELS[i].max) }) : "bsDecNeg"),
    get: () => lv, base: () => levelForAge(age),
    set: (i) => { lv = i; store.set("bs.level.a" + age, lv); render(); } });
  let right = 0, tried = 0, streak = 0;
  let cur = null, answered = false, picked = [], recent = [];

  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = (list) => { for (let i = list.length - 1; i > 0; i--) { const j = rand(0, i); [list[i], list[j]] = [list[j], list[i]]; } return list; };
  const hundredths = (v) => Math.round(v * 100) / 100;
  // A number is { v: value, d: places after the point to show }. Whole numbers use Loopy.num; decimals keep
  // their places ("0.50" stays "0.50"), in the same language format. Minus numbers get a real minus sign.
  const fmt = (x) => (x.d ? x.v.toLocaleString(Loopy.lang === "de" ? "de-DE" : "en-US", { minimumFractionDigits: x.d, maximumFractionDigits: x.d }) : Loopy.num(x.v)).replace(/^-/, "−");
  const whole = (v) => ({ v, d: 0 });
  const signOf = (a, b) => a.v < b.v ? "<" : a.v > b.v ? ">" : "=";

  // A whole number that looks a lot like a: one digit changed, two digits swapped, or just another number.

    } else if (r < 0.7 && s.length > 1) {

  }
  // Mostly numbers with the most digits for the level, sometimes any number.
  const pickWhole = (max) => Math.random() < 0.7 ? rand(Math.ceil(max / 10), max - 1) : rand(0, max);
  function decimal(w) {
    if (Math.random() < 0.5) return { v: hundredths(w + rand(1, 9) / 10), d: 1 };

  // Compare: two numbers, pick <, = or >.
  function makeCmp(L) {

        const w = rand(0, 9);
        a = { v: hundredths(w + rand(1, 9) / 10), d: 1 };
        // The second one has two places, so "0.5 or 0.45?" comes up: more digits is not always bigger.
        let h;

  // Order: three different numbers to tap from smallest to biggest.
  function makeOrd(L) {

    } else {
      const max = L.extra ? 999999 : L.max;

    }
    for (let tries = 0; list.length < 3 && tries < 200; tries++) {
      const x = make();
      if (!list.some(y => y.v === x.v)) list.push(x);
    }
    if (kind === "bs-neg" && list.every(x => x.v >= 0)) list[0] = whole(-list[0].v || -7);
    const sorted = list.slice().sort((p, q) => p.v - q.v);

    return { type: "ord", list, sorted, kind, key: "o" + list.map(fmt).join() };
  }

  // Round: a number to round to the nearest 1, 10, 100, 1,000 or 10,000. Four answers to pick from.
  function makeRnd(L) {
    let u, n;
    if (L.extra && Math.random() < 0.5) {
      u = 1;
      let k;
      do { k = rand(1, 199); } while (k % 10 === 0);
      n = { v: k / 10, d: 1 };
    } else {
      u = L.units[rand(0, L.units.length - 1)];
      const top = (L.extra ? 1000000 : L.max) / u - 1;
      if (Math.random() < 0.15) n = whole(rand(1, top) * u + u / 2);
      else { let v; do { v = rand(u + 1, top * u + u - 1); } while (v % u === 0); n = whole(v); }
    }
    const lo = Math.floor(n.v / u) * u, hi = lo + u, r = Math.floor(n.v / u + 0.5) * u;
    const other = r === lo ? hi : lo, opts = [r, other], wrong = [r + u, r - u, r + 2 * u, r - 2 * u, r + 3 * u];
    if (u >= 100) wrong.unshift(Math.floor(n.v / (u / 10) + 0.5) * (u / 10));

    for (const w of shuffle(wrong.slice(0, 2)).concat(wrong.slice(2))) if (opts.length < 4 && w > 0 && !opts.includes(w)) opts.push(w);

  }

  // What comes up in each mode. Mix leaves rounding out for the smallest numbers.
  function makeProblem() {
    const L = LEVELS[lv];
    const types = mode !== "mix" ? [mode] : lv < 2 ? ["cmp", "cmp", "ord"] : ["cmp", "cmp", "ord", "rnd"];
    const type = types[rand(0, types.length - 1)];
    return type === "cmp" ? makeCmp(L) : type === "ord" ? makeOrd(L) : makeRnd(L);
  }

  // The short reason under the answer.
  function explain(p) {
    if (p.type === "ord") return t("bsOrder", { list: p.sorted.map(fmt).join(", ") });
    if (p.type === "rnd") {
      const v = { n: fmt(p.n), lo: Loopy.num(p.lo), hi: Loopy.num(p.hi), mid: Loopy.num(p.mid), r: Loopy.num(p.r) };
      return t(p.n.v === p.mid ? "bsRoundHalf" : p.r === p.hi ? "bsRoundUp" : "bsRoundDown", v);
    }
    const { a, b } = p, s = signOf(a, b);
    if (s === "=") return a.d !== b.d ? t("bsSameDec", { a: fmt(a), b: fmt(b) }) : t("bsSame");
    const big = s === ">" ? a : b, small = s === ">" ? b : a, v = { big: fmt(big), small: fmt(small) };
    if (a.d || b.d) {
      const two = (x) => fmt({ v: x.v, d: 2 });
      return t("bsDec", { a: two(a), b: two(b), big: two(big) });
    }
    if (small.v < 0) return t(big.v < 0 ? "bsNeg" : "bsBelow0", v);
    const bs = String(big.v), ss = String(small.v);
    if (bs.length !== ss.length) return t("bsMoreDigits", { ...v, n: bs.length, m: ss.length });
    if (bs.length === 1) return t("bsCount", v);
    const i = [...bs].findIndex((c, k) => c !== ss[k]);
    const place = ["ones", "tens", "hundreds", "thousands", "tenthousands", "hundredthousands", "millions"][bs.length - 1 - i];

  // The answer as one line: "37 < 73", "142 < 241 < 412" or "4,567 rounds to 4,600".
  function answerText(p) {
    if (p.type === "cmp") return fmt(p.a) + " " + signOf(p.a, p.b) + " " + fmt(p.b);
    if (p.type === "ord") return p.sorted.map(fmt).join(" < ");
    return t("bsRoundIs", { n: fmt(p.n), r: Loopy.num(p.r) }).replace(/\.$/, "");
  }

  // ---- Number line picture ----
  function svgEl(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  // Labels near an end of the line lean inwards, so they are never cut off.
  function label(x, y, text, color, size, weight) {
    const anchor = x > 345 ? "end" : x < 55 ? "start" : "middle";
    if (anchor !== "middle") x += anchor === "end" ? 10 : -10;
    const n = svgEl("text", { x, y, "text-anchor": anchor, "font-size": size, "font-weight": weight, fill: color, "font-family": "Lexend, sans-serif" }, nl);
    n.textContent = text;
    return n;
  }
  const Y = 72, X0 = 30, X1 = 370;
  // skip: an end of the line that is labeled by the caller instead.
  function drawLine(lo, hi, step, places, skip) {
    nl.textContent = "";
    const x = (v) => X0 + (v - lo) / (hi - lo) * (X1 - X0);
    svgEl("line", { x1: X0 - 14, y1: Y, x2: X1 + 14, y2: Y, stroke: "var(--muted)", "stroke-width": 3, "stroke-linecap": "round" }, nl);
    const count = Math.round((hi - lo) / step);
    for (let i = 0; i <= count; i++) svgEl("line", { x1: x(lo + i * step), y1: Y - 7, x2: x(lo + i * step), y2: Y + 7, stroke: "var(--muted)", "stroke-width": 2 }, nl);

  // ---- One round ----
  function render() {

  }
  function span(cls, text) {

  }

  function newRound() {

    nl.classList.add("off");

    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    showEl.textContent = "";
    showEl.className = "show " + p.type;

        b.addEventListener("click", () => chooseOne(b));
      });
    }
    Loopy.nextButton($("next"), false);

  }

  // Compare and Round: one tap picks the answer.
  function chooseOne(btn) {
    if (answered) return;
    const good = cur.type === "cmp" ? signOf(cur.a, cur.b) : String(cur.r);
    const buttons = [...choicesEl.children];
    buttons.forEach(b => {
      b.disabled = true;
      b.classList.add(b.dataset.answer === good ? "right" : b === btn ? "wrong" : "faded");
    });
    const ring = showEl.querySelector(".ring, .gap");
    ring.classList.remove("empty");
    ring.textContent = cur.type === "cmp" ? good : Loopy.num(cur.r);
    const yours = cur.type === "cmp" ? fmt(cur.a) + " " + btn.dataset.answer + " " + fmt(cur.b) : btn.textContent;
    finish(btn.dataset.answer === good, yours);
  }

  // Order: tap the numbers one by one. A wrong tap ends the round.
  function tapOrder(btn, x) {
    if (answered || btn.disabled) return;
    const want = cur.sorted[picked.length];
    const gaps = showEl.querySelectorAll(".gap");
    if (x.v === want.v) {
      gaps[picked.length].classList.remove("empty");
      gaps[picked.length].textContent = fmt(x);
      picked.push(x);

      btn.disabled = true;
      btn.classList.add("right");
      btn.appendChild(span("place", String(picked.length)));

      if (hadFocus && left) left.focus({ preventScroll: true });

    }
    btn.classList.add("wrong");

      b.disabled = true;

    gaps.forEach((g, i) => { g.classList.remove("empty"); g.textContent = fmt(cur.sorted[i]); });

  }

  function finish(ok, yours) {
    answered = true; tried++;
    if (ok) { right++; streak++; } else { streak = 0; }
    if (ok) Loopy.rewards.correct("bigger-smaller", streak);
    else Loopy.rewards.wrong("bigger-smaller", {
      q: cur.type === "cmp" ? fmt(cur.a) + " ? " + fmt(cur.b) : cur.type === "ord" ? cur.list.map(fmt).join(", ") : fmt(cur.n) + " (" + Loopy.num(cur.u) + ")",
      a: answerText(cur), y: yours, k: cur.kind
    });
    card.classList.add(ok ? "good" : "bad");

  }


  modeBtns.forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; store.set("bs.mode.a" + age, mode); render(); newRound(); }));
  lvBtns.forEach(b => b.addEventListener("click", () => { lv = +b.dataset.lv; store.set("bs.level.a" + age, lv); render(); newRound(); }));
  window.addEventListener("loopy:age", (e) => {
    age = e.detail;
    lv = store.get("bs.level.a" + age, levelForAge(age), LVS);
    mode = store.get("bs.mode.a" + age, modeForAge(age), MODES);

  });
  $("next").addEventListener("click", newRound);

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;

    if (answered) return;
    const sign = ["<", "=", ">"].indexOf(e.key);

    const b = n >= 1 && choicesEl.children[n - 1];
    if (b && !b.disabled) b.click();
  });

  // Read aloud: "Is 37 smaller than, equal to, or bigger than 73?", "Tap the numbers from smallest to biggest. 412, 142 or 241."
  // or "Round to the nearest hundred. 4,567." Voices read "-7" as minus 7, so speech gets a plain minus sign.
  const said = (x) => fmt(x).replace("\u2212", "-");
  Loopy.speech.question({ host: card, text: () => {
    if (cur.type === "cmp") return t("bsReadCmp", { a: said(cur.a), b: said(cur.b) });
    if (cur.type === "ord") return t("bsReadList", { q: t("bsAskOrd"), list: cur.list.slice(0, -1).map(said).join(", ") + " " + t("orWord") + " " + said(cur.list[2]) });
    return t("bsReadList", { q: t("bsRound" + cur.u), list: said(cur.n) });
  } });

  // Print worksheet: 20 problems at the same level and kind, in black and white.
  Loopy.worksheet({
    title: () => t("bsName"),
    level: () => [t("ageLabel", { n: age }), t("bsProblems") + ": " + t({ cmp: "bsCmp", ord: "bsOrd", rnd: "bsRnd", mix: "bsMix" }[mode]),
      t("bsNumbers") + ": " + (lv < 5 ? t("bsUpTo", { n: Loopy.num(LEVELS[lv].max) }) : t("bsDecNeg"))].join(" · "),
    how: () => t({ cmp: "bsHowCmp", ord: "bsHowOrd", rnd: "bsHowRnd", mix: "bsHowMix" }[mode]),
    layout: "line",

    },
    cell: (p) => {

      } else if (p.type === "ord") {
        line.classList.add("ws-ord");
        line.textContent = p.list.map(fmt).join(" \u00b7 ");
        const blanks = span("ws-sl ws-ord");
        [0, 1, 2].forEach(i => { if (i) blanks.append(" < "); blanks.appendChild(span("ws-blank")); });
        box.append(line, blanks);
        return box;
      } else {
        const how = document.createElement("small");
        how.textContent = t("bsRound" + p.u);
        box.appendChild(how);
        line.append(fmt(p.n) + " → ", span("ws-blank"));
      }
      box.appendChild(line);
      return box;
    },
    answer: answerText
  });

  render();
  newRound();
})();
</script>
</body>
</html>
