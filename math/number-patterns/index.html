/* Layout: a row of number boxes with one missing on the card, the number pad below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 4px; min-height: 44px; cursor: pointer;
}
.seg button:last-child { grid-column: 1 / -1; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}

<script>
Loopy.addStrings({
  en: {
    npName: "Number Patterns", npLevel: "Level",

    npSquarePlus: "The square numbers plus {k}: {n} × {n} + {k} = {b}.",
    npHow: "Write the missing number on the line."
  },
  de: {
    npName: "Zahlenmuster", npLevel: "Stufe",
    npL1: "Schritte von 1, 2 und 10", npL2: "Jeder Schritt, auch rückwärts", npL3: "Verdoppeln und Quadratzahlen", npL4: "Wachsende Schritte", npL5: "Zwei Regeln gemischt",
    npNext: "Was kommt als Nächstes?", npMissing: "Welche Zahl fehlt?",
    npRead: "{list}. Was kommt als Nächstes?", npReadGap: "{list}. Welche Zahl fehlt?", npBlank: "Lücke",
    npAnswerIs: "Die fehlende Zahl ist {a}.",
    npStep: "Jede Zahl ist {s} mehr als die davor. {a} + {s} = {b}.",
    npBack: "Jede Zahl ist {s} weniger als die davor. {a} − {s} = {b}.",
    npDouble: "Jede Zahl ist das Doppelte der Zahl davor. {a} × 2 = {b}.",
    npTriple: "Jede Zahl ist das Dreifache der Zahl davor. {a} × 3 = {b}.",
    npSquare: "Das sind die Quadratzahlen: 1 × 1, 2 × 2, 3 × 3 und so weiter. {n} × {n} = {b}.",
    npGrow: "Die Sprünge werden größer: {jumps}. {a} + {s} = {b}.",
    npGrowBack: "Die Sprünge werden kleiner: {jumps}. {a} − {s} = {b}.",
    npTwo: "Zwei Regeln wechseln sich ab: {r1}, dann {r2}. {a} {op} {s} = {b}.",
    npDoublePlus: "Verdoppeln, dann {k} dazu. {a} × 2 + {k} = {b}.",
    npDoubleMinus: "Verdoppeln, dann {k} weg. {a} × 2 − {k} = {b}.",
    npFib: "Zähle die zwei Zahlen davor zusammen. {a} + {c} = {b}.",
    npSquarePlus: "Die Quadratzahlen plus {k}: {n} × {n} + {k} = {b}.",
    npHow: "Schreib die fehlende Zahl auf die Linie."
  }
});

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), seqEl = $("seq"), jumpsEl = $("jumps"), qEl = $("question"), feedbackEl = $("feedback"), goBtn = $("k-go");
  const levelBtns = [...document.querySelectorAll("#level-seg button")];
  const digitBtns = [...document.querySelectorAll("#pad [data-d]")];
  const t = Loopy.t, fmt = (n) => Loopy.num(n);
  const randInt = (n) => Math.floor(Math.random() * n);
  const pick = (arr) => arr[randInt(arr.length)];
  const store = {
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = Loopy.getAge();
  let level;
  const levelForAge = (a) => a <= 6 ? 1 : a <= 8 ? 2 : a <= 10 ? 3 : a <= 12 ? 4 : 5;
  function loadForAge() { level = store.get("np.level.a" + age, levelForAge(age), [1, 2, 3, 4, 5]); }
  loadForAge();
  Loopy.levels.init({ names: ["npL1", "npL2", "npL3", "npL4", "npL5"],
    get: () => level - 1, base: () => levelForAge(age) - 1,
    set: (i) => { level = i + 1; store.set("np.level.a" + age, level); render(); } });
  let right = 0, tried = 0, streak = 0;
  let current = null, typed = "", answered = false, recent = [];

  // A problem: the numbers, which box is missing, the kind for the log, a key so it does not come back too soon,
  // and the words that explain the rule. The jumps between boxes show after the answer ("+3", "×2").
  // Every pattern is built from a rule name and a few numbers, so a missed one can be built again from its key.
  const plus = (s) => (s < 0 ? "−" : "+") + fmt(Math.abs(s));
  const bySteps = (start, steps) => { const seq = [start]; steps.forEach(s => seq.push(seq[seq.length - 1] + s)); return seq; };
  const diffs = (seq) => seq.slice(1).map((v, i) => plus(v - seq[i]));
  const lastTwo = (seq, i) => [seq[i - 1], seq[i]];
  const stepWhy = (seq, s, name) => (m) => { const [a, b] = lastTwo(seq, m); return t(name, { s: fmt(s), a: fmt(a), b: fmt(b) }); };
  // Each rule: how many numbers it needs, and the pattern it makes from them.
  const RULES = {
    s: { n: 2, make: ([start, s]) => { const seq = bySteps(start, [s, s, s, s]); return { kind: "step", seq, jumps: diffs(seq), why: stepWhy(seq, s, "npStep") }; } },
    b: { n: 2, make: ([start, s]) => { const seq = bySteps(start, [-s, -s, -s, -s]); return { kind: "back", seq, jumps: diffs(seq), why: stepWhy(seq, s, "npBack") }; } },
    double: { n: 1, make: ([start]) => times(start, 2, "npDouble") },
    triple: { n: 1, make: ([start]) => times(start, 3, "npTriple") },
    sq: { n: 1, make: ([from]) => { const seq = []; for (let n = from; n < from + 5; n++) seq.push(n * n);
      return { kind: "double", seq, jumps: diffs(seq), why: (m) => t("npSquare", { n: fmt(from + m), b: fmt(seq[m]) }) }; } },
    g: { n: 3, make: ([s0, first, by]) => grow(s0, first, by, 1) },
    gb: { n: 3, make: ([s0, first, by]) => grow(s0, first, by, -1) },
    two: { n: 3, make: ([start, s1, s2]) => { const steps = [s1, -s2, s1, -s2, s1], seq = bySteps(start, steps);
      return { kind: "mix", seq, jumps: diffs(seq), why: (m) => { const [a, b] = lastTwo(seq, m), s = steps[m - 1];
        return t("npTwo", { r1: plus(s1), r2: plus(-s2), a: fmt(a), op: s < 0 ? "−" : "+", s: fmt(Math.abs(s)), b: fmt(b) }); } }; } },
    dplus: { n: 2, make: ([start, k]) => twice(start, k, "npDoublePlus") },
    dminus: { n: 2, make: ([start, k]) => twice(start, -k, "npDoubleMinus") },
    fib: { n: 2, make: ([a0, a1]) => { const seq = [a0, a1]; for (let i = 2; i < 6; i++) seq.push(seq[i - 1] + seq[i - 2]);
      return { kind: "mix", seq, jumps: diffs(seq), why: (m) => t("npFib", { a: fmt(seq[m - 2]), c: fmt(seq[m - 1]), b: fmt(seq[m]) }) }; } },
    sqp: { n: 2, make: ([from, k]) => { const seq = []; for (let n = from; n < from + 5; n++) seq.push(n * n + k);
      return { kind: "mix", seq, jumps: diffs(seq), why: (m) => t("npSquarePlus", { k: fmt(k), n: fmt(from + m), b: fmt(seq[m]) }) }; } }
  };
  function times(start, k, name) {
    const seq = [start]; for (let i = 0; i < 4; i++) seq.push(seq[i] * k);
    return { kind: "double", seq, jumps: seq.slice(1).map(() => "×" + k), why: (m) => { const [a, b] = lastTwo(seq, m); return t(name, { a: fmt(a), b: fmt(b) }); } };
  }
  function twice(start, k, name) {
    const seq = [start]; for (let i = 0; i < 4; i++) seq.push(seq[i] * 2 + k);
    return { kind: "mix", seq, jumps: seq.slice(1).map(() => "×2" + plus(k)), why: (m) => { const [a, b] = lastTwo(seq, m); return t(name, { k: fmt(Math.abs(k)), a: fmt(a), b: fmt(b) }); } };
  }
  function grow(s0, first, by, sign) {
    const steps = []; for (let i = 0; i < 5; i++) steps.push((first + i * by) * sign);
    const seq = bySteps(s0, steps);
    return { kind: "grow", seq, jumps: steps.map(plus), why: (m) => { const [a, b] = lastTwo(seq, m);
      return t(sign < 0 ? "npGrowBack" : "npGrow", { jumps: steps.map(plus).join(", "), a: fmt(a), s: fmt(Math.abs(steps[m - 1])), b: fmt(b) }); } };
  }
  function build(rule, nums, miss) {
    const p = RULES[rule].make(nums);
    if (miss < 1 || miss >= p.seq.length || p.seq.some(v => v <= 0 || v > 9999)) return null;
    p.miss = miss; p.answer = p.seq[miss]; p.why = p.why(miss);
    p.key = level + ":" + rule + ":" + nums.join(":") + ":" + miss;
    return p;
  }
  // Level 1: steps of 1, 2 and 10, forwards, the last box missing.
  function make1() {
    const s = pick([1, 1, 2, 2, 10]), start = s === 10 ? 10 * (1 + randInt(5)) : 1 + randInt(s === 1 ? 20 : 10);
    return build("s", [start, s], 4);
  }
  // Level 2: any step up to 10, forwards or backwards, within 100; the last box missing.
  function make2() {
    const s = 2 + randInt(9), back = randInt(3) === 0;
    return build(back ? "b" : "s", [back ? 40 + randInt(61) : 1 + randInt(50), s], 4);
  }
  // Level 3: doubling, tripling, square numbers and big steps (25, 50, 100), the last box or one in the middle.
  function make3() {
    const type = pick(["double", "double", "triple", "square", "square", "big"]);
    if (type === "double") return build("double", [pick([1, 2, 3, 5, 1, 2])], pick([4, 4, 3]));
    if (type === "triple") return build("triple", [pick([1, 2, 1])], pick([4, 4, 3]));
    if (type === "square") return build("sq", [1 + randInt(5)], pick([4, 4, 2, 3]));
    const s = pick([25, 50, 100]);
    return build("s", [s * (1 + randInt(4)), s], pick([4, 4, 2]));
  }
  // Level 4: growing or shrinking jumps (+1, +2, +3 … or +2, +4, +6 …), six boxes, the missing one anywhere but the first.
  function make4() {
    const first = 1 + randInt(3), by = pick([1, 1, 2, 3]), start = 1 + randInt(10), back = randInt(4) === 0;
    return build(back ? "gb" : "g", [back ? start + 40 + randInt(20) : start, first, by], pick([5, 5, 5, 4, 3, 2]));
  }
  // Level 5: two rules that take turns, double and add, Fibonacci, squares plus a number.
  function make5() {
    const type = pick(["two", "two", "dplus", "dminus", "fib", "sqplus"]);
    let p = null;
    // The two steps differ, so the row never stays flat (2, 2, 2, 2).
    if (type === "two") { const s1 = 2 + randInt(7); p = build("two", [1 + randInt(12), s1, pick([1, 2, 3].filter(x => x !== s1))], pick([5, 5, 4, 3])); }
    else if (type === "dplus") p = build("dplus", [1 + randInt(4), 1 + randInt(3)], pick([4, 4, 3]));
    else if (type === "dminus") p = build("dminus", [2 + randInt(4), 1 + randInt(3)], pick([4, 4, 3]));
    else if (type === "fib") { const a0 = 1 + randInt(3); p = build("fib", [a0, a0 + randInt(3)], pick([5, 5, 4, 3])); }
    else p = build("sqp", [1 + randInt(4), 1 + randInt(3)], pick([4, 4, 3]));
    return p;
  }
  const MAKE = { 1: make1, 2: make2, 3: make3, 4: make4, 5: make5 };
  // A pattern that would go below 1 (counting back too far) is thrown away and another one made.
  function makeProblem() { let p = null; while (!p) p = MAKE[level](); return p; }

  const el = (tag, cls, text) => Loopy.el(tag, cls, text);
  function drawSeq() {
    const p = current;
    seqEl.textContent = "";
    p.seq.forEach((v, i) => {
      const box = el("span", "n" + (i === p.miss ? " ask" : ""), i === p.miss ? (typed === "" ? "" : fmt(parseInt(typed, 10))) : fmt(v));
      if (i === p.miss) { box.setAttribute("role", "textbox"); box.setAttribute("aria-label", t(p.miss === p.seq.length - 1 ? "npNext" : "npMissing")); box.dataset.a = p.answer; }
      seqEl.appendChild(box);
    });
    jumpsEl.textContent = "";
    if (answered) {
      jumpsEl.appendChild(el("span", "half"));
      p.jumps.forEach(j => jumpsEl.appendChild(el("span", "", j)));
      jumpsEl.appendChild(el("span", "half"));
    }
  }
  function render() {
    Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    levelBtns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.level === level)));
    goBtn.textContent = t(answered ? "next" : "check");
    goBtn.disabled = !answered && typed === "";
    digitBtns.forEach(b => b.disabled = answered);
    $("k-erase").disabled = answered || typed === "";
    drawSeq();
  }

  // Try again: a missed pattern comes back later (Loopy.retry). The note is the problem's key, like "2:s:14:3:4"
  // (level, rule, numbers, missing box). A pattern from another level waits.
  const note = (p) => p.key;
  function newRound() {
    current = Loopy.retry.fresh("number-patterns", recent, makeProblem, rebuild, 12);
    typed = ""; answered = false;
    qEl.textContent = t(current.miss === current.seq.length - 1 ? "npNext" : "npMissing");
    card.className = "problem-card";
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    render();
    Loopy.speech.read();
  }
  // Build the noted pattern again from its key. A pattern from another level waits.
  function rebuild(r) {
    const m = /^([1-5]):([a-z]+):([\d:]{1,24}):(\d)$/.exec(r);
    if (!m || +m[1] !== level || !RULES[m[2]]) return null;
    const nums = m[3].split(":").map(Number);
    if (nums.length !== RULES[m[2]].n || nums.some(n => !(n >= 0 && n < 1000))) return null;
    return build(m[2], nums, +m[4]);
  }

  function press(d) {
    if (answered || typed.length >= 4) return;
    if (typed === "0") typed = "";
    typed += d;
    render();
  }
  function erase() { if (answered) return; typed = typed.slice(0, -1); render(); }
  function check() {
    if (answered || typed === "") return;
    answered = true; tried++;
    const ok = parseInt(typed, 10) === current.answer;
    if (ok) { right++; streak++; } else { streak = 0; }
    const q = current.seq.map((v, i) => i === current.miss ? "?" : fmt(v)).join(", ");
    if (ok) Loopy.rewards.correct("number-patterns", streak, "np-" + current.kind);
    else Loopy.rewards.wrong("number-patterns", { q, a: fmt(current.answer), y: fmt(parseInt(typed, 10)), k: "np-" + current.kind, r: note(current) });
    card.className = "problem-card " + (ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    feedbackEl.appendChild(document.createTextNode((ok ? "" : t("npAnswerIs", { a: fmt(current.answer) }) + " ") + current.why));
    render();
  }
  function go() { answered ? newRound() : check(); }

  digitBtns.forEach(b => b.addEventListener("click", () => press(b.dataset.d)));
  $("k-erase").addEventListener("click", erase);
  goBtn.addEventListener("click", go);
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; store.set("np.level.a" + age, level); recent = []; newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("number-patterns"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key >= "0" && e.key <= "9") press(e.key);
    else if (e.key === "Backspace") erase();
    else if (e.key === "Enter") go();
  });

  // Read aloud: "3, 6, 9, 12. What comes next?" or "3, blank, 9, 12, 15. Which number is missing?"
  Loopy.speech.question({ host: card, text: () => {
    const list = current.seq.map((v, i) => i === current.miss ? t("npBlank") : fmt(v)).join(", ");
    return t(current.miss === current.seq.length - 1 ? "npRead" : "npReadGap", { list: current.miss === current.seq.length - 1 ? list.replace(/, [^,]*$/, "") : list });
  } });

  // Print worksheet: 20 patterns at the game's level, each with a line for the missing number.
  Loopy.worksheet({
    title: () => t("npName"),
    level: () => [t("ageLabel", { n: age }), t("npLevel") + ": " + t("npL" + level)].join(" · "),
    how: () => t("npHow"),
    layout: "line",
    make: (n) => { const out = [], keys = []; for (let i = 0; i < 400 && out.length < n; i++) { const p = makeProblem(); if (!keys.includes(p.key)) { keys.push(p.key); out.push(p); } } return out; },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-np";
      p.seq.forEach((v, i) => {
        if (i) box.appendChild(document.createTextNode(", "));
        if (i === p.miss) box.appendChild(el("span", "gap")); else box.appendChild(document.createTextNode(fmt(v)));
      });
      return box;
    },
    answer: (p) => fmt(p.answer)
  });

  newRound();
})();
</script>
</body>
</html>
