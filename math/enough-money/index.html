<style>
/* Layout: a small times table grid on the card with one cell marked, the number pad below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 4px; min-height: 44px; cursor: pointer;
}
.seg button:last-child { grid-column: 1 / -1; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .erase { font-size: 1.15rem; color: var(--muted); }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .pad button { min-height: 64px; font-size: 1.8rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<style>

/* Is It Enough?: a small shop of three things with price tags, a purse of notes and coins, and one question.
   Notes and coins keep fixed paper and metal colours in every theme, like Coins and Change. */
.tag { margin: 0; font-size: 0.85rem; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 4px 12px; }
.shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.shop .item { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border: 2px solid var(--line); border-radius: 16px; background: var(--chip); color: var(--ink); min-width: 0; }
.shop .item.want { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; background: var(--card); }
.shop .item.faded { opacity: 0.55; }
.shop .pic { font-size: clamp(1.8rem, 8vw, 2.6rem); line-height: 1.15; }
.shop .price { font-size: clamp(1.05rem, 4.6vw, 1.35rem); font-weight: 700; font-variant-numeric: tabular-nums; }
.shop .nm { font-size: 0.85rem; color: var(--muted); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.has { margin: 0; font-size: 0.95rem; color: var(--muted); font-weight: 600; text-align: center; }
.money { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; width: 100%; --mh: clamp(36px, 6dvh, 52px); }
.money i { display: inline-grid; place-items: center; font-style: normal; font-weight: 700; font-variant-numeric: tabular-nums; color: #2b2112; height: var(--mh); font-size: clamp(0.95rem, 4vw, 1.2rem); line-height: 1; }
.money .note { width: calc(var(--mh) * 1.9); border-radius: 6px; border: 2px solid rgb(0 0 0 / 0.3); box-shadow: inset 0 0 0 3px rgb(255 255 255 / 0.45); }
.money .n5 { background: #bfc3cb; } .money .n10 { background: #eaa595; } .money .n20 { background: #a9c1ea; } .money .n50 { background: #f0c08a; }
.money .coin { width: var(--mh); border-radius: 50%; font-size: clamp(0.85rem, 3.4vw, 1.05rem); }
.money .c2 { background: #c9ced6; border: 4px solid #e2b84a; box-shadow: 0 0 0 1.5px #9a7420; }
.money .c1 { background: #e2b84a; border: 4px solid #c9ced6; box-shadow: 0 0 0 1.5px #7d8592; }
.question { margin: 0; font-size: clamp(1.05rem, min(4.8vw, 3dvh), 1.5rem); font-weight: 700; line-height: 1.3; text-align: center; text-wrap: balance; }
.where { margin: 0; font-size: 0.9rem; color: var(--muted); text-align: center; text-wrap: balance; }
/* The answer line: the typed amount in a box, "? €" while empty. */
.eq { margin: 0; font-size: clamp(1.6rem, 7vw, 2.4rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; display: flex; align-items: center; gap: 8px; }
.eq[hidden] { display: none; }
.eq .ans { min-width: 2.2em; height: 1.5em; padding: 0 0.3em; display: grid; place-items: center; border: 2px solid var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; border-radius: 14px; background: var(--card); color: var(--accent); }
.eq .ans:empty::after { content: "?"; color: var(--muted); }
.problem-card.good .eq .ans { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; color: var(--good); }
.problem-card.bad .eq .ans { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.08em; }
/* Yes and No take the place of the number pad, with Next under them. */
.yn { display: flex; flex-direction: column; gap: 10px; }
.yn[hidden], .pad[hidden] { display: none; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choices button {
  font: inherit; font-size: 1.5rem; font-weight: 700; color: var(--ink); background: var(--key); border: 2px solid var(--line); border-radius: 18px;
  min-height: clamp(64px, 12dvh, 120px); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: transform .08s ease, border-color .15s ease;
}
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button:active:not(:disabled) { transform: scale(0.96); }
.choices button:disabled { cursor: default; }
.choices button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.faded { opacity: 0.45; }
.yn .go { font: inherit; font-size: 1.35rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 2px solid var(--accent); border-radius: 18px; min-height: clamp(50px, 8dvh, 80px); cursor: pointer; }
.yn .go:disabled { opacity: 0.4; cursor: default; }
@media (orientation: landscape) and (min-width: 640px) { .choices button { min-height: clamp(60px, 22dvh, 160px); } }
/* A purse of six or more pieces takes two rows, so its pieces are smaller. */
.money.many { --mh: clamp(30px, 4.4dvh, 40px); gap: 4px; }
/* Phones up to 900px tall: with the number pad up, the amount question plus the why line need a shorter shop and purse. */
@media (max-height: 900px) and (orientation: portrait) {

@media (max-height: 500px) { .tag { display: none; } .question { font-size: 0.95rem; } .shop .pic { font-size: 1.3rem; } .shop .item { padding: 3px; gap: 0; } .shop .nm { display: none; } .money { --mh: 28px; gap: 3px; } .money.many { --mh: 24px; } .money i { font-size: 0.8rem; } .money .coin { font-size: 0.7rem; } .eq { font-size: 1.3rem; } }

/* Worksheet cells (only printed): the money as outlined boxes with a line for the total, or the shop problem in words. */

<div class="wrap">
  <header class="game-bar">

        <button type="button" data-level="3" data-t="emL3">Enough for one thing?</button>

  </div>

  <main class="play">

      <p class="where" id="where"></p>
      <p class="eq" id="eq" hidden></p>
      <p class="feedback" id="feedback"></p>
    </div>

    <div class="yn" id="yn" hidden>
      <div class="choices" id="choices">
        <button type="button" id="yes" data-yn="y" data-t="emYes">Yes ✓</button>
        <button type="button" id="no" data-yn="n" data-t="emNo">No ✗</button>
      </div>
      <button type="button" class="go" id="next" data-t="next">Next</button>
    </div>
    <div class="pad" id="pad">
      <button type="button" id="k1" data-d="1">1</button>
      <button type="button" id="k2" data-d="2">2</button>
      <button type="button" id="k3" data-d="3">3</button>
      <button type="button" id="k4" data-d="4">4</button>
      <button type="button" id="k5" data-d="5">5</button>

      <button type="button" id="k7" data-d="7">7</button>
      <button type="button" id="k8" data-d="8">8</button>
      <button type="button" id="k9" data-d="9">9</button>

      <button type="button" id="k-go" class="go" data-t="check">Check</button>
    </div>
  </main>
</div>

<script>
Loopy.addStrings({

  });

  // Read aloud: the question, and for the shop the purse too, like "Samu has 20 euros, 20 euros, 10 euros."
  Loopy.speech.question({ host: card, text: () => (current.type === "s" ? t("emHas", { name: current.name }) + " " + current.purse.map(euroWord).join(", ") + ". " : "") + current.ask(cur()) });

  // Print worksheet: 20 purses to count, or 20 shop problems in words, at the game's level.
  Loopy.worksheet({
    title: () => t("emName"),
    level: () => [t("ageLabel", { n: age }), t("emLevel") + ": " + t("emL" + level)].join(" · "),
    how: () => t(level <= 2 ? "emHowCount" : "emHowShop"),
    layout: "clock",
    make: (n) => { const out = [], keys = []; for (let i = 0; i < 400 && out.length < n; i++) { const p = makeProblem(); if (!keys.includes(p.key)) { keys.push(p.key); out.push(p); } } return out; },
    cell: (p) => {
      const box = el("div", "ws-em");
      if (p.type === "c") {
        const m = el("div", "money"); p.pieces.forEach(v => m.appendChild(el("i", (v >= 5 ? "note n" : "coin c") + v, euro(v)))); box.appendChild(m);
        const line = el("span", "sum", "="); line.appendChild(el("i", "ws-line")); box.appendChild(line);
        return box;
      }
      box.appendChild(el("p", "", p.want.map(i => ITEMS[p.items[i].id][0] + " " + label(ITEMS[p.items[i].id]) + " " + euro(p.items[i].price)).join(", ")));
      box.appendChild(el("b", "", t("emHas", { name: p.name }) + " " + euro(p.has)));
      const qs = [t("emEnough"), t(p.enough ? "emAskLeft" : "emAskMissing")];
      if (p.extra >= 0) qs.push(t("emAskStill", { name: p.name, a: (de() ? ITEMS[p.items[p.extra].id][3] : ITEMS[p.items[p.extra].id][1]) + " (" + euro(p.items[p.extra].price) + ")" }));
      qs.forEach(q => { const line = el("span", "", q); line.appendChild(el("i", "ws-line")); box.appendChild(line); });
      return box;
    },
    answer: (p) => p.type === "c" ? euro(p.total) : t(p.enough ? "emYesWord" : "emNoWord") + ", " + euro(p.cells.d) + (p.extra >= 0 ? ", " + t(p.cells.x === "y" ? "emYesWord" : "emNoWord") : "")
  });

  newRound();
})();
</script>
</body>
</html>
