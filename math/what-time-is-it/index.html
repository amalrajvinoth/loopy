<style>
/* Layout: one centered column; clock on top, four big answer buttons below, controls tucked into a quiet top bar. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --hour: #2457c5;
  --minute: #e2622b;
  --face: #ffffff;
  --rim: #1d2a3f;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.levels button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 10px 6px; min-height: 48px; cursor: pointer;
}
.levels button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.clock-card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.prompt { margin: 0; font-size: 1.35rem; font-weight: 600; }
svg#clock { width: 100%; max-width: 360px; height: auto; aspect-ratio: 1; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; font-size: 0.95rem; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 6px; border-radius: 3px; vertical-align: middle; margin-right: 6px; }
.helper { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; color: var(--muted); cursor: pointer; min-height: 40px; }
.helper input { width: 22px; height: 22px; accent-color: var(--minute); }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.answers button {
  font: inherit; font-size: 2.1rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--card); border: 3px solid var(--line); border-radius: 18px; min-height: 84px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
}
.answers button:hover:not(:disabled) { border-color: var(--hour); }
.answers button:active:not(:disabled) { transform: scale(0.97); }
.answers button:disabled { cursor: default; }
.answers button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.answers button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.answers button.faded { opacity: 0.45; }

.feedback { min-height: 3.2em; text-align: center; font-size: 1.15rem; line-height: 1.45; margin: 0; }
.feedback strong { display: block; font-size: 1.5rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }

.actions { display: flex; gap: 12px; }
.next {
  flex: 1; font: inherit; font-size: 1.3rem; font-weight: 700; color: #fff; background: var(--hour);
  border: 0; border-radius: 16px; min-height: 64px; cursor: pointer;
}
.reset { font: inherit; font-size: 1rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 16px; padding: 0 18px; min-height: 64px; cursor: pointer; }
button:focus-visible, .helper input:focus-visible { outline: 3px solid var(--minute); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .answers button { font-size: 1.8rem; min-height: 76px; }
  .levels { grid-template-columns: repeat(2, 1fr); }
  .levels button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.clock-card { padding: 12px; gap: 6px; }
.prompt { font-size: 1.15rem; }
svg#clock { width: min(100%, 360px, 36vh); width: min(100%, 360px, 36dvh); }
.legend { font-size: 0.85rem; gap: 4px 14px; }
.sw-hour { background: var(--hour); }
.sw-minute { background: var(--minute); }
.side { display: flex; flex-direction: column; gap: 10px; }
.answers { gap: 10px; }
.answers button { min-height: clamp(56px, 8.5dvh, 96px); font-size: clamp(1.6rem, 4.2dvh, 2.4rem); }
.feedback { min-height: 2.9em; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }
.next { min-height: clamp(52px, 7dvh, 72px); width: 100%; flex: none; }
.helper { color: var(--ink); }
@media (min-width: 600px) and (orientation: portrait) {
  svg#clock { width: min(100%, 480px, 40dvh); }
  .answers button { min-height: clamp(64px, 10dvh, 120px); font-size: 2.6rem; }
}
@media (orientation: landscape) and (min-width: 640px) {
  svg#clock { width: min(100%, 580px, calc(100dvh - 190px)); }
  .answers button { min-height: clamp(52px, 14dvh, 130px); }
}
@media (max-height: 760px) and (orientation: portrait) {
  svg#clock { width: min(100%, 300px, 31dvh); }
  .prompt { font-size: 1rem; }
  .feedback { font-size: 0.95rem; line-height: 1.35; }
  .feedback strong { font-size: 1.15rem; }
}

/* Portrait: the page is exactly one screen tall; the pad or answers stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
}
@media (orientation: portrait) {
  .clock-card { flex: 1 1 auto; min-height: 0; }
  svg#clock { flex: 1 1 0; min-height: 120px; width: 100%; max-width: 520px; height: auto; }
  .feedback { min-height: 4.2em; max-height: 6.5em; overflow-y: auto; }
}
/* Landscape: the same one-screen fit, clock on the left, answers on the right. */
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .clock-card, .side { height: 100%; min-height: 0; justify-content: center; }
  svg#clock { flex: 1 1 0; min-height: 100px; width: 100%; max-width: 580px; height: auto; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .feedback { font-size: 0.95rem; line-height: 1.35; }
  .feedback strong { font-size: 1.15rem; }
}

<script>
Loopy.addStrings({
  en: {
    clName: "What Time Is It?", level: "Level", lvHalf: "Hours & halves", lvQuarter: "Quarter hours", lvFive: "Every 5 min", lvOne: "Every minute",
    helperLabel: "Show minute numbers on the clock", clKbd: "Keyboard works too: 1 to 4 picks an answer, Enter goes on.",
    clPrompt: "Read the clock. Pick the time.", clShort: "Short hand = hour", clLong: "Long hand = minutes",
    newTime: "New time", nextTime: "Next time", clItIs: "Not quite. It is {time}.",
    clockAria: "Analog clock", clockAsk: "Analog clock showing a time to read",
    clHourOn: "The short hand points to {h}.", clHourPast: "The short hand is just past {h}.",
    clOclock: "The long hand points to 12, so it is {h} o'clock.", clMin: "The long hand points to {n}, which is {m} minutes.",
    clMark: "The long hand is 1 small mark past the {n}, so {b} + 1 = {m} minutes.",
    clMarks: "The long hand is {k} small marks past the {n}, so {b} + {k} = {m} minutes.",
    clTry15: "Try quarter hours", clTry5: "Try every 5 minutes", clTry1: "Try every minute"
  },
  de: {
    clName: "Wie spät ist es?", level: "Stufe", lvHalf: "Volle & halbe Stunden", lvQuarter: "Viertelstunden", lvFive: "Alle 5 Min.", lvOne: "Jede Minute",
    helperLabel: "Minutenzahlen auf der Uhr zeigen", clKbd: "Die Tastatur geht auch: 1 bis 4 wählt eine Antwort, Enter geht weiter.",
    clPrompt: "Lies die Uhr. Wähle die Uhrzeit.", clShort: "Kurzer Zeiger = Stunde", clLong: "Langer Zeiger = Minuten",
    newTime: "Neue Uhrzeit", nextTime: "Nächste Uhrzeit", clItIs: "Nicht ganz. Es ist {time}.",
    clockAria: "Analoguhr", clockAsk: "Analoguhr mit einer Uhrzeit zum Ablesen",
    clHourOn: "Der kurze Zeiger zeigt auf die {h}.", clHourPast: "Der kurze Zeiger ist kurz nach der {h}.",
    clOclock: "Der lange Zeiger zeigt auf die 12, also ist es {h} Uhr.", clMin: "Der lange Zeiger zeigt auf die {n}, das sind {m} Minuten.",
    clMark: "Der lange Zeiger steht 1 kleinen Strich nach der {n}, also {b} + 1 = {m} Minuten.",
    clMarks: "Der lange Zeiger steht {k} kleine Striche nach der {n}, also {b} + {k} = {m} Minuten.",
    clTry15: "Probiere Viertelstunden", clTry5: "Probiere alle 5 Minuten", clTry1: "Probiere jede Minute"
  }
});

(function () {
  const L = Loopy.t;
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("clock");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const helperEl = document.getElementById("helper");
  const levelBtns = [...document.querySelectorAll(".levels button")];

  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(localStorage.getItem(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  // Each age starts at its own level; a level picked by hand is remembered for that age.
  const stepForAge = (a) => a <= 6 ? 30 : a === 7 ? 15 : a === 8 ? 5 : 1;
  let age = window.Loopy ? Loopy.getAge() : 8;
  let step = store.get("clockquiz.step.a" + age, stepForAge(age), [30, 15, 5, 1]);
  let showHelper = store.get("clockquiz.helper", false, [true, false]);
  let right = 0, tried = 0, streak = 0;
  let current = null, answered = false, lastKey = "";

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  const pt = (deg, r) => { const a = (deg - 90) * Math.PI / 180; return [200 + r * Math.cos(a), 200 + r * Math.sin(a)]; };

  // Static clock face, drawn once.
  const face = el("g", {}, svg);
  el("circle", { cx: 200, cy: 200, r: 186, fill: "var(--face)", stroke: "var(--rim)", "stroke-width": 10 }, face);
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const [x1, y1] = pt(i * 6, major ? 158 : 166);
    const [x2, y2] = pt(i * 6, 176);
    el("line", { x1, y1, x2, y2, stroke: "#1d2a3f", "stroke-width": major ? 5 : 2, "stroke-linecap": "round" }, face);
  }
  for (let h = 1; h <= 12; h++) {
    const [x, y] = pt(h * 30, 128);
    const t = el("text", { x, y, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 38, "font-weight": 700, fill: "#1d2a3f", "font-family": "Lexend, sans-serif" }, face);
    t.textContent = h;
  }
  const minuteLabels = el("g", {}, svg);
  for (let m = 0; m < 60; m += 5) {
    const [x, y] = pt(m * 6, 146);
    const t = el("text", { x, y, "text-anchor": "middle", "dominant-baseline": "central", "font-size": 13, "font-weight": 600, fill: "#e2622b", "font-family": "Lexend, sans-serif" }, minuteLabels);
    t.textContent = m === 0 ? "00" : (m < 10 ? "0" + m : m);
  }
  const hourHand = el("line", { x1: 200, y1: 200, x2: 200, y2: 110, stroke: "var(--hour)", "stroke-width": 14, "stroke-linecap": "round" }, svg);
  const minuteHand = el("line", { x1: 200, y1: 200, x2: 200, y2: 50, stroke: "var(--minute)", "stroke-width": 8, "stroke-linecap": "round" }, svg);
  el("circle", { cx: 200, cy: 200, r: 11, fill: "#1d2a3f" }, svg);

  function setHands(h, m) {
    const hDeg = (h % 12) * 30 + m * 0.5;
    const mDeg = m * 6;
    let [x, y] = pt(hDeg, 92); hourHand.setAttribute("x2", x); hourHand.setAttribute("y2", y);
    [x, y] = pt(mDeg, 150); minuteHand.setAttribute("x2", x); minuteHand.setAttribute("y2", y);
    svg.setAttribute("aria-label", L("clockAsk"));
  }

  const fmt = (h, m) => h + ":" + String(m).padStart(2, "0");
  const key = (h, m) => h * 60 + m;
  const randInt = (n) => Math.floor(Math.random() * n);
  const wrapH = (h) => ((h - 1 + 12) % 12) + 1;
  const randomTime = () => ({ h: randInt(12) + 1, m: randInt(60 / step) * step });

  // Wrong choices based on the mistakes kids actually make.
  function distractors(t) {
    const out = [];
    const seen = new Set([key(t.h, t.m)]);
    const add = (h, m) => {
      if (m % step !== 0 || m < 0 || m > 55) return;
      const k = key(h, m);
      if (!seen.has(k)) { seen.add(k); out.push({ h, m }); }
    };
    const cands = [];
    // Hands swapped: minute hand read as the hour.
    if (t.m !== 0 && t.m % 5 === 0) cands.push([t.m / 5 === 0 ? 12 : t.m / 5, ((t.h % 12) * 5)]);
    // Hour hand already past the number: reading the next hour.
    if (t.m >= 30) cands.push([wrapH(t.h + 1), t.m]);
    cands.push([wrapH(t.h - 1), t.m]);
    // Counting the long hand's number as minutes (e.g. 9 → 9 minutes isn't valid, so use the mirrored time).
    cands.push([t.h, (60 - t.m) % 60]);
    cands.push([t.h, (t.m + 30) % 60]);
    // Shuffle candidates so the pattern isn't predictable.
    cands.sort(() => Math.random() - 0.5);
    for (const [h, m] of cands) { if (out.length < 3) add(h, m); }
    while (out.length < 3) { const r = randomTime(); add(r.h, r.m); }
    return out;
  }

  function explain(t) {
    const hour = L(t.m === 0 ? "clHourOn" : "clHourPast", { h: t.h });
    if (t.m % 5 !== 0) {
      const base = Math.floor(t.m / 5);
      const marks = t.m % 5;
      return hour + " " + L(marks > 1 ? "clMarks" : "clMark", { k: marks, n: base || 12, b: base * 5, m: t.m });
    }
    return hour + " " + (t.m === 0 ? L("clOclock", { h: t.h }) : L("clMin", { n: t.m / 5 || 12, m: t.m }));
  }

  function render() {
    document.getElementById("score").textContent = right + " / " + tried;
    document.getElementById("streak").textContent = streak;
    levelBtns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.step === step)));
    helperEl.checked = showHelper;
    minuteLabels.style.display = showHelper ? "" : "none";
  }

  function newRound() {
    let t;
    do { t = randomTime(); } while (fmt(t.h, t.m) === lastKey);
    lastKey = fmt(t.h, t.m);
    current = t; answered = false;
    setHands(t.h, t.m);
    const choices = [t, ...distractors(t)].sort(() => Math.random() - 0.5);
    answersEl.innerHTML = "";
    choices.forEach((c, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.id = "choice-" + i;
      b.textContent = fmt(c.h, c.m);
      b.dataset.correct = String(c === t);
      b.addEventListener("click", () => choose(b));
      answersEl.appendChild(b);
    });
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    document.getElementById("next").textContent = L("newTime");
  }

  function choose(btn) {
    if (answered) return;
    answered = true; tried++;
    const ok = btn.dataset.correct === "true";
    const buttons = [...answersEl.children];
    buttons.forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === "true") b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    if (ok) { right++; streak++; } else { streak = 0; }
    if (window.Loopy && Loopy.rewards) ok ? Loopy.rewards.correct("clock", streak, harder()) : Loopy.rewards.wrong("clock", { q: "🕒", a: fmt(current.h, current.m), y: btn.textContent, k: Loopy.log.timeKind(current.m) });
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    const head = ok ? (streak >= 3 ? L("correctRow", { n: streak }) : L("correct")) : L("clItIs", { time: fmt(current.h, current.m) });
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = head;
    feedbackEl.appendChild(document.createTextNode(explain(current)));
    document.getElementById("next").textContent = L("nextTime");
    render();
    document.getElementById("next").focus({ preventScroll: true });
  }

  // What "Make it harder" does after 10 in a row: move to the next level.
  function harder() {
    const steps = [30, 15, 5, 1];
    const i = steps.indexOf(step);
    if (i < 0 || i === steps.length - 1) return null;
    return { label: L("clTry" + steps[i + 1]), apply: () => { step = steps[i + 1]; store.set("clockquiz.step.a" + age, step); render(); } };
  }
  levelBtns.forEach(b => b.addEventListener("click", () => {
    step = +b.dataset.step; store.set("clockquiz.step.a" + age, step); render(); newRound();
  }));
  helperEl.addEventListener("change", () => { showHelper = helperEl.checked; store.set("clockquiz.helper", showHelper); render(); });
  window.addEventListener("loopy:age", (e) => {
    age = e.detail; step = store.get("clockquiz.step.a" + age, stepForAge(age), [30, 15, 5, 1]); render(); newRound();
  });
  document.getElementById("next").addEventListener("click", newRound);
  document.getElementById("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; if (window.Loopy && Loopy.recent) Loopy.recent.clear("clock"); render(); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") { newRound(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !answered) { const b = answersEl.children[n - 1]; if (b) choose(b); }
  });

  render();
  newRound();
})();
</script>
</body>
</html>
