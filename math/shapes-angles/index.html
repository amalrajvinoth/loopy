/* Layout: a picture and a question, answer buttons below. Shared look with the other games. */

  --bg: #f3f6fb;

  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;

}

.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 14px 14px 12px; gap: 8px; }
.feedback { min-height: 2.9em; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }
/* Short phones: keep long explanations from pushing the answers off screen. */
@media (max-height: 760px) and (orientation: portrait) {
  .feedback { font-size: 0.95rem; line-height: 1.35; }
  .feedback strong { font-size: 1.15rem; }
}

/* Portrait: the page is exactly one screen tall; the answers stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
}
@media (orientation: portrait) {
  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .problem-card { min-height: 0; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (max-height: 500px) {
  .feedback { font-size: 0.9rem; line-height: 1.3; }
  .feedback strong { font-size: 1.05rem; }
}

/* Shapes and Angles: a drawing, a question, and the answers to pick from. */
.pic { display: block; width: 100%; max-width: 420px; height: auto; max-height: clamp(120px, 34dvh, 300px); flex: 0 1 auto; }
.pic .sh-fill { fill: var(--chip); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.pic .sh-area { fill: var(--accent); fill-opacity: 0.3; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
.pic .sh-grid { stroke: var(--line); stroke-width: 1.2; fill: none; }
.pic .sh-line { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; fill: none; }
.pic .sh-dash { stroke: var(--mark); stroke-width: 3; stroke-dasharray: 8 6; stroke-linecap: round; fill: none; }
.pic .sh-arc { stroke: var(--accent); stroke-width: 3.5; fill: none; }
.pic .sh-mark { stroke: var(--accent); stroke-width: 2.5; fill: none; }
.pic .sh-dot { fill: var(--ink); }
.pic .sh-text { fill: var(--ink); font-family: var(--font); font-size: 15px; font-weight: 600; text-anchor: middle; }
.pic .sh-text.hi { fill: var(--accent); }
.question { margin: 0; font-size: clamp(1rem, min(4.6vw, 2.8dvh), 1.4rem); font-weight: 700; line-height: 1.25;
  text-align: center; max-width: 32ch; text-wrap: balance; }
.side { display: flex; flex-direction: column; gap: 10px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
/* Two or three answers: one column, so no answer looks bigger than the others. */
.choices.one { grid-template-columns: 1fr; }
.choices.one button { min-height: clamp(48px, 7dvh, 80px); }
.choices button {
  font: inherit; font-size: clamp(1.1rem, min(5.2vw, 3.4dvh), 1.8rem); font-weight: 700; color: var(--ink); line-height: 1.2;
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: clamp(56px, 9dvh, 96px); padding: 6px 10px; cursor: pointer;
  overflow-wrap: anywhere; hyphens: auto; font-variant-numeric: tabular-nums;
  transition: transform .08s ease, border-color .15s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button:active:not(:disabled) { transform: scale(0.96); }
.choices button:disabled { cursor: default; }
.choices button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.faded { opacity: 0.45; }
.next { font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(52px, 7dvh, 72px); cursor: pointer; width: 100%; }
.seg button { padding-inline: 4px; line-height: 1.2; }
@media (min-width: 600px) and (orientation: portrait) {
  .choices button { min-height: clamp(64px, 10dvh, 120px); }
  .pic { max-height: clamp(160px, 36dvh, 360px); }
}
@media (orientation: landscape) and (min-width: 640px) {
  .problem-card { height: 100%; justify-content: center; }
  .side { height: 100%; justify-content: center; }
  .choices button { min-height: clamp(52px, 14dvh, 130px); }
  .pic { max-height: clamp(120px, 44dvh, 360px); }
}
/* After the answer the drawing gets smaller, so the question and the reason have room. */
@media (max-height: 900px), (max-width: 599px) {
  .problem-card.good .pic, .problem-card.bad .pic { max-height: clamp(80px, 20dvh, 180px); }
}
@media (max-height: 700px) {
  .pic { max-height: clamp(100px, 28dvh, 220px); }
  .question { font-size: clamp(0.95rem, min(4.2vw, 2.6dvh), 1.2rem); }
  .problem-card.good .pic, .problem-card.bad .pic { display: none; }
}
@media (max-height: 500px) {
  .question { font-size: 0.95rem; }
}

/* Worksheet cells (only printed): the drawing, then the answers to circle. Black on white, whatever the theme. */
@media print {
  .sheet-grid li > div.ws-sh { align-items: center; gap: 0.8mm; padding: 1.5mm 2mm 0; width: 100%; }
  .ws-sh svg { width: 30mm; height: 20mm; display: block; }

  .ws-sh .sh-area { fill: #ddd; stroke: #000; stroke-width: 3; }
  .ws-sh .sh-grid { stroke: #999; stroke-width: 1.2; fill: none; }
  .ws-sh .sh-line { stroke: #000; stroke-width: 3.5; stroke-linecap: round; fill: none; }
  .ws-sh .sh-dash { stroke: #000; stroke-width: 3; stroke-dasharray: 8 6; fill: none; }
  .ws-sh .sh-arc, .ws-sh .sh-mark { stroke: #000; stroke-width: 3; fill: none; }
  .ws-sh .sh-dot { fill: #000; }
  .ws-sh .sh-text { fill: #000; font-family: "Lexend", Arial, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
  .ws-sh .ws-q { font-size: 8pt; font-weight: 600; line-height: 1.15; text-align: center; }
  .ws-sh .ws-opts { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.2mm 2.5mm; font-size: 8pt; line-height: 1.2; color: #333; }
  .ws-sh .ws-opts span::before { content: "○ "; }
}

  tk: "tri", ta: "tri", tq: "tri", tr: "tri", ba: "tri", bp: "tri" };

// Regular polygon points (n corners, center, radius, angle of the first corner in degrees).
function regular(n, cx, cy, r, rot) {

// A quadrilateral from three of its angles (degrees), made by walking round: fails (null) when it would not close.

    const s = ((p0[0] - p2[0]) * u[1] - (p0[1] - p2[1]) * u[0]) / den;

const fmt = (x) => (Math.round(x * 10) / 10).toString();

// Three (or fewer) other numbers near the answer, so the choices look alike. Prefers the given decoys.
function numOptions(answer, decoys, count) {
  const out = [answer], ok = (x) => Number.isInteger(x) && x >= 0 && !out.includes(x);
  shuffle(decoys.filter(ok)).forEach(x => { if (out.length < count && ok(x)) out.push(x); });
  for (let d = 1; out.length < count && d < 50; d++) { const c = shuffle([answer + d, answer - d]); c.forEach(x => { if (out.length < count && ok(x)) out.push(x); }); }
  return shuffle(out);

// A random spec for one kind of question.
function randomSpec(type, level) {
  switch (type) {
    case "nm": return "nm." + pick(NAMED[level >= 2 ? 2 : 1]);
    case "co": return "co." + pick(NAMED[1]);
    case "si": return "si." + pick(NAMED[1].filter(s => P[s].n));
    case "ra": return "ra." + pick(WITH_RA);
    case "ln": return "ln." + pick(LINES);
    case "sy": { const s = pick(WITH_SYM.concat(["circle"])); return "sy." + s + "." + pick(Object.keys(P[s].sy)); }
    case "sc": return "sc." + pick(WITH_SYM);
    case "ar": case "pe": { const w = 2 + randInt(8), h = 2 + randInt(5); return type + "." + w + "x" + (h === w ? h + 1 : h); }
    case "al": case "pl": { const w = 4 + randInt(6), h = 3 + randInt(4); return type + "." + w + "x" + h + "." + (1 + randInt(w - 2)) + "x" + (1 + randInt(h - 2)); }
    case "at": { const k = pick(ANGLE_KINDS); return "at." + pick(ANGLES[k]); }
    case "ae": return "ae." + pick(range(20, 340, 10));
    case "ac": return "ac." + pick(range(20, 160, 5).filter(x => x !== 90));
    case "aq": return "aq." + pick(range(10, 80, 5).filter(x => x !== 45));
    case "tk": return "tk." + pick(TRI_KINDS);

// The problem from its spec: question, choices, the answer, one line of why, and how to draw it (draw(svg)).

function build(spec, t, nOpts) {

      p.draw(svg);
      box.appendChild(svg);
      box.appendChild(part("ws-q", p.q));
      const opts = part("ws-opts");
      p.options.forEach(o => opts.appendChild(part("", o)));
      box.appendChild(opts);
      return box;
    },
    answer: (p) => p.q + " " + p.answer
  });

  newRound();
})();
</script>
