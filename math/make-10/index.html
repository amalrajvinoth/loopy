<style>
/* Layout: one centered column like a worksheet strip; problem written vertically on a card, big number pad below, toggles in a quiet bar on top. */
:root {

  --mark: #e2622b;
  --good: #1f8a4c;

/* Make 10: the problem is written in one line ("7 + ? = 10"), with an optional ten-frame picture. */
.eq { display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 0 0.28em;
  font-size: clamp(2.4rem, min(12vw, 8dvh), 5rem); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.eq .op { color: var(--accent); }
.eq .eqs { color: var(--muted); }

.eq .ans.empty::after { content: "?"; color: var(--muted); }
.problem-card.good .eq .ans { color: var(--good); border-color: var(--good); }
.problem-card.bad .eq .ans { color: var(--bad); border-color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.06em; }
/* Ten-frames: each box of 10 is 2 rows of 5. Make 20 shows two side by side, Make 100 shows ten (a hundred square).

.frames { display: grid; grid-template-columns: repeat(var(--across), auto); gap: calc(var(--cell) * 0.5) calc(var(--cell) * 0.7); justify-content: center; }
.frames[hidden] { display: none; }
.frames .ten { display: grid; grid-template-columns: repeat(5, var(--cell)); gap: calc(var(--cell) * 0.16); padding: calc(var(--cell) * 0.16); background: var(--chip); border-radius: calc(var(--cell) * 0.3); }
.frames i { width: var(--cell); height: var(--cell); border-radius: 22%; border: max(1.5px, calc(var(--cell) * 0.08)) solid var(--line); background: var(--card); display: block; box-sizing: border-box; }
.frames i.on { background: var(--c1); border-color: var(--c1); }
.frames i.add { background: var(--c4); border-color: var(--c4); }
.seg.five { grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); }
.helper { display: flex; align-items: center; gap: 8px; min-height: 40px; cursor: pointer; }

@media (max-height: 900px), (max-width: 599px) {

<script>
Loopy.addStrings({
  en: {
    mkName: "Make 10", mkTitle: "Make {n}", mkMake: "Make",
    mk10: "Make 10", mk20: "Make 20", mkTens: "Tens to 100", mk100: "Make 100", mk1000: "Make 1,000",
    picsLabel: "Show the ten-frame picture",
    mkAria: "{a} plus what makes {n}?", mkHint: "What number makes {n}?", mkCount: "Count the empty boxes, or use what you know.",
    mkPair: "{a} and {b} make {n}.",
    mkVia10: "{a} needs {c} more to make 10. Then 10 more makes 20. {c} + 10 = {b}.",
    mkTeen: "{a} is 10 and {o}. {o} needs {b} more to make 10, and 10 + 10 = 20.",
    mkTensWhy: "{x} tens and {y} tens make 10 tens, and 10 tens are 100.",
    mkHundredsWhy: "{x} hundreds and {y} hundreds make 10 hundreds, and 10 hundreds are 1,000.",
    mkVia: "{a} needs {o} more to make {next}. Then {r} more makes {n}. {o} + {r} = {b}.",
    mkEmpty: "The boxes that filled in show {b}.",
   
    mkHow: "Write the missing number."
  },
  de: {
    mkName: "Ergänze bis 10", mkTitle: "Ergänze bis {n}", mkMake: "Ergänze",
    mk10: "Bis 10", mk20: "Bis 20", mkTens: "Zehner bis 100", mk100: "Bis 100", mk1000: "Bis 1.000",
    picsLabel: "Zehnerfeld-Bild zeigen",
    mkAria: "{a} plus wie viel ergibt {n}?", mkHint: "Welche Zahl fehlt bis {n}?", mkCount: "Zähle die leeren Kästchen oder rechne im Kopf.",
    mkPair: "{a} und {b} ergeben {n}.",
    mkVia10: "{a} braucht {c} bis zur 10. Dann noch 10 bis zur 20. {c} + 10 = {b}.",
    mkTeen: "{a} ist 10 und {o}. {o} braucht {b} bis zur 10, und 10 + 10 = 20.",
    mkTensWhy: "{x} Zehner und {y} Zehner sind 10 Zehner, und 10 Zehner sind 100.",
    mkHundredsWhy: "{x} Hunderter und {y} Hunderter sind 10 Hunderter, und 10 Hunderter sind 1.000.",
    mkVia: "{a} braucht {o} bis zur {next}. Dann noch {r} bis zur {n}. {o} + {r} = {b}.",
    mkEmpty: "Die neu gefüllten Kästchen zeigen {b}.",
   
    mkHow: "Schreibe die Zahl, die fehlt."
  }
});

// GEN START
const randInt = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const fmt = (n) => Loopy.num(n);
const t = Loopy.t;

// The levels, easiest first. "tens" is Make 100 with whole tens only (30 + 70).
const LEVELS = ["10", "20", "tens", "100", "1000"];
const targetOf = (lv) => lv === "10" ? 10 : lv === "20" ? 20 : lv === "1000" ? 1000 : 100;
const levelName = (lv) => ({ "10": "mk10", "20": "mk20", tens: "mkTens", "100": "mk100", "1000": "mk1000" })[lv];
// What each age starts with, and whether the ten-frame picture is on.
function levelForAge(age) {
  if (age <= 6) return "10";
  if (age === 7) return "20";
  if (age === 8) return "tens";
  return age === 9 ? "100" : "1000";
}
const picsForAge = (age) => age <= 8;

// One problem: the number shown (a), the total (n) and the missing part (answer).
function makeProblem(lv, avoid) {
  const n = targetOf(lv);
  for (let tries = 0; tries < 300; tries++) {
    let a;
    if (lv === "10") a = randInt(1, 9);
    else if (lv === "20") a = randInt(1, 19);
    else if (lv === "tens") a = randInt(1, 9) * 10;
    else if (lv === "1000") a = Math.random() < 0.8 ? randInt(101, 999) : randInt(1, 9) * 100;
    else a = Math.random() < 0.8 ? randInt(11, 99) : randInt(1, 9) * 10;
    if (lv === "100" && a % 10 === 0 && a > 10 && Math.random() < 0.5) continue;
    if (lv === "1000" && a % 100 === 0 && Math.random() < 0.5) continue;
    const key = lv + ":" + a;
    if (avoid && avoid.includes(key) && tries < 250) continue;
    return { lv, n, a, key, answer: n - a };
  }
  return { lv, n, a: 7, key: lv + ":7", answer: n - 7 };
}

// A short, friendly reason: pairs to 10 first, then the next ten (or hundred), then the rest.
function explain(p) {
  const a = p.a, b = p.answer;
  if (p.n === 10) return t("mkPair", { a, b, n: 10 });
  if (p.n === 20) {
    if (a === 10) return t("mkPair", { a, b, n: 20 });
    if (a < 10) return t("mkVia10", { a, b, c: 10 - a });
    return t("mkTeen", { a, b, o: a - 10 });
  }
  if (p.n === 1000) {
    // 600 + 400: whole hundreds. 640: up to 700, then 300 more. 647: up to 650, then 350 more.
    if (a % 100 === 0) return t("mkHundredsWhy", { x: a / 100, y: b / 100 });
    const step = a % 10 === 0 ? 100 : 10, next = Math.ceil(a / step) * step;
    if (next === 1000) return t("mkPair", { a: fmt(a), b: fmt(b), n: fmt(1000) });
    return t("mkVia", { a: fmt(a), b: fmt(b), o: next - a, next: fmt(next), r: fmt(1000 - next), n: fmt(1000) });
  }
  if (a % 10 === 0) return t("mkTensWhy", { x: a / 10, y: b / 10 });
  const next = Math.ceil(a / 10) * 10;
  if (next === 100) return t("mkPair", { a, b, n: 100 });
  return t("mkVia", { a, b, o: next - a, next, r: 100 - next, n: 100 });
}
// GEN END

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), ansEl = $("ans"), feedbackEl = $("feedback"), goBtn = $("k-go"), framesEl = $("frames"), picsBox = $("pics-on");
  const lvBtns = [...document.querySelectorAll("#lv-seg button")];
  const digitBtns = [...document.querySelectorAll("#pad [data-d]")];

  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = window.Loopy ? Loopy.getAge() : 8;
  let lv, pics;
  // Settings are remembered per age, so each age starts at the right level.
  function loadForAge() {
    lv = store.get("mk.lv.a" + age, levelForAge(age), LEVELS);
    pics = store.get("mk.pics.a" + age, picsForAge(age), [true, false]);
    // Opened from the grown-ups' page to practise one level: set it for this visit, without saving.
    const m = /^mk-(10|20|100|1000)$/.exec(Loopy.log.hint || "");
    if (m) { lv = m[1]; Loopy.log.hint = ""; }
  }
  loadForAge();
  if (window.Loopy && Loopy.levels) Loopy.levels.init({ names: ["mk10", "mk20", "mkTens", "mk100", "mk1000"],
    get: () => LEVELS.indexOf(lv), base: () => LEVELS.indexOf(levelForAge(age)),
    set: (i) => { lv = LEVELS[i]; store.set("mk.lv.a" + age, lv); recent = []; render(); } });

  let right = 0, tried = 0, streak = 0;
  let current = null, typed = "", answered = false, recent = [];
  const recentMax = () => lv === "10" || lv === "tens" ? 5 : 12;

  // Ten-frame picture: one frame per 10, filled boxes for the number shown.
  // After answering, the missing part fills in too, so the whole total is full.
  function drawFrames() {
    const p = current;
    framesEl.hidden = !(pics && p && p.n <= 100); // 1,000 would need 100 frames
    if (framesEl.hidden) return;
    const frames = p.n / 10, across = frames === 1 ? 1 : 2, down = Math.ceil(frames / across);
    const cols = across * 5, rows = down * 2;
    // Room left in the card once the sum and the words have their space.
    framesEl.hidden = true;
    const free = card.clientHeight - $("eq").offsetHeight - feedbackEl.offsetHeight - 50;
    framesEl.hidden = false;
    const w = card.clientWidth - 48, h = Math.max(rows * 7, Math.min(free, innerHeight * 0.4));
    const size = Math.max(5, Math.min(48, Math.floor(w / (cols * 1.35 + 1)), Math.floor(h / (rows * 1.35 + down * 0.6))));
    framesEl.style.setProperty("--cell", size + "px");
    framesEl.style.setProperty("--across", String(across));
    framesEl.innerHTML = "";
    for (let f = 0; f < frames; f++) {
      const ten = document.createElement("div");
      ten.className = "ten";
      for (let c = 0; c < 10; c++) {
        const i = document.createElement("i"), k = f * 10 + c;
        if (k < p.a) i.className = "on";
        else if (answered) i.className = "add";
        ten.appendChild(i);
      }
      framesEl.appendChild(ten);
    }
  }

  function render() {
    if (window.Loopy && Loopy.levels) Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    lvBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lv === lv)));
    picsBox.checked = pics;
    $("title").textContent = t("mkTitle", { n: fmt(targetOf(lv)) });
    ansEl.textContent = typed === "" ? "" : fmt(parseInt(typed, 10));
    ansEl.classList.toggle("empty", !answered && typed === "");
    goBtn.textContent = t(answered ? "next" : "check");
    goBtn.disabled = !answered && typed === "";
    digitBtns.forEach(b => b.disabled = answered);
    $("k-erase").disabled = answered || typed === "";
  }

  // Try again: a missed sum comes back later (Loopy.retry). The note is "10 7" (the total, then the number
  // shown); one from another level waits.
  const note = (p) => p.n + " " + p.a;
  function rebuild(r) {
    const m = /^(10|20|100|1000) (\d{1,3})$/.exec(r);
    if (!m) return null;
    const n = +m[1], a = +m[2];
    if (n !== targetOf(lv) || a < 1 || a >= n || (lv === "tens" && a % 10 !== 0)) return null;
    return { lv, n, a, key: lv + ":" + a, answer: n - a };
  }

  function newRound() {
    current = Loopy.retry.fresh("make-10", recent, () => makeProblem(lv), rebuild);
    typed = ""; answered = false;
    $("eq-a").textContent = fmt(current.a);
    $("eq-n").textContent = fmt(current.n);
    $("eq").setAttribute("aria-label", t("mkAria", { a: current.a, n: current.n }));
    card.className = "problem-card";
    feedbackEl.className = "feedback";
    feedbackEl.innerHTML = '<span class="hint"></span>';
    feedbackEl.firstChild.textContent = pics ? t("mkCount") : t("mkHint", { n: fmt(current.n) });
    render();
    drawFrames();
    Loopy.speech.read();
  }

  function press(d) {
    if (answered || typed.length >= String(current.n).length) return;
    if (typed === "0") typed = "";
    typed += d;
    render();
  }
  function erase() {
    if (answered) return;
    typed = typed.slice(0, -1);
    render();
  }
  function check() {
    if (answered || typed === "") return;
    answered = true; tried++;
    const ok = parseInt(typed, 10) === current.answer;
    if (ok) { right++; streak++; } else { streak = 0; }
    if (window.Loopy && Loopy.rewards) ok ? Loopy.rewards.correct("make-10", streak) : Loopy.rewards.wrong("make-10", { q: fmt(current.a) + " + ? = " + fmt(current.n), a: fmt(current.answer), y: fmt(parseInt(typed, 10)), k: "mk-" + current.n, r: note(current) });
    card.className = "problem-card " + (ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    const head = ok
      ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct"))
      : t("notQuite") + " " + fmt(current.a) + " + " + fmt(current.answer) + " = " + fmt(current.n) + ".";
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = head;
    let why = explain(current);
    if (pics && current.n <= 20) why += " " + t("mkEmpty", { b: current.answer });
    feedbackEl.appendChild(document.createTextNode(why));
    render();
    drawFrames();
  }
  function go() { answered ? newRound() : check(); }

  digitBtns.forEach(b => b.addEventListener("click", () => press(b.dataset.d)));
  $("k-erase").addEventListener("click", erase);
  goBtn.addEventListener("click", go);
  lvBtns.forEach(b => b.addEventListener("click", () => {
    lv = b.dataset.lv; store.set("mk.lv.a" + age, lv); recent = []; newRound();
  }));
  picsBox.addEventListener("change", () => { pics = picsBox.checked; store.set("mk.pics.a" + age, pics); render(); drawFrames(); });
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  window.addEventListener("resize", drawFrames);
  // The shared top bar and the fonts change the room on the card, so measure again once they are in.
  window.addEventListener("load", drawFrames);
  if (document.fonts) document.fonts.ready.then(drawFrames);
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; if (window.Loopy && Loopy.recent) Loopy.recent.clear("make-10"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || document.querySelector(".loopy-cheer.big")) return;
    if (e.target.tagName === "INPUT") return;
    if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === "Backspace") { erase(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (document.activeElement && document.activeElement.tagName === "BUTTON" && document.activeElement !== goBtn) return;
      go(); e.preventDefault();
    }
  });

  // Read aloud: "7 plus what makes 10?"
  Loopy.speech.question({ host: card, text: () => t("mkAria", { a: current.a, n: current.n }) });

  // Print worksheet: 20 problems at the same level as the game, like "7 + ____ = 10".
  Loopy.worksheet({
    title: () => t("mkTitle", { n: fmt(targetOf(lv)) }),
    level: () => [t("ageLabel", { n: age }), t(levelName(lv))].join(" · "),
    how: () => t("mkHow"),
    layout: "line",
    make: (n) => { const list = [], keys = []; while (list.length < n) { const p = makeProblem(lv, keys); keys.push(p.key); if (keys.length > recentMax()) keys.shift(); list.push(p); } return list; },
    cell: (p) => {
      const line = document.createElement("span");
      line.className = "ws-sl";
      line.appendChild(document.createTextNode(fmt(p.a) + " +"));
      const blank = document.createElement("span");
      blank.className = "ws-blank";
      line.appendChild(blank);
      line.appendChild(document.createTextNode(" = " + fmt(p.n)));
      return line;
    },
    answer: (p) => fmt(p.a) + " + " + fmt(p.answer) + " = " + fmt(p.n)
  });

  newRound();
})();
</script>
