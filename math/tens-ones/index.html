<style>
/* Layout: a small times table grid on the card with one cell marked, the number pad below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));

  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 4px; min-height: 44px; cursor: pointer;
}
.seg button:last-child { grid-column: 1 / -1; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .erase { font-size: 1.15rem; color: var(--muted); }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }

@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }

/* Portrait: the page is exactly one screen tall; the pad stays at the bottom and the card shrinks to fit. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }

/* Tens and Ones: the school picture. A square is a hundred, a line is a ten, a dot is a one.
   Under it the place value table (H, T, O and the number) as boxes; the box being asked has the accent line. */
.tag { margin: 0; font-size: 0.85rem; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 4px 12px; }
.pic { display: flex; align-items: center; justify-content: center; gap: clamp(14px, 5vw, 32px); width: 100%; min-height: 48px; --ln: clamp(72px, 24vw, 120px); --dt: clamp(12px, 3.4vw, 18px); }
.pic[hidden] { display: none; }
.pic i { display: block; background: var(--ink); }
.pic .hund { display: grid; grid-template-columns: repeat(3, auto); gap: 6px; }
.pic .hund i { width: clamp(22px, 6vw, 32px); height: clamp(22px, 6vw, 32px); border-radius: 4px; }
.pic .lines { display: flex; flex-direction: column; gap: 5px; }
.pic .lines i { width: var(--ln); height: 4px; border-radius: 2px; }
.pic .dots { display: grid; grid-template-columns: repeat(5, var(--dt)); gap: 6px; }
.pic .dots i { width: var(--dt); height: var(--dt); border-radius: 50%; }
.pic i.gone { background: transparent; border: 2px solid var(--bad); }
.pic i.add { background: var(--accent); }
.pic.empty { border: 2px dashed var(--line); border-radius: 18px; min-height: 64px; width: min(100%, 280px); }
.pic.drawn { border: 2px solid var(--line); border-radius: 18px; padding: 10px 12px; width: min(100%, 280px); min-height: 64px; }
.pic.drawn .lines i { width: clamp(64px, 20vw, 100px); }
/* The place value table: a heading over each box, the number box last after an equals sign. */
.tbl { display: flex; align-items: flex-end; justify-content: center; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tbl .col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tbl .hd { font-size: 0.8rem; font-weight: 700; color: var(--muted); letter-spacing: 0.04em; }
.tbl .box { min-width: clamp(48px, 14vw, 64px); height: clamp(44px, 6.5dvh, 64px); padding: 0 8px; display: grid; place-items: center; border: 2px solid var(--line); border-radius: 14px; background: var(--chip); color: var(--ink); font-size: clamp(1.3rem, 5vw, 1.8rem); line-height: 1; }
.tbl .num .box { min-width: clamp(64px, 20vw, 96px); }
.tbl .eq { font-size: 1.4rem; color: var(--muted); height: clamp(44px, 6.5dvh, 64px); display: grid; place-items: center; }
.tbl .box.blank { border-style: dashed; background: var(--card); }
.tbl .box.ask { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; background: var(--card); color: var(--accent); }
.tbl .box.ask:empty::after { content: "?"; color: var(--muted); }
.tbl .box.ok { border-color: var(--good); color: var(--good); background: var(--good-bg); }
.tbl .box.fixed { border-color: var(--bad); color: var(--ink); }
.tbl .box.live { color: var(--accent); }
.problem-card.good .tbl .box.ask { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; color: var(--good); }
.problem-card.bad .tbl .box.ask { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.08em; }
/* Giants and dwarfs: the sum in one big line, the part already done in a chip under it. */
.sum { margin: 0; font-size: clamp(1.8rem, 8vw, 2.8rem); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.sum b { color: var(--accent); }
.sum b:empty::after { content: "?"; color: var(--muted); }
.problem-card.good .sum b { color: var(--good); }
.problem-card.bad .sum b { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.08em; }
.prev { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 12px; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.prev[hidden] { display: none; }
.question { margin: 0; font-size: clamp(1.1rem, min(5vw, 3.2dvh), 1.7rem); font-weight: 700; line-height: 1.25; text-align: center; text-wrap: balance; }
.where { margin: 0; font-size: 0.9rem; color: var(--muted); text-align: center; text-wrap: balance; }
/* Draw it: two big keys for a ten and a one take the place of the digits. */
.pad.draw { grid-template-columns: 1fr 1fr; }
.pad.draw [data-d="t"], .pad.draw [data-d="o"] { font-size: 1.35rem; }
.pad:not(.draw) [data-d="t"], .pad:not(.draw) [data-d="o"] { display: none; }
.pad.draw [data-d]:not([data-d="t"]):not([data-d="o"]) { display: none; }
@media (max-height: 760px) and (orientation: portrait) {
  .pic { --ln: clamp(64px, 20vw, 100px); --dt: clamp(11px, 3vw, 16px); }
  .pic .lines { gap: 4px; }
  .pic .dots { gap: 5px; }
  .tbl .box { height: clamp(40px, 6dvh, 56px); font-size: 1.3rem; }
  .tbl .eq { height: clamp(40px, 6dvh, 56px); }
}
/* The smallest phones: the kind tag goes, the picture and the boxes shrink, so the first-time hint still finds room. */
@media (max-height: 660px) and (orientation: portrait) {
  .tag { display: none; }
  .pic { --ln: clamp(56px, 18vw, 90px); --dt: 11px; min-height: 36px; }
  .pic .lines { gap: 2px; }
  .pic .lines i { height: 3px; }
  .pic .hund i { width: 20px; height: 20px; }
  .pic .dots { gap: 4px; }
  .tbl .box { height: 36px; font-size: 1.15rem; min-width: 44px; }
  .tbl .num .box { min-width: 56px; }
  .tbl .eq { height: 36px; }

  .question { font-size: 1.05rem; }

  .pic.drawn, .pic.empty { min-height: 48px; padding: 6px 10px; }
}
@media (max-height: 500px) { .tag { display: none; } .question { font-size: 1rem; } .tbl .box { height: 36px; font-size: 1.1rem; } .tbl .eq { height: 36px; } .pic { --ln: 60px; --dt: 10px; } .pic .lines { gap: 3px; } .pic .lines i { height: 3px; } .pic .dots { gap: 4px; } }

/* Worksheet cells (only printed): the picture in black with the table under it, a number with a box to draw in,

@media print {
  .sheet-clock .ws-to { display: flex; flex-direction: column; align-items: center; gap: 1.5mm; width: 100%; }

  .sheet-clock .ws-to i.ws-line { display: inline-block; width: 11mm; border-bottom: 0.4mm solid #000; margin-left: 1mm; background: none; }
}

<div class="wrap">

      <button type="button" id="k9" data-d="9">9</button>

      <button type="button" id="k-one" data-d="o" data-t="toOne" data-t-aria="toOneAria" aria-label="Add a one">• one</button>
      <button type="button" id="k-erase" class="erase" aria-label="Erase last digit" data-t-aria="eraseAria" data-t="erase">Erase</button>
      <button type="button" id="k0" data-d="0">0</button>
      <button type="button" id="k-go" class="go" data-t="check">Check</button>
    </div>
  </main>
</div>

    return pic;
  };
  Loopy.worksheet({
    title: () => t("toName"),
    level: () => [t("ageLabel", { n: age }), t("toLevel") + ": " + t("toL" + level)].join(" · "),
    how: () => t(level === 3 ? "toHowDraw" : level === 4 ? "toHowGd" : "toHowRead"),
    layout: "clock",
    make: (n) => { const out = [], keys = []; for (let i = 0; i < 400 && out.length < n; i++) { const p = makeProblem(); if (!keys.includes(p.key)) { keys.push(p.key); out.push(p); } } return out; },
    cell: (p) => {
      const box = el("div", "ws-to");
      if (p.type === "d") { box.appendChild(el("b", "", fmt(p.n))); box.appendChild(el("div", "ws-room")); return box; }
      if (p.type === "g") {
        ["o", "t"].forEach(id => { const line = el("span", "", p.sumOf(id) + " ="); line.appendChild(el("i", "ws-line")); box.appendChild(line); });
        return box;
      }
      box.appendChild(picFor(p.h, p.t, p.o));
      const table = el("table"), head = table.insertRow(), row = table.insertRow();
      (p.h ? ["toH", "toT", "toO"] : ["toT", "toO"]).forEach(k => head.appendChild(el("th", "", t(k))));
      head.appendChild(el("th", "ws-eq", "")); head.appendChild(el("th", "ws-n", t("toNum")));
      for (let i = 0; i < (p.h ? 3 : 2); i++) row.insertCell();
      row.insertCell().className = "ws-eq"; row.lastChild.textContent = "=";
      row.insertCell().className = "ws-n";
      box.appendChild(table);
      return box;
    },
    answer: (p) => p.type === "d" ? fmt(p.t) + " — , " + fmt(p.o) + " •" : p.type === "g" ? fmt(p.cells.o) + ", " + fmt(p.cells.t) : (p.h ? fmt(p.h) + " · " : "") + fmt(p.t) + " · " + fmt(p.o) + " = " + fmt(p.n)
  });

  newRound();
})();
</script>
