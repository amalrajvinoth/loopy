/* Class Test: the 12 tasks of the grade 3 paper in order, one card per task, the answers beside or below it,

:root {

}
* { box-sizing: border-box; }

    document.body.setAttribute("data-q", q.note);
    card.className = "problem-card";
    kindEl.textContent = t("ctT" + tk.slot) + " · " + (q.pts === 1 ? t("ctPts1") : t("ctPts", { n: num(q.pts) }));
    whereEl.textContent = t(points === 1 ? "ctTaskOne" : "ctTask", { n: num(taskIndex() + 1), p: num(points) });
    const parts = tk.qs.length > 1 ? t("ctPart", { n: num(tk.qs.indexOf(q) + 1), of: num(tk.qs.length) }) + " " : "";
    qEl.textContent = q.ask();
    const sub = parts + q.sub();
    if (sub.trim()) qEl.appendChild(el("small", "", sub.trim()));
    feedbackEl.className = "feedback"; feedbackEl.textContent = "";
    choicesEl.className = "choices" + (q.two ? " two" : q.names ? " names" : "");
    choicesEl.textContent = "";
    if (q.mode === "pick") q.choices.forEach((c, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.id = "c" + (i + 1); b.textContent = c.text; b.dataset.correct = String(c.ok); b.dataset.i = i;
      b.addEventListener("click", () => choose(b));
      choicesEl.appendChild(b);
    });
    render();
    strip();
    Loopy.speech.read();
  }
  function render() {
    const q = set[index], pad = q.mode === "pad";
    stage.textContent = "";
    q.task.draw(stage, q, state(q));
    padEl.hidden = !pad; pickEl.hidden = pad;
    goBtn.textContent = t(answered ? "next" : "check");
    goBtn.disabled = pad && !answered && typed === "";
    nextBtn.disabled = !answered;
    digitBtns.forEach(b => b.disabled = answered || !pad);
    eraseBtn.disabled = answered || !pad || typed === "";
    [...choicesEl.children].forEach(b => { b.disabled = answered; });
  }
  function press(d) { if (answered || set[index].mode !== "pad" || typed.length >= 3) return; if (typed === "0") typed = ""; typed += d; render(); }
  function erase() { if (answered || set[index].mode !== "pad") return; typed = typed.slice(0, -1); render(); }
  function finish(ok, mine) {
    const q = set[index], tk = q.task;
    answered = true; chosen = ok;
    tk.done = tk.done || {}; tk.done[q.note.split(":").pop()] = ok ? "ok" : "fixed";
    results.push({ task: tk, q, ok });
    streak = ok ? streak + 1 : 0;
    if (ok) points += q.pts;
    if (q.again && Loopy.retry.hand) Loopy.retry.hand("class-test", q.note);
    if (ok) Loopy.rewards.correct("class-test", streak, q.kind);
    else Loopy.rewards.wrong("class-test", { q: t("ctT" + tk.slot) + ": " + q.log(), a: String(q.answer), y: mine, k: q.kind, r: q.note });
    card.className = "problem-card " + (ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : (q.head ? q.head() : t("notQuite"));
    feedbackEl.appendChild(document.createTextNode((ok || q.mode !== "pad" ? "" : t("ctAnswerIs", { a: num(q.answer) }) + " ") + q.why()));
    whereEl.textContent = t(points === 1 ? "ctTaskOne" : "ctTask", { n: num(taskIndex() + 1), p: num(points) });
    render();
    [...choicesEl.children].forEach(b => { const c = q.choices ? q.choices[+b.dataset.i] : null; b.className = c ? (c.ok ? "right" : b === chosenBtn ? "wrong" : "faded") : ""; });
    strip();
    if (q.mode !== "pad") nextBtn.focus({ preventScroll: true });
  }
  function choose(btn) {
    if (answered || btn.disabled) return;
    chosenBtn = btn;
    finish(btn.dataset.correct === "true", btn.textContent);
  }
  function check() {
    if (answered || set[index].mode !== "pad" || typed === "") return;
    const mine = parseInt(typed, 10);
    finish(mine === set[index].answer, num(mine));
  }
  function go() {
    if (!answered) return check();
    index++;
    if (index >= set.length) return done();
    show();
    const a = document.activeElement;
    if (a && a !== document.body && (a.disabled || a.offsetParent === null)) (set[index].mode === "pad" ? digitBtns[0] : choicesEl.firstChild).focus({ preventScroll: true });
  }

  function done() {
    $("play").hidden = true;
    $("results").hidden = false;
    index = set.length; strip();
    const right = results.filter(r => r.ok).length, was = best();
    $("res-score").textContent = "";
    $("res-score").append(t("ctScore", { p: num(points) }), " ", el("small", "", t("ctPoints")));
    $("res-stars").textContent = right === 1 ? t("ctStar") : t("ctStars", { n: num(right) });
    if (points > was) { Loopy.store.set("ct.best", String(points)); $("res-best").textContent = t("ctNewBest", { p: num(points) }); }
    else $("res-best").textContent = t("ctBest", { p: num(was) });
    // One line of what to practise: the game behind the task with the most wrong answers.
    const misses = {};
    results.forEach(r => { if (!r.ok) misses[r.task.slot] = (misses[r.task.slot] || 0) + r.q.pts; });
    const worst = Object.keys(misses).sort((a, b) => misses[b] - misses[a])[0];
    const pr = $("res-practise");
    pr.textContent = "";
    if (!worst) pr.textContent = t("ctPerfect");
    else {
      const [before, after] = t("ctPractise").split("{game}");
      const a = document.createElement("a");
      a.href = GAME[worst]; a.textContent = t(GNAME[worst]);
      pr.append(before, a, after);
    }
    $("again").focus({ preventScroll: true });
    if (points >= 16) { Loopy.sound.play("cheer"); Loopy.rewards.confetti(90); }
  }

  // A fresh test: twelve fresh tasks, with any task from Try again put back in its place (opened from the Try
  // again card, those come first).
  function start() {
    const fromCard = Loopy.retry.opened ? Loopy.retry.opened() : false;
    tasks = []; for (let s = 1; s <= 12; s++) tasks.push(MAKE[s]());
    const back = []; // the mistakes to replay, newest first
    (Loopy.retry.list("class-test") || []).forEach(p => { if (back.length >= 12) return; let tk = null; try { tk = rebuild(p.r); } catch (e) { tk = null; } if (tk && !back.some(b => b.slot === tk.slot)) { back.push(tk); tasks[tk.slot - 1] = tk; } });
    if (fromCard && back.length) tasks = back.concat(tasks.filter(tk => !tk.again));
    set = []; tasks.forEach(tk => { tk.done = {}; tk.qs.forEach(q => { q.task = tk; set.push(q); }); });
    index = 0; streak = 0; results = []; points = 0;
    $("play").hidden = false;
    $("results").hidden = true;
    show();
  }
  function printTest() { Loopy.load("sheet").then(() => { Loopy.sheet.fill(); window.print(); }, () => {}); }

  digitBtns.forEach(b => b.addEventListener("click", () => press(b.dataset.d)));
  eraseBtn.addEventListener("click", erase);
  goBtn.addEventListener("click", go);
  nextBtn.addEventListener("click", () => { if (answered) go(); });
  $("again").addEventListener("click", start);
  $("restart").addEventListener("click", start);
  $("print-test").addEventListener("click", printTest);
  $("print-again").addEventListener("click", printTest);
  window.addEventListener("loopy:age", start);
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big") || index >= set.length) return;
    const q = set[index];
    if (e.key >= "0" && e.key <= "9") { if (q.mode === "pad") press(e.key); else if (e.key >= "1" && e.key <= "4" && choicesEl.children[+e.key - 1]) choose(choicesEl.children[+e.key - 1]); }
    else if (e.key === "Backspace") erase();
    else if (e.key === "Enter" && e.target.tagName !== "BUTTON") { go(); e.preventDefault(); }
  });

  // Read aloud: the task, what is on the card and the question.
  Loopy.speech.question({ host: card, text: () => { const q = set[index]; return q ? t("ctT" + q.task.slot) + ". " + (q.task.slot === 10 ? q.log() + " " : "") + q.ask() + " " + q.sub() : ""; } });

  // Print the test: the same 12 tasks, 4 across, with the points. Page 2 has the answers.
  Loopy.worksheet({
    quiet: true,
    title: () => t("ctName"), level: () => t("ctLevel"), how: () => t("ctHow"), layout: "clock",
    make: () => tasks.slice(),
    cell: (tk) => {
      const box = el("div", "ws-ct");
      const head = el("div", "nm", t("ctT" + tk.slot));
      const pts = tk.qs.reduce((s, q) => s + q.pts, 0);
      head.appendChild(el("span", "pts", " · " + (pts === 1 ? t("ctPts1") : t("ctPts", { n: num(pts) }))));
      box.appendChild(head);
      tk.sheet(box);
      return box;
    },
    answer: (tk) => tk.answers()
  });

  start();
})();
</script>
</body>
</html>
