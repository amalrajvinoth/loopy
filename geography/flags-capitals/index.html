<style>
/* Layout: a flag and a question, answer buttons below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

/* Vertical problem, written like the worksheets: operator on the left, digits right-aligned. */
.vert {
  display: grid; grid-template-columns: auto auto; column-gap: 0.35em;
  font-size: clamp(3.4rem, 15vw, 4.6rem); font-weight: 600; line-height: 1.12;
  font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
}
.vert .num { grid-column: 2; text-align: right; min-width: 3ch; }
.vert .op { grid-column: 1; grid-row: 2; color: var(--accent); }
.vert .rule { grid-column: 1 / -1; height: 0.07em; background: var(--ink); border-radius: 2px; margin: 0.1em 0 0.12em; }
.vert .ans {
  grid-column: 2; text-align: right; min-width: 3ch; min-height: 1.12em;
  color: var(--accent); position: relative;
}
.vert .ans.empty::after {
  content: ""; position: absolute; right: 0; bottom: 0.12em; width: 0.55em; height: 0.07em;
  background: var(--mark); border-radius: 2px; animation: blink 1s steps(2, start) infinite;
}
.problem-card.good .ans { color: var(--good); }
.problem-card.bad .ans { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.06em; }
@keyframes blink { to { visibility: hidden; } }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .erase { font-size: 1.15rem; color: var(--muted); }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .pad button { min-height: 64px; font-size: 1.8rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .vert .ans.empty::after { animation: none; }
}

@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }

@media (max-height: 760px) and (orientation: portrait) {

}

/* Portrait: the page is exactly one screen tall; the pad or answers stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

}

  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }

}

}
@media (max-height: 500px) {
  .feedback { font-size: 0.9rem; line-height: 1.3; }

}


/* Flags and Capitals: a flag, a question, and answer buttons to pick from. */
.flag { display: block; height: clamp(84px, 24dvh, 300px); width: auto; max-width: 100%; aspect-ratio: 3 / 2; flex: 0 1 auto; min-height: 0; }
.flag.square { aspect-ratio: 1; }
/* A thin edge, so white parts of a flag show on a white card. */
.flag .edge { fill: none; stroke: var(--muted); stroke-width: 0.25; }
.question { margin: 0; font-size: clamp(1.15rem, min(5.2vw, 3.4dvh), 1.9rem); font-weight: 700; line-height: 1.25;
  text-align: center; max-width: 30ch; text-wrap: balance; }
.region { margin: -4px 0 0; color: var(--muted); font-size: 0.95rem; font-weight: 600; }
.side { display: flex; flex-direction: column; gap: 10px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choices button {

  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: clamp(56px, 9dvh, 96px); padding: 6px 10px; cursor: pointer;
  overflow-wrap: anywhere; hyphens: auto;
  transition: transform .08s ease, border-color .15s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button:active:not(:disabled) { transform: scale(0.96); }
.choices button:disabled { cursor: default; }
.choices button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.faded { opacity: 0.45; }
.next { font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(52px, 7dvh, 72px); cursor: pointer; width: 100%; }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button { padding-inline: 4px; }
@media (min-width: 600px) and (orientation: portrait) {
  .choices button { min-height: clamp(64px, 10dvh, 120px); }
}
@media (orientation: landscape) and (min-width: 640px) {
  .problem-card { height: 100%; justify-content: center; }
  .side { height: 100%; justify-content: center; }
  .choices button { min-height: clamp(52px, 14dvh, 130px); }
  .flag { height: clamp(70px, 34dvh, 340px); }
}
/* After the answer the flag gets smaller, so the question and the fact have room. */
@media (max-height: 900px), (max-width: 599px) {

@media (max-height: 700px) {

@media (max-height: 500px) {
  .question { font-size: 1rem; }

}

/* Worksheet cells (only printed): a flag, the countries to circle, and a line for the capital. */

}

// GEN START
// Each flag: [code, region, level, English name, German name, English capital, German capital, drawing].
// Level 1 is the well-known flags for younger children, level 2 the rest.

// The drawing is on a 30 × 20 grid (20 × 20 after "w 20"). Steps are split by ";":
//   h / v colors...      equal stripes, across or down

    Loopy.nextButton(nextBtn, answered);
  }
  const question = () => step === "flag" ? t("fcWhich") : t("fcCapQ", { c: nameOf(current.f, lang) });
  const labels = () => step === "flag" ? current.options.map(nameOfCode) : current.caps.map(f => f[lang].cap);
  // Shows the flag step or the capital step of the current question.
  function showStep() {
    answered = false;
    qEl.textContent = question();
    regionEl.hidden = region !== "world";
    regionEl.textContent = t("fcIn" + current.f.region.charAt(0).toUpperCase() + current.f.region.slice(1));
    choicesEl.textContent = "";
    const want = step === "flag" ? current.f[lang].name : current.f[lang].cap;
    labels().forEach((a, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.id = "choice-" + i; b.textContent = a;
      b.dataset.correct = String(a === want);
      b.addEventListener("click", () => choose(b));
      choicesEl.appendChild(b);
    });
    card.classList.remove("good", "bad");
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    render();
    Loopy.speech.read();
  }
  function newRound() {
    current = Loopy.fresh(recent, () => makeProblem(region, age), 12);
    step = "flag";
    drawFlag(flagEl, current.f);
    showStep();
  }
  function choose(btn) {
    if (answered) return;
    answered = true; tried++;
    const ok = btn.dataset.correct === "true", f = current.f;
    [...choicesEl.children].forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === "true") b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    if (ok) { right++; streak++; } else { streak = 0; }
    const of = nameOf(f, lang);
    if (ok) Loopy.rewards.correct("flags-capitals", streak);
    else Loopy.rewards.wrong("flags-capitals", step === "flag"
      ? { q: t("fcLogFlag", { c: of }), a: f[lang].name, y: btn.textContent, k: "fc-flag" }
      : { q: t("fcLogCap", { c: of }), a: f[lang].cap, y: btn.textContent, k: "fc-cap" });
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    // One fact line: whose flag it is, or the capital. With capitals still to come, the capital waits for its own step.
    const capNext = step === "flag" && mode === "cap" && current.caps;
    const fact = step === "flag" && (capNext || !f.en.cap) ? t("fcFlagOf", { c: of }) : t("fcCapOf", { cap: f[lang].cap, c: of });
    feedbackEl.appendChild(document.createTextNode(fact));
    render();
    nextBtn.focus({ preventScroll: true });
  }
  // Next: the capital of the same flag when that comes next, otherwise a new flag.
  function next() {
    if (answered && step === "flag" && mode === "cap" && current.caps) {
      // The capital step is a question of its own, so it gets its own key on the page.
      step = "cap"; document.body.setAttribute("data-q", current.key + ".cap"); showStep(); return;
    }
    newRound();
  }

  nextBtn.addEventListener("click", next);
  regionBtns.forEach(b => b.addEventListener("click", () => { region = b.dataset.region; store.set("fc.region.a" + age, region); recent = []; newRound(); }));
  modeBtns.forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; store.set("fc.mode.a" + age, mode); newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("flags-capitals"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") { next(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !answered) { const b = choicesEl.children[n - 1]; if (b) choose(b); }
  });

  // Read aloud: "Which country has this flag? Is it France, Italy, Spain or Germany?"
  Loopy.speech.question({ host: card, text: () => {
    const o = labels();
    return t("fcReadQ", { q: question(), list: o.slice(0, -1).join(", ") + " " + t("orWord") + " " + o[o.length - 1] });
  } });

  // Print worksheet: 20 flags at the game's level and region, each with its countries to circle,
  // and a line for the capital in "Flags and capitals". Flags print in color.
  const part = (cls, text) => { const n = document.createElement("span"); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  Loopy.worksheet({
    title: () => t("fcName"),
    level: () => [t("ageLabel", { n: age }), t("fcRegion") + ": " + t(REGION_KEYS[region]), t(mode === "cap" ? "fcFlagsCaps" : "fcFlags")].join(" · "),
    how: () => t(mode === "cap" ? "fcHowCap" : "fcHow"),
    layout: "word",
    // No flag twice on one sheet, unless the region has fewer flags than the sheet.
    make: (n) => { const list = [], keys = [], keep = poolFor(region, age).length - 1; while (list.length < n) { const p = makeProblem(region, age, keys); keys.push(p.key); if (keys.length > keep) keys.shift(); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-fc";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "flag");
      svg.setAttribute("aria-hidden", "true");
      drawFlag(svg, p.f);
      box.appendChild(svg);
      const opts = part("ws-opts");
      p.options.forEach(o => opts.appendChild(part("", nameOfCode(o))));
      box.appendChild(opts);
      if (mode === "cap" && p.f.en.cap) { const cap = part("ws-cap", t("fcCapLine")); cap.appendChild(part("ws-gap")); box.appendChild(cap); }
      return box;
    },
    answer: (p) => nameOfCode(p.f) + (mode === "cap" && p.f.en.cap ? ": " + p.f[lang].cap : "")
  });

  newRound();
})();
</script>
</body>
</html>
