/* Layout: a flag and a question, answer buttons below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

/* Vertical problem, written like the worksheets: operator on the left, digits right-aligned. */
.vert {
  display: grid; grid-template-columns: auto auto; column-gap: 0.35em;
  font-size: clamp(3.4rem, 15vw, 4.6rem); font-weight: 600; line-height: 1.12;
  font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
}
.vert .num { grid-column: 2; text-align: right; min-width: 3ch; }
.vert .op { grid-column: 1; grid-row: 2; color: var(--accent); }
.vert .rule { grid-column: 1 / -1; height: 0.07em; background: var(--ink); border-radius: 2px; margin: 0.1em 0 0.12em; }
.vert .ans {
  grid-column: 2; text-align: right; min-width: 3ch; min-height: 1.12em;
  color: var(--accent); position: relative;
}
.vert .ans.empty::after {
  content: ""; position: absolute; right: 0; bottom: 0.12em; width: 0.55em; height: 0.07em;
  background: var(--mark); border-radius: 2px; animation: blink 1s steps(2, start) infinite;
}
.problem-card.good .ans { color: var(--good); }
.problem-card.bad .ans { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.06em; }
@keyframes blink { to { visibility: hidden; } }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;

.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }

.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .pad button { min-height: 64px; font-size: 1.8rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .vert .ans.empty::after { animation: none; }
}

.seg.five { grid-template-columns: repeat(5, 1fr); }

<script>
Loopy.addStrings({
  en: {
    fcName: "Flags and Capitals", fcRegion: "Region", fcEu: "Europe", fcAm: "Americas", fcAs: "Asia", fcAf: "Africa", fcWorld: "World",
    fcAsk: "Ask", fcFlags: "Flags only",
    fcLv1: "Flags of Europe", fcLv2: "Europe with capitals", fcLv3: "Flags of the world", fcLv4: "World with capitals", fcFlagsCaps: "Flags and capitals", fcFlagAria: "A flag",
    fcKbd: "Keyboard works too: 1 to 4 picks an answer, Enter goes on.",
    fcWhich: "Which country has this flag?", fcCapQ: "What is the capital of {c}?",
    fcInEu: "In Europe", fcInAm: "In the Americas", fcInAs: "In Asia", fcInAf: "In Africa", fcInOc: "In Oceania",
    fcFlagOf: "This is the flag of {c}.", fcCapOf: "{cap} is the capital of {c}.",
    fcLogFlag: "Flag of {c}", fcLogCap: "Capital of {c}",
    fcReadQ: "{q} Is it {list}?",
    fcHow: "Circle the country for each flag.", fcHowCap: "Circle the country for each flag, then write its capital.", fcCapLine: "Capital:"
  },
  de: {
    fcName: "Flaggen und Hauptstädte", fcRegion: "Region", fcEu: "Europa", fcAm: "Amerika", fcAs: "Asien", fcAf: "Afrika", fcWorld: "Welt",
    fcAsk: "Abfragen", fcFlags: "Nur Flaggen",
    fcLv1: "Flaggen Europas", fcLv2: "Europa mit Hauptstädten", fcLv3: "Flaggen der Welt", fcLv4: "Welt mit Hauptstädten", fcFlagsCaps: "Flaggen und Hauptstädte", fcFlagAria: "Eine Flagge",
    fcKbd: "Die Tastatur geht auch: 1 bis 4 wählt eine Antwort, Enter geht weiter.",
    fcWhich: "Welches Land hat diese Flagge?", fcCapQ: "Was ist die Hauptstadt {c}?",
    fcInEu: "In Europa", fcInAm: "In Amerika", fcInAs: "In Asien", fcInAf: "In Afrika", fcInOc: "In Ozeanien",
    fcFlagOf: "Das ist die Flagge {c}.", fcCapOf: "{cap} ist die Hauptstadt {c}.",
    fcLogFlag: "Flagge {c}", fcLogCap: "Hauptstadt {c}",
    fcReadQ: "{q} Ist es {list}?",
    fcHow: "Kreise bei jeder Flagge das Land ein.", fcHowCap: "Kreise bei jeder Flagge das Land ein und schreibe die Hauptstadt dazu.", fcCapLine: "Hauptstadt:"
  }
});

const REGIONS = ["eu", "am", "as", "af", "world"];
const byCode = {};
FLAGS.forEach(f => { byCode[f.code] = f; });
// English names that need "the" in a sentence, and German names in a sentence ("die Flagge der Schweiz").
const EN_THE = ["GBR", "NLD", "USA", "PHL", "ARE"];
const DE_OF = { CHE: "der Schweiz", NLD: "der Niederlande", GBR: "des Vereinigten Königreichs", USA: "der Vereinigten Staaten",
  TUR: "der Türkei", UKR: "der Ukraine", PHL: "der Philippinen", ARE: "der Vereinigten Arabischen Emirate" };
// "of France" / "von Frankreich", for "the capital of ..." and "the flag of ...".
function nameOf(f, lang) {
  if (lang === "de") return DE_OF[f.code] || "von " + f.de.name;
  return (EN_THE.includes(f.code) ? "the " : "") + f.en.name;
}

const randInt = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randInt(arr.length)];
const shuffle = (arr) => arr.slice().sort(() => Math.random() - 0.5);
// Younger children get the well-known flags only: up to age 8 in Europe, up to age 10 in the rest of the world.
// A region with fewer than 8 well-known flags (Asia, Africa, the Americas) shows all its flags, so they do not keep coming back.
const levelFor = (region, age) => age > (region === "eu" ? 8 : 10) ? 2
  : FLAGS.filter(f => (region === "world" || f.region === region) && f.level === 1).length < 8 ? 2 : 1;
function poolFor(region, age) {
  const lv = levelFor(region, age);
  return FLAGS.filter(f => (region === "world" || f.region === region) && f.level <= lv);
}
// Flags that are easy to mix up are never offered as each other's wrong answer.
const LOOKALIKE = { NLD: "LUX", LUX: "NLD" };
// Three wrong answers: from the same part of the world first, so the choice is a real one.
function others(f, region, age, need) {
  const ok = (o) => o !== f && o.code !== LOOKALIKE[f.code] && (!need || o.en.cap);
  const pool = poolFor(region, age).filter(ok);
  const near = shuffle(pool.filter(o => o.region === f.region));
  const far = shuffle(pool.filter(o => o.region !== f.region));
  const wider = shuffle(FLAGS.filter(o => ok(o) && o.region === f.region && !pool.includes(o)));
  return near.concat(region === "world" ? far.concat(wider) : wider.concat(far)).slice(0, 3);
}
// One question: a flag, its four countries, and (when there is a capital) four capitals for the second step.
function makeProblem(region, age, avoid) {
  const list = poolFor(region, age);
  let f = pick(list);
  for (let tries = 0; tries < 40 && avoid && avoid.includes(f.code); tries++) f = pick(list);
  return { f, key: f.code, options: shuffle([f, ...others(f, region, age)]), caps: f.en.cap ? shuffle([f, ...others(f, region, age, true)]) : null };
}

// Draws a flag from its steps into an <svg>. Only shapes and colors: no text, no pictures from outside.
const NS = "http://www.w3.org/2000/svg";
const color = (c) => PAL[c] || c;
function shape(parent, tag, attrs) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
}
function starPoints(x, y, r, turn, points, inner) {
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const a = (turn - 90) * Math.PI / 180 + i * Math.PI / points, d = i % 2 ? r * inner : r;
    pts.push((x + d * Math.cos(a)).toFixed(2) + "," + (y + d * Math.sin(a)).toFixed(2));
  }
  return pts.join(" ");
}
function drawSteps(svg, steps, w) {
  steps.split(";").forEach(step => {
    const a = step.trim().split(/\s+/), op = a[0], n = a.slice(1, -1).map(Number), last = a[a.length - 1];
    if (op === "h" || op === "v") {
      const cols = a.slice(1), size = (op === "h" ? 20 : w) / cols.length;
      cols.forEach((c, i) => shape(svg, "rect", op === "h"
        ? { x: 0, y: i * size, width: w, height: size + 0.02, fill: color(c) }
        : { x: i * size, y: 0, width: size + 0.02, height: 20, fill: color(c) }));
    } else if (op === "r") shape(svg, "rect", { x: n[0], y: n[1], width: n[2], height: n[3], fill: color(last) });
    else if (op === "c") shape(svg, "circle", { cx: n[0], cy: n[1], r: n[2], fill: color(last) });
    else if (op === "e") shape(svg, "ellipse", { cx: n[0], cy: n[1], rx: n[2], ry: n[3], fill: color(last) });
    else if (op === "o") shape(svg, "circle", { cx: a[1], cy: a[2], r: a[3], fill: "none", stroke: color(a[4]), "stroke-width": a[5] });
    else if (op === "l") shape(svg, "line", { x1: a[1], y1: a[2], x2: a[3], y2: a[4], stroke: color(a[5]), "stroke-width": a[6] });
    else if (op === "p") shape(svg, "polygon", { points: a.slice(1, -1).join(" "), fill: color(last) });
    else if (op === "s") shape(svg, "polygon", { points: starPoints(+a[1], +a[2], +a[3], +(a[5] || 0), +(a[6] || 5), +(a[7] || 0.382)), fill: color(a[4]) });
    else if (op === "S") {
      const p = starPoints(+a[1], +a[2], +a[3], 0, 5, 1).split(" ").filter((_, i) => i % 2 === 0);
      shape(svg, "polygon", { points: [p[0], p[2], p[4], p[1], p[3]].join(" "), fill: "none", stroke: color(a[4]), "stroke-width": a[5], "stroke-linejoin": "miter" });
    } else if (op === "g") {
      for (let i = 0; i < n[4]; i++) for (let j = 0; j < n[5]; j++) shape(svg, "circle", { cx: n[0] + i * n[2], cy: n[1] + j * n[3], r: n[6], fill: color(last) });
    } else if (op === "u") {
      const box = shape(svg, "svg", { x: a[1], y: a[2], width: a[3], height: a[4], viewBox: "0 0 30 20", preserveAspectRatio: "none" });
      drawSteps(box, UNION, 30);
    }
  });
}
function drawFlag(svg, f) {
  svg.textContent = "";
  const steps = f.draw.split(";"), w = /^w \d+$/.test(steps[0]) ? +steps.shift().slice(2) : 30;
  svg.setAttribute("viewBox", "0 0 " + w + " 20");
  svg.classList.toggle("square", w === 20);
  drawSteps(svg, steps.join(";"), w);
  shape(svg, "rect", { class: "edge", x: 0.12, y: 0.12, width: w - 0.24, height: 19.76 });
}

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), flagEl = $("flag"), qEl = $("question"), regionEl = $("region"), choicesEl = $("choices"), feedbackEl = $("feedback"), nextBtn = $("next");
  const regionBtns = [...document.querySelectorAll("#region-seg button")];
  const modeBtns = [...document.querySelectorAll("#mode-seg button")];
  const t = Loopy.t, lang = Loopy.lang === "de" ? "de" : "en";
  const REGION_KEYS = { eu: "fcEu", am: "fcAm", as: "fcAs", af: "fcAf", world: "fcWorld" };
  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = Loopy.getAge();
  let region, mode;
  // Settings are remembered per age, so each age starts at the right level:
  // Europe up to age 10, then the world; capitals too from age 13.
  function loadForAge() {
    region = store.get("fc.region.a" + age, age <= 10 ? "eu" : "world", REGIONS);
    mode = store.get("fc.mode.a" + age, age >= 13 ? "cap" : "flag", ["flag", "cap"]);
    // Opened from the grown-ups' page to practise flags or capitals: set it for this visit, without saving.
    const m = /^fc-(flag|cap)$/.exec(Loopy.log.hint || "");
    if (m) { mode = m[1]; Loopy.log.hint = ""; }
  }
  loadForAge();
  // The ladder: flags of Europe, with capitals, flags of the world, with capitals.
  const LADDER = [["eu", "flag"], ["eu", "cap"], ["world", "flag"], ["world", "cap"]];
  Loopy.levels.init({ names: ["fcLv1", "fcLv2", "fcLv3", "fcLv4"],
    get: () => (region === "world" ? 2 : 0) + (mode === "cap" ? 1 : 0), base: () => (age <= 10 ? 0 : 2) + (age >= 13 ? 1 : 0),
    set: (i) => { [region, mode] = LADDER[i]; store.set("fc.region.a" + age, region); store.set("fc.mode.a" + age, mode); recent = []; newRound(); } });
  let right = 0, tried = 0, streak = 0;
  let current = null, step = "flag", answered = false, recent = [];

  const nameOfCode = (f) => f[lang].name;
  function render() {
    Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    regionBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.region === region)));
    modeBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
    Loopy.nextButton(nextBtn, answered);
  }
  const question = () => step === "flag" ? t("fcWhich") : t("fcCapQ", { c: nameOf(current.f, lang) });
  const labels = () => step === "flag" ? current.options.map(nameOfCode) : current.caps.map(f => f[lang].cap);
  // Shows the flag step or the capital step of the current question.
  function showStep() {
    answered = false;
    qEl.textContent = question();
    regionEl.hidden = region !== "world";
    regionEl.textContent = t("fcIn" + current.f.region.charAt(0).toUpperCase() + current.f.region.slice(1));
    choicesEl.textContent = "";
    const want = step === "flag" ? current.f[lang].name : current.f[lang].cap;
    labels().forEach((a, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.id = "choice-" + i; b.textContent = a;
      b.dataset.correct = String(a === want);
      b.addEventListener("click", () => choose(b));
      choicesEl.appendChild(b);
    });
    card.classList.remove("good", "bad");
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    render();
    Loopy.speech.read();
  }
  // Try again: a missed flag or capital comes back later (Loopy.retry). The note is "FRA" for the flag step and
  // "FRA:cap" for the capital step; a flag not in the region set now, or a capital while only flags are asked, waits.
  // The choices are mixed the way makeProblem does it. A capital comes back at its capital step.
  const note = (p) => p.f.code + (step === "cap" ? ":cap" : "");
  function rebuild(r) {
    const m = /^([A-Z]{3})(:cap)?$/.exec(r), f = m && byCode[m[1]];
    if (!f || !poolFor(region, age).includes(f) || (m[2] && (mode !== "cap" || !f.en.cap))) return null;
    const q = { f, key: f.code, options: shuffle([f, ...others(f, region, age)]), caps: f.en.cap ? shuffle([f, ...others(f, region, age, true)]) : null };
    if (m[2]) q.step = "cap";
    return q;
  }

  function newRound() {
    current = Loopy.retry.fresh("flags-capitals", recent, () => makeProblem(region, age), rebuild, 12);
    step = current.step === "cap" ? "cap" : "flag";
    if (step === "cap") document.body.setAttribute("data-q", current.key + ".cap");
    drawFlag(flagEl, current.f);
    showStep();
  }
  function choose(btn) {
    if (answered) return;
    answered = true; tried++;
    const ok = btn.dataset.correct === "true", f = current.f;
    [...choicesEl.children].forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === "true") b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    if (ok) { right++; streak++; } else { streak = 0; }
    const of = nameOf(f, lang);
    if (ok) Loopy.rewards.correct("flags-capitals", streak, step === "flag" ? "fc-flag" : "fc-cap");
    else Loopy.rewards.wrong("flags-capitals", step === "flag"
      ? { q: t("fcLogFlag", { c: of }), a: f[lang].name, y: btn.textContent, k: "fc-flag", r: note(current) }
      : { q: t("fcLogCap", { c: of }), a: f[lang].cap, y: btn.textContent, k: "fc-cap", r: note(current) });
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    // One fact line: whose flag it is, or the capital. With capitals still to come, the capital waits for its own step.
    const capNext = step === "flag" && mode === "cap" && current.caps;
    const fact = step === "flag" && (capNext || !f.en.cap) ? t("fcFlagOf", { c: of }) : t("fcCapOf", { cap: f[lang].cap, c: of });
    feedbackEl.appendChild(document.createTextNode(fact));
    render();
    nextBtn.focus({ preventScroll: true });
  }
  // Next: the capital of the same flag when that comes next, otherwise a new flag.
  function next() {
    if (answered && step === "flag" && mode === "cap" && current.caps) {
      // The capital step is a question of its own, so it gets its own key on the page.
      step = "cap"; document.body.setAttribute("data-q", current.key + ".cap"); showStep(); return;
    }
    newRound();
  }

  nextBtn.addEventListener("click", next);
  regionBtns.forEach(b => b.addEventListener("click", () => { region = b.dataset.region; store.set("fc.region.a" + age, region); recent = []; newRound(); }));
  modeBtns.forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; store.set("fc.mode.a" + age, mode); newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("flags-capitals"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") { next(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !answered) { const b = choicesEl.children[n - 1]; if (b) choose(b); }
  });

  // Read aloud: "Which country has this flag? Is it France, Italy, Spain or Germany?"
  Loopy.speech.question({ host: card, text: () => {
    const o = labels();
    return t("fcReadQ", { q: question(), list: o.slice(0, -1).join(", ") + " " + t("orWord") + " " + o[o.length - 1] });
  } });

  // Print worksheet: 20 flags at the game's level and region, each with its countries to circle,
  // and a line for the capital in "Flags and capitals". Flags print in color.
  const part = (cls, text) => { const n = document.createElement("span"); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  Loopy.worksheet({
    title: () => t("fcName"),
    level: () => [t("ageLabel", { n: age }), t("fcRegion") + ": " + t(REGION_KEYS[region]), t(mode === "cap" ? "fcFlagsCaps" : "fcFlags")].join(" · "),
    how: () => t(mode === "cap" ? "fcHowCap" : "fcHow"),
    layout: "word",
    // No flag twice on one sheet, unless the region has fewer flags than the sheet.
    make: (n) => { const list = [], keys = [], keep = poolFor(region, age).length - 1; while (list.length < n) { const p = makeProblem(region, age, keys); keys.push(p.key); if (keys.length > keep) keys.shift(); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-fc";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "flag");
      svg.setAttribute("aria-hidden", "true");
      drawFlag(svg, p.f);
      box.appendChild(svg);
      const opts = part("ws-opts");
      p.options.forEach(o => opts.appendChild(part("", nameOfCode(o))));
      box.appendChild(opts);
      if (mode === "cap" && p.f.en.cap) { const cap = part("ws-cap", t("fcCapLine")); cap.appendChild(part("ws-gap")); box.appendChild(cap); }
      return box;
    },
    answer: (p) => nameOfCode(p.f) + (mode === "cap" && p.f.en.cap ? ": " + p.f[lang].cap : "")
  });

  newRound();
})();
</script>
