<style>
/* Layout: a question on top, a big map to tap, the answer and a Next button below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 4px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
.seg button:disabled { opacity: 0.4; cursor: default; }

.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }
.home-link { display: inline-flex; align-items: center; min-height: 40px; color: var(--muted); font-weight: 600; text-decoration: none; font-size: 0.95rem; }

/* The play area: question, map, answer, Next. */
.play { display: flex; flex-direction: column; gap: 10px; -webkit-user-select: none; user-select: none; }
.ask { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.prompt { margin: 0; font-size: clamp(1.15rem, min(5.2vw, 3.4dvh), 1.6rem); font-weight: 700; line-height: 1.25; text-wrap: balance; }
.prompt .read-btn.inline { vertical-align: middle; margin-left: 6px; }
.region { display: inline-block; background: var(--chip); color: var(--muted); border-radius: 999px; padding: 3px 12px; font-size: 0.9rem; font-weight: 600; }
.map-card {
  position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden;
  min-height: 160px;
}
.map-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.map-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

/* Map colors: solid mixes of the theme colors, made in the script (see paint()), so shapes never show through each other.
   Sea: a light wash of the main accent. Land: a wash of the text color. Continents: an accent each, never green, red or yellow. */
#map .sea-bg, #map .sea { fill: var(--wi-sea, var(--chip)); stroke: none; }
#map .land { fill: var(--wi-land, var(--line)); stroke: var(--card); stroke-width: 1; stroke-linejoin: round; cursor: pointer; }
#map .land.pool { fill: var(--wi-pool, var(--muted)); }
#map .land:focus, #map .sea:focus { outline: none; }
#map .land:focus-visible, #map .sea:focus-visible { stroke: var(--c2, var(--mark)); stroke-width: 3; }
#map.cont .land { stroke: none; }
#map.cont .land.kfocus, #map.cont .land:focus-visible { stroke: var(--c2, var(--mark)); stroke-width: 3; }
#map.cont .land[data-k="eu"], #map.cont .land[data-k="sa"] { fill: var(--wi-c1, var(--accent)); }
#map.cont .land[data-k="as"] { fill: var(--wi-c4, var(--accent)); }
#map.cont .land[data-k="af"], #map.cont .land[data-k="na"], #map.cont .land[data-k="oc"] { fill: var(--wi-c2, var(--mark)); }
#map.cont .land[data-k="an"] { fill: var(--wi-muted, var(--muted)); }
#map:not(.cont) .sea { display: none; }
#map.cont .sea { cursor: pointer; }
#map .land.right, #map.cont .land.right { fill: var(--good); }
#map .land.wrong, #map.cont .land.wrong { fill: var(--bad); }
#map .sea.right { fill: var(--wi-sea-good, var(--good-bg)); }
#map .sea.wrong { fill: var(--wi-sea-bad, var(--bad-bg)); }
#map .lbl { fill: var(--ink); stroke: var(--card); paint-order: stroke; stroke-linejoin: round; font-family: var(--font); font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#map .cap-dot { fill: var(--ink); stroke: var(--card); pointer-events: none; }

.feedback { margin: 0; min-height: 2.9em; text-align: center; font-size: 1.05rem; line-height: 1.4; }
.feedback strong { display: block; font-size: 1.3rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }
.next { font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(52px, 7dvh, 72px); cursor: pointer; width: 100%; touch-action: manipulation; }
.side { display: flex; flex-direction: column; gap: 10px; }

@media (max-width: 420px) {

}
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }

/* Portrait: the page is exactly one screen tall; the map takes the room that is left.
   With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
  .map-card { flex: 1 1 auto; }
  .side { display: contents; }
  .ask { order: 0; } .map-card { order: 1; } .feedback { order: 2; } .next { order: 3; }
}
/* Landscape: the map on the left, the question and answer on the right. */
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: minmax(0, 1fr); gap: 16px; }
  .map-card { grid-column: 1; grid-row: 1; min-height: 0; }
  .side { grid-column: 2; grid-row: 1; justify-content: center; min-height: 0; }
  .feedback { overflow-y: auto; }
}
/* Short screens: smaller words, so the map keeps its room. */
@media (max-height: 700px) {
  .prompt { font-size: 1.1rem; }
  .feedback { font-size: 0.95rem; line-height: 1.3; }
  .feedback strong { font-size: 1.1rem; }
  .region { font-size: 0.8rem; padding: 2px 10px; }
}
@media (max-height: 500px) {
  .top h1 { font-size: 1.2rem; }
  .feedback { font-size: 0.9rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
/* Print worksheet: the country name on its own lines, so long names fit. */
@media print {
  .sheet-line li > div.ws-sl { flex-direction: row; align-items: flex-end; gap: 2mm; }
  .sheet-line .ws-geo { font-size: 15pt; white-space: normal; line-height: 1.2; max-width: 46mm; }
  .sheet-line .ws-blank { flex: 1 1 auto; max-width: 34mm; align-self: flex-end; margin-bottom: 4mm; }
}

<script>

  },
  de: {

    wiFind: "Finde", wiCountries: "Länder",
    wiLv1: "Kontinente und Ozeane", wiLv2: "Länder Europas", wiLv3: "Hauptstädte Europas", wiLv4: "Länder der Welt", wiLv5: "Hauptstädte der Welt", wiCapitals: "Hauptstädte",

    wiTap: "Tippe es auf der Karte an.", wiIn: "In {r}",
    wiThis: "Das ist {p}.", wiCapIs: "Hauptstadt: {c}.", wiWas: "Das war {y}.",
    wiGreen: "Grün markiert: {p}.", wiGreenCap: "Grün markiert: {p} mit der Hauptstadt {c}.",
    wiHowMap: "Schreibe den Namen des grauen Gebiets unter jede Karte.", wiHowCap: "Schreibe die Hauptstadt jedes Landes auf."
  }
});

// Continents and oceans: [English, English in a sentence, German, German in a sentence, label longitude, latitude].
const AREAS = {
  af: ["Africa", "Africa", "Afrika", "Afrika", 20, 8],
  as: ["Asia", "Asia", "Asien", "Asien", 95, 48],
  eu: ["Europe", "Europe", "Europa", "Europa", 18, 52],
  na: ["North America", "North America", "Nordamerika", "Nordamerika", -100, 45],
  sa: ["South America", "South America", "Südamerika", "Südamerika", -60, -12],
  oc: ["Australia and Oceania", "Australia and Oceania", "Australien und Ozeanien", "Australien und Ozeanien", 134, -25],
  an: ["Antarctica", "Antarctica", "Antarktis", "die Antarktis", 0, -75],
  pacific: ["Pacific Ocean", "the Pacific Ocean", "Pazifik", "der Pazifik", -140, 0],
  atlantic: ["Atlantic Ocean", "the Atlantic Ocean", "Atlantik", "der Atlantik", -35, 25],
  indian: ["Indian Ocean", "the Indian Ocean", "Indischer Ozean", "der Indische Ozean", 75, -22],
  arctic: ["Arctic Ocean", "the Arctic Ocean", "Nordpolarmeer", "das Nordpolarmeer", -30, 75],
  southern: ["Southern Ocean", "the Southern Ocean", "Südpolarmeer", "das Südpolarmeer", 60, -63]
};
const CONTINENTS = ["af", "as", "eu", "na", "sa", "oc", "an"], OCEANS = ["pacific", "atlantic", "indian", "arctic", "southern"];
// Names that need "the" in an English sentence, and German names with their article (* = plural).
const EN_THE = ["USA", "GBR", "NLD", "PHL", "BHS", "DOM", "CAF", "SLB", "ARE"];
const DE_SAY = {
  CHE: "die Schweiz", TUR: "die Türkei", UKR: "die Ukraine", SVK: "die Slowakei", MNG: "die Mongolei", NLD: "die Niederlande*",
  USA: "die Vereinigten Staaten*", ARE: "die Vereinigten Arabischen Emirate*", PHL: "die Philippinen*", SLB: "die Salomonen*", BHS: "die Bahamas*",
  GBR: "das Vereinigte Königreich", CAF: "die Zentralafrikanische Republik", DOM: "die Dominikanische Republik", CIV: "die Elfenbeinküste",
  COD: "die DR Kongo", COG: "der Kongo", IRN: "der Iran", IRQ: "der Irak", YEM: "der Jemen", LBN: "der Libanon", SDN: "der Sudan",
  SDS: "der Südsudan", TCD: "der Tschad", NER: "der Niger"
};
// Map views as [west, north, east, south] in degrees. World mode moves between the regions.
const VIEWS = {
  world: [-180, 79, 180, -68], eu: [-24, 71, 45, 34], af: [-19, 38, 53, -36], wa: [25, 55, 88, 11], ea: [66, 54, 146, -11],
  na: [-168, 72, -52, 14], ca: [-118, 33, -59, 6], sa: [-82, 13, -34, -56], oc: [112, 0, 180, -48]
};
const REGION = { eu: "eu", af: "af", wa: "as", ea: "as", na: "na", ca: "na", sa: "sa", oc: "oc" };

const px = (lon) => (lon + 180) * MAP_K;
const py = (lat) => MAP_Y0 - MAP_K * 180 / Math.PI * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
const randInt = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randInt(arr.length)];
const shuffle = (arr) => arr.slice().sort(() => Math.random() - 0.5);
const byCode = {};
PLACES.forEach(p => { byCode[p[0]] = p; });

// The box [x1, y1, x2, y2] around a path made of "M x y l dx dy ... z" parts.
function boxOf(d) {
  const b = [Infinity, Infinity, -Infinity, -Infinity];
  d.split("M").forEach(part => {
    if (!part) return;
    const n = part.replace(/[lz]/g, " ").replace(/-/g, " -").trim().split(/\s+/).map(Number);
    let x = n[0], y = n[1];
    for (let i = 0; i < n.length; i += 2) {
      if (i) { x += n[i]; y += n[i + 1]; }
      b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y);
    }
  });
  return b;
}
const BOX = {};
Object.keys(LAND).forEach(k => { BOX[k] = boxOf(LAND[k][2]); });
// The view box of a map view, in map units.
function viewBox(v) { const b = VIEWS[v]; return [px(b[0]), py(b[1]), px(b[2]), py(b[3])]; }
const meets = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];

// A place's name: plain (for labels) or in a sentence ("the Netherlands", "die Schweiz").
function placeName(p, lang, sentence) {
  if (lang === "de") {
    const s = sentence && DE_SAY[p[0]];
    return s ? s.replace("*", "") : p[2];
  }
  return (sentence && EN_THE.includes(p[0]) ? "the " : "") + p[1];
}
function areaName(id, lang, sentence) { const a = AREAS[id]; return lang === "de" ? a[sentence ? 3 : 2] : a[sentence ? 1 : 0]; }

// The questions for a map and a mode. Younger children get the well-known countries only.
function poolFor(map, find, age) {
  if (map === "cont") return CONTINENTS.concat(OCEANS).map(id => ({ type: CONTINENTS.includes(id) ? "cont" : "sea", id, view: "world" }));
  const known = map === "eu" ? age <= 9 : age <= 12;
  return PLACES.filter(p => (map === "world" || p[9] === "eu") && (!known || p[10] === 1) && (find !== "cap" || p[3]))
    .map(p => ({ type: "land", id: p[0], place: p, cap: find === "cap", view: p[9] }));
}
function makeProblem(map, find, age, avoid) {
  const list = poolFor(map, find, age);
  let q = pick(list);
  for (let tries = 0; tries < 40 && avoid && avoid.includes(q.id); tries++) q = pick(list);
  return q;
}

(function () {
  const $ = (id) => document.getElementById(id);
  const svg = $("map"), card = $("card"), askEl = $("ask"), regionEl = $("region"), feedbackEl = $("feedback"), nextBtn = $("next");
  const mapBtns = [...document.querySelectorAll("#map-seg button")];
  const findBtns = [...document.querySelectorAll("#find-seg button")];
  const t = Loopy.t;
  const NS = "http://www.w3.org/2000/svg";
  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = Loopy.getAge();
  let map, find;
  // The map and mode are remembered per age, so each age starts at the right level.
  const mapForAge = (a) => a <= 8 ? "cont" : a <= 11 ? "eu" : "world";
  const findForAge = (a) => a === 11 || a >= 13 ? "cap" : "land";
  function loadForAge() {
    map = store.get("wi.map.a" + age, mapForAge(age), ["cont", "eu", "world"]);
    find = store.get("wi.find.a" + age, findForAge(age), ["land", "cap"]);
    // Opened from the grown-ups' page to practise one map: set it for this visit, without saving.
    const m = /^wi-(cont|eu|euc|wd|wdc)$/.exec(Loopy.log.hint || "");
    if (m) { map = m[1] === "cont" ? "cont" : m[1][0] === "e" ? "eu" : "world"; find = m[1].endsWith("c") && m[1] !== "cont" ? "cap" : "land"; Loopy.log.hint = ""; }
  }
  loadForAge();
  // The ladder: continents, countries of Europe, its capitals, countries of the world, its capitals.
  const LADDER = [["cont", "land"], ["eu", "land"], ["eu", "cap"], ["world", "land"], ["world", "cap"]];
  const rung = (m, f) => LADDER.findIndex(r => r[0] === m && (m === "cont" || r[1] === f));
  Loopy.levels.init({ names: ["wiLv1", "wiLv2", "wiLv3", "wiLv4", "wiLv5"],
    get: () => rung(map, find), base: () => rung(mapForAge(age), findForAge(age)),
    set: (i) => { [map, find] = LADDER[i]; store.set("wi.map.a" + age, map); store.set("wi.find.a" + age, find); recent = []; newRound(); } });
  let right = 0, tried = 0, streak = 0;
  let current = null, answered = false, recent = [], marks = [], upp = 1;

  // Build the map once: a sea, the oceans, then every country. Tap targets are the shapes themselves.
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  };
  el("rect", { class: "sea-bg", x: -3000, y: -3000, width: 9000, height: 9000 }, svg);
  const seaPaths = {}, landPaths = {};
  Object.keys(SEA).forEach(id => { seaPaths[id] = el("path", { class: "sea", d: SEA[id], "data-o": id }, svg); });
  Object.keys(LAND).forEach(k => {
    const [code, cont, d] = LAND[k];
    const p = el("path", { class: "land", d, "data-c": code, "data-k": cont, "vector-effect": "non-scaling-stroke" }, svg);
    (landPaths[code] = landPaths[code] || []).push(p);
  });
  const markLayer = el("g", { "aria-hidden": "true" }, svg);

  // Fit the view to the map box, keeping its shape: the box grows to match the screen, never cuts the view.
  let view = "world";
  function fit() {
    const r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const b = viewBox(view), pad = 0.04;
    let w = (b[2] - b[0]) * (1 + pad * 2), h = (b[3] - b[1]) * (1 + pad * 2);
    const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2;
    if (w / h > r.width / r.height) h = w * r.height / r.width; else w = h * r.width / r.height;
    svg.setAttribute("viewBox", [cx - w / 2, cy - h / 2, w, h].map(n => n.toFixed(1)).join(" "));
    upp = w / r.width;
    drawMarks();
  }
  // Names and capital dots after an answer. Sizes are in screen pixels, so they read well on every view.
  function drawMarks() {
    markLayer.textContent = "";
    const vb = svg.viewBox.baseVal, placed = [];
    marks.forEach(m => {
      let x = px(m.lon), y = py(m.lat);
      if (m.dot) el("circle", { class: "cap-dot", cx: x, cy: y, r: 5 * upp, "stroke-width": 2 * upp }, markLayer);
      const size = 15 * upp, half = (m.text.length * size * 0.32);
      if (m.dot) y -= 16 * upp;
      // A country name right on top of its capital's dot moves just below it.
      if (m.below) { const d = marks.find(o => o.dot); if (d && Math.hypot(px(d.lon) - x, py(d.lat) - y) < 30 * upp) { x = px(d.lon); y = py(d.lat) + 18 * upp; } }
      // Keep the name inside the map.
      x = Math.min(Math.max(x, vb.x + half + 6 * upp), vb.x + vb.width - half - 6 * upp);
      y = Math.min(Math.max(y, vb.y + size), vb.y + vb.height - size);
      // Move down a name that would sit on top of one already drawn.
      for (const o of placed) if (Math.abs(o.x - x) < o.half + half && Math.abs(o.y - y) < size * 1.1) y = o.y + size * 1.2;
      placed.push({ x, y, half });
      const txt = el("text", { class: "lbl", x, y, "font-size": size, "stroke-width": 4 * upp }, markLayer);
      txt.textContent = m.text;
    });
  }
  if ("ResizeObserver" in window) new ResizeObserver(fit).observe(svg);

  // Solid map colors for the current theme: each is a theme color mixed into the sea color.
  const probe = document.createElement("i");
  probe.hidden = true;
  document.body.appendChild(probe);
  function rgb(name) {
    probe.style.color = "";
    probe.style.color = getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#888";
    return (getComputedStyle(probe).color.match(/[\d.]+/g) || [136, 136, 136]).slice(0, 3).map(Number);
  }
  const mix = (a, b, w) => "rgb(" + a.map((v, i) => Math.round(v * w + b[i] * (1 - w))).join(",") + ")";
  function paint() {
    const card = rgb("--card"), sea = rgb("--c1").map((v, i) => v * 0.16 + card[i] * 0.84);
    const set = (k, v) => svg.style.setProperty(k, v);
    set("--wi-sea", mix(sea, sea, 1));
    set("--wi-land", mix(rgb("--ink"), sea, 0.2));
    set("--wi-pool", mix(rgb("--ink"), sea, 0.4));
    ["c1", "c2", "c4"].forEach(c => set("--wi-" + c, mix(rgb("--" + c), sea, 0.6)));
    set("--wi-muted", mix(rgb("--muted"), sea, 0.6));
    set("--wi-sea-good", mix(rgb("--good"), sea, 0.35));
    set("--wi-sea-bad", mix(rgb("--bad"), sea, 0.35));
  }
  paint();
  // The theme can change from Settings while playing.
  new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  window.addEventListener("resize", fit);

  function askText() {
    if (!current) return "";
    const lang = Loopy.lang;
    if (current.type !== "land") return t("wiWhere", { p: areaName(current.id, lang, true) });
    if (current.cap) return t("wiCapAsk", { c: current.place[lang === "de" ? 4 : 3] });
    const plural = lang === "de" && /\*$/.test(DE_SAY[current.id] || "");
    return t(plural ? "wiWherePl" : "wiWhere", { p: placeName(current.place, lang, true) });
  }
  const kind = () => map === "cont" ? "wi-cont" : (map === "eu" ? "wi-eu" : "wi-wd") + (find === "cap" ? "c" : "");
  const cap1 = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function render() {
    Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    mapBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.map === map)));
    findBtns.forEach(b => { b.setAttribute("aria-pressed", String(map !== "cont" && b.dataset.find === find)); b.disabled = map === "cont"; });
    Loopy.nextButton(nextBtn, answered);
  }
  // Which shapes can be tapped (and reached with Tab) for this question.
  function setTargets() {
    const pool = poolFor(map, find, age);
    const ids = new Set(pool.map(q => q.id));
    svg.classList.toggle("cont", map === "cont");
    const contStop = {};
    Object.keys(landPaths).forEach(code => landPaths[code].forEach(p => {
      let on = map === "cont" || (ids.has(code) && (map === "eu" || byCode[code][9] === current.view));
      p.classList.toggle("pool", map !== "cont" && on);
      p.classList.remove("right", "wrong");
      // Continents: one Tab stop per continent (its first shape), not one per country.
      if (on && map === "cont") { if (contStop[p.dataset.k]) on = false; else contStop[p.dataset.k] = p; }
      if (on) { p.setAttribute("tabindex", "0"); p.setAttribute("role", "button"); p.setAttribute("aria-label", map === "cont" ? areaName(p.dataset.k, Loopy.lang, false) : placeName(byCode[code], Loopy.lang, false)); }
      else { p.removeAttribute("tabindex"); p.removeAttribute("role"); p.removeAttribute("aria-label"); }
    }));
    Object.keys(seaPaths).forEach(id => {
      const p = seaPaths[id];
      p.classList.remove("right", "wrong");
      if (map === "cont") { p.setAttribute("tabindex", "0"); p.setAttribute("role", "button"); p.setAttribute("aria-label", areaName(id, Loopy.lang, false)); }
      else { p.removeAttribute("tabindex"); p.removeAttribute("role"); p.removeAttribute("aria-label"); }
    });
  }
  // Try again: a missed place comes back later (Loopy.retry). The note is "eu:FRA:cap" (the map, the place and
  // whether its capital was asked); a place not on the map shown now, or asked the other way, waits.
  const note = (p) => map + ":" + p.id + (p.cap ? ":cap" : "");
  function rebuild(r) {
    const m = /^(cont|eu|world):([a-z]{2,8}|[A-Z]{3})(:cap)?$/.exec(r);
    if (!m || m[1] !== map || !!m[3] !== (map !== "cont" && find === "cap")) return null;
    const q = poolFor(map, find, age).find(x => x.id === m[2]);
    if (!q) return null;
    q.key = q.id;
    return q;
  }

  function newRound() {
    current = Loopy.retry.fresh("where-is-it", recent, () => { const q = makeProblem(map, find, age); q.key = q.id; return q; }, rebuild, 12);
    answered = false;
    marks = [];
    view = current.view;
    setTargets();
    fit();
    askEl.textContent = askText();
    regionEl.hidden = !(map === "world");
    if (map === "world") regionEl.textContent = t("wiIn", { r: areaName(REGION[current.view], Loopy.lang, false) });
    card.classList.remove("good", "bad");
    feedbackEl.className = "feedback";
    feedbackEl.innerHTML = '<span class="hint"></span>';
    feedbackEl.firstChild.textContent = t("wiTap");
    render();
    Loopy.speech.read();
  }

  // What was tapped: a country code, a continent or an ocean, or null for empty sea.
  function hitOf(node, evt) {
    if (!node || !node.dataset) return null;
    if (map === "cont") {
      if (node.dataset.o) return node.dataset.o;
      if (node.dataset.k) return node.dataset.k;
      return null;
    }
    const code = node.dataset.c && node.classList.contains("pool") ? node.dataset.c : null;
    // Small countries are hard to hit with a finger. A tap on the sea or a country that is not asked,
    // close to a small country, counts as a tap on it. Tiny ones (like Luxembourg) win over their neighbours too.
    if (evt && code !== current.id && landPaths[current.id]) {
      const r = landPaths[current.id][0].getBoundingClientRect();
      const tiny = r.width < 16 && r.height < 16, small = r.width < 40 && r.height < 40;
      const near = (d) => evt.clientX > r.left - d && evt.clientX < r.right + d && evt.clientY > r.top - d && evt.clientY < r.bottom + d;
      if ((tiny && near(12)) || (small && !code && near(14))) return current.id;
    }
    return code;
  }
  function nameOfHit(id, sentence) {
    const lang = Loopy.lang;
    return AREAS[id] ? areaName(id, lang, sentence) : placeName(byCode[id], lang, sentence);
  }
  function labelAt(id) {
    if (AREAS[id]) return { lon: AREAS[id][4], lat: AREAS[id][5] };
    const p = byCode[id];
    return { lon: p[7], lat: p[8] };
  }
  function shapes(id) {
    if (seaPaths[id]) return [seaPaths[id]];
    if (map === "cont") return [...svg.querySelectorAll('.land[data-k="' + id + '"]')];
    return landPaths[id] || [];
  }
  function choose(hit) {
    if (answered || !hit) return;
    answered = true; tried++;
    const want = current.id, ok = hit === want, lang = Loopy.lang;
    shapes(want).forEach(s => s.classList.add("right"));
    if (!ok) shapes(hit).forEach(s => s.classList.add("wrong"));
    if (ok) { right++; streak++; } else { streak = 0; }
    const capital = current.type === "land" ? current.place[lang === "de" ? 4 : 3] : "";
    if (ok) Loopy.rewards.correct("where-is-it", streak, kind());
    else Loopy.rewards.wrong("where-is-it", { q: current.cap ? capital : nameOfHit(want, false), a: nameOfHit(want, false), y: nameOfHit(hit, false), k: kind(), r: note(current) });
    // Name the right place on the map (and the one tapped, if it was wrong). Capitals get a dot.
    marks = [Object.assign({ text: nameOfHit(want, false), below: current.cap }, labelAt(want))];
    if (current.cap) marks.push({ text: capital, lon: current.place[5], lat: current.place[6], dot: true });
    if (!ok) marks.push(Object.assign({ text: nameOfHit(hit, false) }, labelAt(hit)));
    drawMarks();
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    const name = nameOfHit(want, true);
    let line;
    if (ok) line = cap1(t("wiThis", { p: name })) + (capital ? " " + t("wiCapIs", { c: capital }) : "");
    else line = cap1(t("wiWas", { y: nameOfHit(hit, true) })) + " " + (capital ? t("wiGreenCap", { p: name, c: capital }) : t("wiGreen", { p: name }));
    feedbackEl.appendChild(document.createTextNode(line));
    [...svg.querySelectorAll("[tabindex]")].forEach(n => n.removeAttribute("tabindex"));
    render();
    nextBtn.focus({ preventScroll: true });
  }

  svg.addEventListener("click", (e) => { if (!answered) choose(hitOf(e.target, e)); });
  // Keyboard focus on a continent rings all of its countries (continent shapes have no border of their own).
  const ringCont = (k, on) => svg.querySelectorAll('.land[data-k="' + k + '"]').forEach(p => p.classList.toggle("kfocus", on));
  // (On the card, not the svg: Chrome makes an svg with focus listeners a Tab stop itself.)
  const mapCard = svg.parentNode;
  mapCard.addEventListener("focusin", (e) => { if (map === "cont" && e.target.dataset.k && e.target.matches(":focus-visible")) ringCont(e.target.dataset.k, true); });
  mapCard.addEventListener("focusout", (e) => { if (e.target.dataset && e.target.dataset.k) ringCont(e.target.dataset.k, false); });
  svg.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && !answered && e.target !== svg) { e.preventDefault(); e.stopPropagation(); choose(hitOf(e.target, null)); }
  });
  nextBtn.addEventListener("click", newRound);
  mapBtns.forEach(b => b.addEventListener("click", () => { map = b.dataset.map; store.set("wi.map.a" + age, map); recent = []; newRound(); }));
  findBtns.forEach(b => b.addEventListener("click", () => { find = b.dataset.find; store.set("wi.find.a" + age, find); recent = []; newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("where-is-it"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") newRound();
  });

  // Read aloud: "Where is France?" or "Paris is the capital of which country?"
  Loopy.speech.question({ host: document.querySelector(".prompt"), inline: true, text: askText });

  // Print worksheet. Countries and continents: 20 small maps with one place in grey, and a line for its name.
  // Capitals: 20 countries with a line for the capital.
  function sheetMap(q) {
    const b = viewBox(q.view), pad = (b[2] - b[0]) * 0.03;
    const s = document.createElementNS(NS, "svg");
    s.setAttribute("viewBox", [b[0] - pad, b[1] - pad, b[2] - b[0] + pad * 2, b[3] - b[1] + pad * 2].join(" "));
    s.setAttribute("class", "ws-clock");
    s.setAttribute("aria-hidden", "true");
    if (q.type === "sea") el("path", { d: SEA[q.id], fill: "#bbb" }, s);
    Object.keys(LAND).forEach(k => {
      if (!meets(BOX[k], b)) return;
      const [code, cont, d] = LAND[k];
      const grey = (q.type === "land" && code === q.id) || (q.type === "cont" && cont === q.id);
      el("path", { d, fill: grey ? "#999" : "#fff", stroke: "#000", "stroke-width": q.view === "world" ? 2.5 : 1.2, "stroke-linejoin": "round" }, s);
    });
    return s;
  }
  // Countries big enough to see on a 32mm map.
  const bigEnough = (q) => q.type !== "land" || (() => { const b = viewBox(q.view), c = BOX[q.id === "RUS" ? "RUS" : q.id] || [0, 0, 0, 0]; return Math.max(c[2] - c[0], c[3] - c[1]) > (b[2] - b[0]) * 0.05; })();
  const mapName = { cont: "wiCont", eu: "wiEurope", world: "wiWorld" };
  Loopy.worksheet({
    title: () => t("wiName"),
    level: () => [t("ageLabel", { n: age }), t("wiMap") + ": " + t(mapName[map])].concat(map === "cont" ? [] : [t("wiFind") + ": " + t(find === "cap" ? "wiCapitals" : "wiCountries")]).join(" · "),
    how: () => t(map !== "cont" && find === "cap" ? "wiHowCap" : "wiHowMap"),
    get layout() { return map !== "cont" && find === "cap" ? "line" : "clock"; },
    make: (n) => {
      const pool = shuffle(poolFor(map, find, age).filter(q => find === "cap" && map !== "cont" ? true : bigEnough(q)));
      const list = [];
      while (list.length < n) list.push(...pool.slice(0, n - list.length));
      return list;
    },
    cell: (q) => {
      const box = document.createElement("div");
      if (q.cap) {
        box.className = "ws-sl";
        const name = document.createElement("span");
        name.className = "ws-geo";
        name.textContent = placeName(q.place, Loopy.lang, false) + ":";
        const blank = document.createElement("span");
        blank.className = "ws-blank";
        box.appendChild(name); box.appendChild(blank);
        return box;
      }
      box.appendChild(sheetMap(q));
      const line = document.createElement("span");
      line.className = "ws-time";
      line.textContent = "__________";
      box.appendChild(line);
      return box;
    },
    answer: (q) => q.cap ? placeName(q.place, Loopy.lang, false) + ": " + q.place[Loopy.lang === "de" ? 4 : 3] : nameOfHit(q.id, false)
  });

  newRound();
})();
</script>
</body>
</html>
