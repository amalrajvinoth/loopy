<style>
/* Layout: a picture card with one box per word, and the words mixed up below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 14px 14px 12px; gap: 8px; }
.feedback { min-height: 2.9em; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }
/* Short phones: keep long explanations from pushing the words off screen. */
@media (max-height: 760px) and (orientation: portrait) {
  .feedback { font-size: 0.95rem; line-height: 1.35; }
  .feedback strong { font-size: 1.15rem; }
}

/* Portrait: the page is exactly one screen tall; the words stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .problem-card { min-height: 0; overflow: hidden; height: 100%; justify-content: center; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (max-height: 500px) {
  .feedback { font-size: 0.9rem; line-height: 1.3; }
  .feedback strong { font-size: 1.05rem; }
}

/* Sentence Builder: a picture, one box per word, and the words mixed up as tiles to tap in order. */
.pic { font-size: clamp(2.4rem, 11dvh, 6rem); line-height: 1.15; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.25em 0.4em; font-size: clamp(1.15rem, min(4.6vw, 3.6dvh), 1.7rem); font-weight: 700; line-height: 1.3; }
.slot { min-width: 1.6em; padding: 0 0.15em; text-align: center; border-bottom: 0.12em solid var(--line); color: var(--ink); white-space: nowrap; }
.slot:empty::before { content: "\00a0"; }
.slot.cur { border-color: var(--accent); }
.slot.ok { color: var(--good); border-color: var(--good); }
.slot.no { color: var(--bad); border-color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.08em; }
.slots.reveal { font-size: clamp(1.05rem, min(4vw, 3.2dvh), 1.5rem); color: var(--muted); }
.slots.reveal .slot { border-color: transparent; color: inherit; opacity: 0; transform: translateY(0.2em); transition: opacity .2s ease, transform .2s ease; }
.slots.reveal .slot.show { opacity: 1; transform: none; }
.slots.reveal .slot.mark { color: var(--accent); border-color: var(--accent); }
.side { display: flex; flex-direction: column; gap: 8px; }
.words { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.words button, .actions button {
  font: inherit; font-size: clamp(1.1rem, 2.8dvh, 1.6rem); font-weight: 700; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 16px; min-height: clamp(48px, 7dvh, 80px); cursor: pointer;
  transition: transform .08s ease, border-color .15s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.words button { flex: 1 0 auto; padding: 0 16px; min-width: 56px; }
.words button:hover:not(:disabled), .actions button:hover:not(:disabled) { border-color: var(--accent); }
.words button:active:not(:disabled), .actions button:active:not(:disabled) { transform: scale(0.96); }
.words button:disabled, .actions button:disabled { opacity: 0.4; cursor: default; }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.actions .erase { font-size: 1.1rem; color: var(--muted); }
.actions .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.3rem; }
.actions .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }
.seg.four { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.seg button { padding-inline: 4px; }
@media (min-width: 600px) and (orientation: portrait) {
  .words button, .actions button { min-height: clamp(56px, 8dvh, 100px); font-size: clamp(1.3rem, 3dvh, 1.9rem); }
}
@media (orientation: landscape) and (min-width: 640px) {
  .side { height: 100%; justify-content: center; }
  .words button, .actions button { min-height: clamp(44px, 13dvh, 100px); }
}
@media (max-height: 900px), (max-width: 599px) {
  .problem-card.good .pic, .problem-card.bad .pic { zoom: 0.7; }
}
/* Short phones: a smaller picture, so the word boxes and the explanation have room. */
@media (max-height: 700px) {
  .pic { font-size: clamp(2rem, 9dvh, 4rem); }
  .problem-card.good .pic, .problem-card.bad .pic { zoom: 0.6; }
}
/* Short phones in portrait: after a wrong answer the right sentence needs the picture's room. */
@media (max-height: 700px) and (orientation: portrait) {
  .problem-card.bad .pic { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .slots.reveal .slot { transform: none; }
}
/* The printed worksheet: the words mixed up, and a line to write the sentence on. */
@media print {
  .loopy-sheet .ws-sb { display: flex; flex-direction: column; align-items: flex-start; flex: 1 1 auto; gap: 1.5mm; }
  .loopy-sheet .ws-sbw { font-size: 11pt; color: #333; line-height: 1.3; }
  .loopy-sheet .ws-sbl { display: block; width: 100%; max-width: 80mm; height: 6mm; border-bottom: 0.4mm solid #000; }
  .loopy-sheet .sheet-mixed .ws-sbl { height: 8mm; }
}

const randInt = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randInt(arr.length)];
const shuffle = (arr) => arr.slice().sort(() => Math.random() - 0.5);
// The words as one line: "The dog sleeps." (the end mark goes back onto the last word).
const line = (words) => words.join(" ").replace(/ ([.!?])$/, "$1");

// One sentence to build. level: 1 to 4. The tiles are the words mixed up, never in the right order.
// From level 2 the full stop, question mark or exclamation mark is its own tile.
function makeProblem(lang, level, avoid) {
  const list = SENTENCES[lang][level - 1], keyOf = (s) => s.replace(/\*/g, "").slice(s.indexOf(" ") + 1);
  let s = pick(list);
  for (let tries = 0; tries < 40 && avoid && avoid.includes(keyOf(s)); tries++) s = pick(list);
  const parts = s.split(" "), pic = parts.shift();
  let verb = -1;
  const words = parts.map((w, i) => { if (w[0] === "*") { verb = i; return w.slice(1); } return w; });
  if (level > 1) {
    const last = words[words.length - 1], m = /[.!?]$/.exec(last);
    if (m && last.length > 1) { words[words.length - 1] = last.slice(0, -1); words.push(m[0]); }
  }
  let tiles = shuffle(words);
  for (let i = 0; i < 20 && tiles.join(" ") === words.join(" "); i++) tiles = shuffle(words);
  return { pic, words, verb, tiles, level, text: line(words), key: keyOf(s) };
}
// GEN END

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), picEl = $("pic"), slotsEl = $("slots"), revealEl = $("reveal"), wordsEl = $("words"),
    feedbackEl = $("feedback"), goBtn = $("k-go"), eraseBtn = $("k-erase");
  const wordsBtns = [...document.querySelectorAll("#words-seg button")];
  const levelBtns = [...document.querySelectorAll("#level-seg button")];
  const t = Loopy.t;
  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };
  const still = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  let age = Loopy.getAge();
  let wordsLang = store.get("sb.words", Loopy.lang === "de" ? "de" : "en", ["en", "de"]);
  let level;
  // The level is remembered per age: 3 words up to age 7, 4 to 5 words at 8 and 9, questions at 10, commas from 11.
  const levelForAge = (a) => a <= 7 ? 1 : a <= 9 ? 2 : a === 10 ? 3 : 4, LEVELS = [1, 2, 3, 4];
  // The kind of question in the answer log, by level.
  const KINDS = { 1: "sb-3", 2: "sb-5", 3: "sb-6", 4: "sb-8" };
  function loadForAge() {
    level = store.get("sb.level.a" + age, levelForAge(age), LEVELS);
    // Opened from the grown-ups' page to practise one level: set it for this visit, without saving.
    const m = /^sb-([3568])$/.exec(Loopy.log.hint || "");
    if (m) { level = +Object.keys(KINDS).find(l => KINDS[l] === m[0]); Loopy.log.hint = ""; }
  }
  loadForAge();
  Loopy.levels.init({ names: ["sbL1", "sbL2", "sbL3", "sbL4"],
    get: () => level - 1, base: () => levelForAge(age) - 1,
    set: (i) => { level = LEVELS[i]; store.set("sb.level.a" + age, level); recent = []; render(); } });
  let right = 0, tried = 0, streak = 0;
  let current = null, picked = [], answered = false, recent = [], timers = [];
  const built = () => picked.map(i => current.tiles[i]);

  // Read aloud reads the sentence to build, in the language of the sentences.
  Loopy.speech.question({ host: card, text: () => current ? current.text : "", lang: () => wordsLang });

  function drawSlots() {
    const words = built();
    slotsEl.textContent = "";
    current.words.forEach((w, i) => {
      const s = document.createElement("span");
      s.className = "slot";
      s.style.minWidth = Math.max(1.6, w.length * 0.62 + 0.4) + "em";
      if (words[i] !== undefined) s.textContent = words[i];
      if (answered) s.classList.add(words[i] === w ? "ok" : "no");
      else if (i === words.length) s.classList.add("cur");
      slotsEl.appendChild(s);
    });
    slotsEl.setAttribute("aria-label", t("sbBoxes", { n: current.words.length }) + (words.length ? ": " + line(words) : ""));
  }
  function render() {
    Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    wordsBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.words === wordsLang)));
    levelBtns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.level === level)));
    goBtn.textContent = t(answered ? "next" : "check");
    goBtn.disabled = !answered && picked.length < current.words.length;
    eraseBtn.disabled = answered || !picked.length;
    // The tile(s) with the next word carry data-correct, so the browser test knows a right tap.
    const next = answered || picked.length >= current.words.length ? null : current.words[picked.length];
    [...wordsEl.children].forEach((b, i) => {
      b.disabled = answered || picked.includes(i);
      b.setAttribute("data-correct", String(!b.disabled && b.textContent === next));
    });
    drawSlots();
  }
  function stopReveal() { timers.forEach(clearTimeout); timers = []; }
  function newRound() {
    stopReveal();
    current = Loopy.fresh(recent, () => makeProblem(wordsLang, level), 15);
    picked = []; answered = false;
    picEl.textContent = current.pic;
    picEl.setAttribute("aria-label", t("sbPic"));
    wordsEl.textContent = "";
    current.tiles.forEach((w, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = w; b.lang = wordsLang;
      b.addEventListener("click", () => add(i));
      wordsEl.appendChild(b);
    });
    revealEl.hidden = true; revealEl.textContent = "";
    card.classList.remove("good", "bad");
    feedbackEl.className = "feedback";
    feedbackEl.innerHTML = '<span class="hint"></span>';
    feedbackEl.firstChild.textContent = t("sbAsk");
    render();
    Loopy.speech.read();
  }
  function add(i) {
    if (answered || picked.includes(i) || picked.length >= current.words.length) return;
    picked.push(i);
    const fromKeys = wordsEl.contains(document.activeElement);
    render();
    // With the keyboard, the tapped tile greys out, so focus moves on to the next word, or to Check.
    if (fromKeys) (wordsEl.querySelector("button:not(:disabled)") || goBtn).focus({ preventScroll: true });
  }
  function erase() {
    if (answered || !picked.length) return;
    picked.pop();
    render();
  }
  // One short line on why the first wrong word is wrong. i: where the child's sentence first differs.
  function why(words, i) {
    const b = words[i], w = current.words[i];
    if (/^[.!?]$/.test(b)) return t(b === "." ? "sbDot" : b === "!" ? "sbBang" : "sbQ");
    if (i === 0 && /^[a-zäöü]/.test(b)) return t("sbCap");
    if (i === current.verb && i > 0) return t("sbVerb");
    if (i === 0) return t("sbStart", { w });
    return t("sbAfter", { a: current.words[i - 1], b: w });
  }
  // After a wrong answer, the right sentence appears under the child's try, one word at a time,
  // with the first wrong spot marked.
  function reveal(mark) {
    revealEl.textContent = "";
    const boxes = [];
    current.words.forEach((w, i) => {
      // The end mark stays on its word, unless it is the wrong spot to show.
      if (/^[.!?]$/.test(w) && i !== mark && boxes.length) { boxes[boxes.length - 1].textContent += w; return; }
      const s = document.createElement("span");
      s.className = "slot" + (i === mark ? " mark" : ""); s.textContent = w;
      revealEl.appendChild(s);
      boxes.push(s);
    });
    revealEl.hidden = false;
    boxes.forEach((s, i) => {
      if (still) s.classList.add("show");
      else timers.push(setTimeout(() => s.classList.add("show"), 250 + i * 300));
    });
  }
  function check() {
    if (answered || picked.length < current.words.length) return;
    answered = true; tried++;
    const words = built(), yours = line(words);
    let i = 0;
    while (i < current.words.length && words[i] === current.words[i]) i++;
    const ok = i === current.words.length;
    if (ok) { right++; streak++; } else { streak = 0; }
    if (ok) Loopy.rewards.correct("sentence-builder", streak);
    else Loopy.rewards.wrong("sentence-builder", { q: current.text, a: current.text, y: yours, k: KINDS[current.level] });
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    feedbackEl.appendChild(document.createTextNode(ok ? t("sbYes", { s: current.text }) : why(words, i)));
    if (!ok) reveal(i);
    render();
    goBtn.focus({ preventScroll: true });
    Loopy.speech.read();
  }

  eraseBtn.addEventListener("click", erase);
  goBtn.addEventListener("click", () => { answered ? newRound() : check(); });
  wordsBtns.forEach(b => b.addEventListener("click", () => { wordsLang = b.dataset.words; store.set("sb.words", wordsLang); recent = []; newRound(); }));
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; store.set("sb.level.a" + age, level); recent = []; newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("sentence-builder"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter") {
      if (e.target.tagName === "BUTTON") return;
      answered ? newRound() : check();
      e.preventDefault();
      return;
    }
    if (e.key === "Backspace") { erase(); e.preventDefault(); return; }
    // 1 to 9: tap the first, second, ... word tile.
    if (/^[1-9]$/.test(e.key) && +e.key <= current.tiles.length) add(+e.key - 1);
  });

  // Print worksheet: 20 sentences with the words mixed up, and a line to write each one on.
  const part = (cls, text) => { const n = document.createElement("span"); n.className = cls; if (text) n.textContent = text; return n; };
  Loopy.worksheet({
    title: () => t("sbName"),
    level: () => [t("ageLabel", { n: age }), t("sbLevel") + ": " + t("sbL" + level),
      t("sbWords") + ": " + (wordsLang === "de" ? "Deutsch" : "English")].join(" · "),
    how: () => t("sbHow"),
    layout: "line",
    make: (n) => { const list = [], keys = []; while (list.length < n) { const p = makeProblem(wordsLang, level, keys); keys.push(p.key); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-sb";
      box.appendChild(part("ws-sbw", p.pic + " " + p.tiles.join("  ")));
      box.appendChild(part("ws-sbl"));
      return box;
    },
    answer: (p) => p.pic + " " + p.text
  });

  newRound();
})();
