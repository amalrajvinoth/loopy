/* Layout: a clue and a letter grid on a card, a keyboard below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .seg button { font-size: 0.85rem; }
  .seg.five button { font-size: 0.72rem; padding-inline: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 12px 14px 12px; gap: 8px; }
.feedback { min-height: 0; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }

/* Portrait: the page is exactly one screen tall; the keyboard stays at the bottom
   and the card shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .problem-card { min-height: 0; overflow: hidden; height: 100%; justify-content: center; }
  .side { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
}

/* Word Detective: the case strip, a clue, the letter grid, then the keyboard. */
.case-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.case { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
.case span { color: var(--muted); font-weight: 400; }
.case i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--chip); }
.case i.ok { background: var(--good); border-color: var(--good); }
.case i.no { background: var(--bad); border-color: var(--bad); }
.case i.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.more {
  font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--ink); background: transparent;
  border: 2px solid var(--accent); border-radius: 999px; min-height: 36px; padding: 0 12px; cursor: pointer; white-space: nowrap;
}
.more:disabled { opacity: 0.45; cursor: default; }
.case-row .case { min-width: 0; }
@media (max-width: 380px) { .case { font-size: 0.85rem; } .more { font-size: 0.8rem; padding: 0 8px; } }
.clues { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.clue { display: flex; gap: 8px; align-items: flex-start; border: 2px solid var(--line); border-radius: 14px; padding: 6px 10px; background: var(--chip); text-align: left; font-size: 0.95rem; line-height: 1.3; }
.clue .ic { font-size: 1.25rem; line-height: 1.1; flex: 0 0 auto; }
.clue b { display: block; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.clue .gap { display: inline-block; min-width: 3ch; border-bottom: 3px solid var(--accent); vertical-align: -2px; }
.prompt { margin: 0; color: var(--muted); font-size: 0.95rem; text-align: center; }

.grid { display: grid; gap: 5px; --cell: clamp(26px, 5.2dvh, 48px); }
.grid .row { display: grid; grid-template-columns: repeat(var(--n, 5), var(--cell)); gap: 5px; }
.grid .cell {
  width: var(--cell); height: var(--cell); display: grid; place-items: center;
  border: 2px solid var(--line); border-radius: 9px; background: var(--key); color: var(--ink);
  font-family: "Fredoka", var(--font); font-weight: 700; font-size: calc(var(--cell) * 0.52); text-transform: uppercase; line-height: 1;
}
.grid .row.cur .cell { border-color: var(--accent); }
.grid .cell.g { background: var(--good); border-color: var(--good); color: var(--on-accent, #fff); }
.grid .cell.y { background: #e0ad00; border-color: #e0ad00; color: #111; }
.grid .cell.x { background: var(--chip); border-color: var(--chip); color: var(--muted); }
.grid.done .row:not(.last) { display: none; }

.result { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; text-align: center; }
.stamp { display: inline-block; transform: rotate(-5deg); border: 3px solid var(--good); color: var(--good); border-radius: 10px; padding: 2px 12px; font-weight: 700; font-size: 1.15rem; letter-spacing: 0.06em; text-transform: uppercase; font-family: "Fredoka", var(--font); }
.problem-card.bad .stamp { border-color: var(--bad); color: var(--bad); }
.word { margin: 0; font-family: "Fredoka", var(--font); font-size: 2rem; line-height: 1.1; }
.word .pic { font-size: 1.6rem; margin-right: 6px; }
.mean { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.3; }
.quote { margin: 0; font-size: 1rem; line-height: 1.35; border-left: 4px solid var(--accent); padding: 3px 10px; background: var(--chip); border-radius: 0 12px 12px 0; }
.quote mark { background: transparent; color: var(--accent); font-weight: 700; }
.tries { margin: 0; font-weight: 600; font-size: 0.95rem; }
.problem-card.good .tries { color: var(--good); }
.problem-card.bad .tries { color: var(--bad); }

.file { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
.file .c { border: 2px solid var(--line); border-radius: 12px; background: var(--chip); text-align: center; padding: 6px 2px; font-size: 0.72rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.file .c .st { display: block; font-size: 1.4rem; line-height: 1.1; }
.file .c.ok { border-color: var(--good); }
.file .c.no { border-color: var(--bad); }
.big { font-family: "Fredoka", var(--font); font-size: 1.8rem; margin: 0; line-height: 1.1; text-align: center; }
.rank { display: flex; align-items: center; gap: 10px; border: 2px solid var(--accent); border-radius: 14px; padding: 8px 12px; background: var(--chip); width: 100%; text-align: left; }
.rank .ic { font-size: 1.9rem; }
.rank b { display: block; font-size: 1.05rem; }
.rank small { color: var(--muted); line-height: 1.3; display: block; font-size: 0.85rem; }
.stars { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 1.15rem; }
.stars svg { width: 24px; height: 24px; fill: var(--mark); }

.pad { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.pad .krow { display: flex; gap: 5px; justify-content: center; }
.pad button {
  flex: 1 1 0; min-width: 0; min-height: clamp(36px, 6dvh, 54px); border-radius: 9px; border: 2px solid var(--line);
  background: var(--key); color: var(--ink); font: inherit; font-weight: 700; font-size: 1.05rem; text-transform: uppercase; padding: 0; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:active:not(:disabled) { transform: scale(0.95); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad button.g { background: var(--good); border-color: var(--good); color: var(--on-accent, #fff); }
.pad button.y { background: #e0ad00; border-color: #e0ad00; color: #111; }
.pad button.x { background: var(--chip); border-color: var(--chip); color: var(--muted); }
.pad .wide { flex: 1.6 1 0; font-size: 0.9rem; text-transform: none; }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.next { font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(52px, 7dvh, 72px); cursor: pointer; width: 100%; }

/* Short phones: smaller cells and keys, a one-line clue. */
@media (max-height: 700px) and (orientation: portrait) {
  .grid { --cell: clamp(22px, 3.4dvh, 48px); gap: 4px; }
  .more { min-height: 32px; }
  .grid .row { gap: 4px; }
  .clue { font-size: 0.85rem; padding: 4px 8px; }
  .clue b { display: none; }
  .pad button { min-height: 34px; font-size: 0.95rem; }
  .pad { gap: 4px; }
  .pad .krow { gap: 4px; }
  .word { font-size: 1.6rem; }
  .mean, .quote { font-size: 0.9rem; }
  .problem-card { gap: 6px; padding: 10px 12px; }
}
/* Landscape: the clue sits above the keyboard, the grid keeps the card. */
@media (orientation: landscape) and (min-width: 640px) {
  .grid { --cell: clamp(22px, 6.4dvh, 48px); }
  .pad button { min-height: clamp(34px, 9dvh, 54px); }
}
</style>

  en: [
    [
      ["🐱", "cat", "A small furry pet that purrs and ignores you.", "The cat sat on Grandpa's head like a hat."],
      ["🐶", "dog", "A pet that wags its tail and eats your homework.", "Our dog barked at a leaf for an hour."],
      ["☀️", "sun", "The big bright ball in the sky that warms your toes.", "The sun was so hot, the snowman asked for a drink."],
      ["🎩", "hat", "You wear it on your head. Not on your feet.", "Grandpa wore a hat in the bath."],
      ["🛏️", "bed", "You sleep in it. Monsters live under it, maybe.", "The cat took my bed, so I slept in the box."],
      ["☕", "cup", "A small thing you drink from.", "My cup of cocoa had a tiny boat in it."],
      ["🚌", "bus", "A long car that many people ride together.", "The bus was full of ducks going to school."],
      ["🥚", "egg", "A hen lays it. It can be fried or boiled.", "The egg rolled off the table and said ouch."],
      ["🐷", "pig", "A pink farm animal that loves mud.", "The pig wore boots to keep its feet clean."],
      ["📦", "box", "A square thing to put things in. Cats love it.", "Our cat sleeps in a box that is far too small."],
      ["🐛", "bug", "A tiny creature with lots of legs.", "A bug in a tiny hat walked across my book."],
      ["🍓", "jam", "Sweet fruit spread you put on bread.", "Grandpa put jam on his pizza. The cat fainted."],
      ["🟫", "mud", "Wet dirt that squishes between your toes.", "The dog came home covered in mud and very proud."],
      ["🦊", "fox", "A wild animal with a red coat and a bushy tail.", "A fox stole Grandpa's slipper and wore it."],
      ["🐔", "hen", "A bird on a farm that lays eggs.", "The hen sat on a football and waited for it to hatch."],
      ["🖊️", "pen", "You write with it. It is not a pencil.", "My pen only writes silly words on Mondays."],
      ["🗺️", "map", "A drawing that shows you where places are.", "Grandpa read the map upside down and ended up at the zoo."],
      ["🐝", "bee", "A striped insect that makes honey and buzzes.", "A bee asked the flower for a dance."],
      ["🐄", "cow", "A farm animal that says moo and gives milk.", "The cow jumped over the moon, then over the car."],
      ["🦉", "owl", "A bird that hoots and stays up all night.", "The owl fell asleep in the middle of a hoot."],
      ["🦁", "zoo", "A place with lots of animals to visit.", "At the zoo, a monkey took Grandpa's hat."],
      ["🧊", "ice", "Frozen water. Cold and slippery.", "The penguin slid on the ice right into my soup."],
      ["🦶", "toe", "One of the ten little things on your feet.", "My big toe found the brick before my eyes did."],
      ["😴", "nap", "A short sleep in the daytime.", "The cat had a nap on the warm pizza."]
    ],
    [
      ["🐸", "frog", "A green animal that hops and says ribbit.", "The frog wore a crown and waited for a kiss."],
      ["🎂", "cake", "A sweet thing you eat at birthdays.", "The cake had so many candles, the fire truck came."],
      ["⛵", "boat", "It floats on water and carries people.", "Grandpa rowed his boat across the bathtub."],
      ["🚢", "ship", "A very big boat for the sea.", "The ship was so big, it had its own weather."],
      ["🪁", "kite", "It flies on a string in the wind.", "My kite pulled me all the way to school."],
      ["🐦", "bird", "An animal with feathers and wings.", "A bird sang the wrong song all morning."],
      ["🥛", "milk", "A white drink that comes from cows.", "The cat spilled the milk and blamed the dog."],
      ["🛁", "bath", "You sit in warm water to get clean.", "Grandpa took a bath with twelve rubber ducks."],
      ["🧦", "sock", "You wear it on your foot, inside your shoe.", "One sock went missing. The washing machine ate it."],
      ["💡", "lamp", "It makes light when it is dark.", "The lamp went out, so the cat lit a candle."],
      ["🌙", "moon", "The big round light in the night sky.", "The moon looked like a cookie, so Grandpa bit it."],
      ["⭐", "star", "A tiny light in the night sky. Also a shape.", "A star fell into my soup and made it twinkle."],
      ["🌧️", "rain", "Water that falls from clouds.", "The rain was so loud, the frogs put on headphones."],
      ["❄️", "snow", "White, cold and soft. It falls in winter.", "We built a snow bunny with a carrot nose."],
      ["🦘", "jump", "To push off the ground with both feet.", "Watch the kangaroo jump over the fence and the car."],
      ["🏊", "swim", "To move through water with your arms and legs.", "The dog can swim faster than the fish."],
      ["🎤", "sing", "To make music with your voice.", "The cat tried to sing and the window cracked."],
      ["🙈", "hide", "To go where nobody can see you.", "I tried to hide behind a lamp. It did not work."],
      ["🍲", "soup", "A hot meal you eat with a spoon.", "The soup was so hot, Grandpa's spoon melted."],
      ["🐺", "wolf", "A wild animal like a big dog. It howls.", "The wolf huffed, puffed and then asked for a tissue."],
      ["👑", "king", "A man who rules a country and wears a crown.", "The king lost his crown in the sandpit."],
      ["💍", "ring", "A small round thing you wear on a finger.", "The ring was too big, so I wore it as a hat."],
      ["👃", "nose", "It is in the middle of your face. You smell with it.", "My nose knows when cookies are coming."],
      ["📖", "book", "Pages with a story. You read it.", "The book was so funny, the bookshelf laughed."]
    ],
    [
      ["🏔️", "giant", "Very, very big. Bigger than a house.", "A giant snail took three days to cross the road."],
      ["✨", "shiny", "Bright, like it has been polished.", "Grandpa's head is so shiny, birds use it as a mirror."],
      ["😴", "sleep", "What you do at night with your eyes closed.", "The cat can sleep on a fence, a shelf or a cactus."],
      ["🐴", "horse", "A big animal you can ride. It says neigh.", "The horse wore sneakers to the race and won."],
      ["🍞", "bread", "You make toast and sandwiches from it.", "The bread was so old, it had a beard."],
      ["💭", "dream", "A story in your head while you sleep.", "In my dream, the teacher was a pancake."],
      ["😂", "laugh", "The sound you make when something is funny.", "Grandpa's laugh scared the pigeons off the roof."],
      ["🍕", "pizza", "A round, flat food with cheese on top.", "The pizza was so big, we used it as a blanket."],
      ["☁️", "cloud", "A white fluffy thing in the sky.", "A cloud shaped like a bunny followed me home."],
      ["👻", "ghost", "A see-through spirit that says boo.", "The ghost was afraid of the dark, so it slept with a light on."],
      ["🍬", "candy", "Sweet treats. Dentists are not fans.", "Grandpa hid the candy in his sock drawer."],
      ["😊", "happy", "Feeling good and smiling.", "The dog was so happy, its tail nearly fell off."],
      ["🦸", "brave", "Not afraid, even when it is scary.", "The brave mouse told the cat to go away. It worked."],
      ["😁", "smile", "What your mouth does when you are happy.", "Her smile was so wide, her ears moved."],
      ["⛈️", "storm", "Very bad weather with wind, rain and thunder.", "The storm blew Grandpa's hat to another country."],
      ["🐯", "tiger", "A big striped cat that lives in the jungle.", "The tiger painted over its stripes to hide."],
      ["🍀", "lucky", "When good things happen to you by chance.", "I was lucky: I found a coin, a cookie and a cat."],
      ["🪄", "magic", "Tricks that make things appear or vanish.", "With a bit of magic, my homework was gone. Oops."],
      ["🤖", "robot", "A machine that can do jobs like a person.", "Our robot makes toast and tells bad jokes."],
      ["💃", "dance", "To move your body to music.", "Grandpa can dance like a jelly in the wind."],
      ["🐰", "bunny", "A small rabbit. Like loopy!", "The bunny hid the carrots in Grandpa's shoe."],
      ["🪑", "chair", "You sit on it. It has four legs.", "The chair broke when the elephant sat down."],
      ["✈️", "pilot", "The person who flies a plane.", "The pilot landed the plane in the car park."],
      ["🔊", "noisy", "Loud. Makes a lot of sound.", "The noisy frogs sang until the moon asked them to stop."]
    ],
    [
      ["🙋", "eager", "Really wanting to do something, right now.", "The dog was so eager for a walk, it brought its own lead."],
      ["🎩", "fancy", "Very fine and dressed up.", "Grandpa wore a fancy suit to walk the chicken."],
      ["💧", "humid", "Warm and damp air. Sticky weather.", "It was so humid, the fish came out for a walk."],
      ["🔪", "blunt", "Not sharp. A dull edge or point.", "The pencil was so blunt, it wrote in whispers."],
      ["🐭", "timid", "Shy and easily scared.", "The timid cat hid from a very small butterfly."],
      ["🏃", "hasty", "Done too fast, without thinking.", "In a hasty moment, Grandpa buttered the cat instead of the bread."],
      ["🌈", "vivid", "Very bright and clear, like strong colours.", "The vivid pink hat could be seen from the moon."],
      ["🧽", "moist", "A little bit wet.", "The cake was moist and the cat was jealous."],
      ["🤓", "witty", "Clever and funny with words.", "The witty parrot told better jokes than Grandpa."],
      ["🥣", "bland", "Plain. No strong taste.", "The soup was so bland, even the spoon yawned."],
      ["🕊️", "plump", "Nicely round and a bit fat.", "The plump pigeon could not fit through the cat flap."],
      ["🌸", "scent", "A nice smell.", "The scent of cookies woke the whole street."],
      ["🍂", "crisp", "Dry and crunchy, like fresh leaves or chips.", "The toast was so crisp, it snapped when I looked at it."],
      ["🌀", "dizzy", "Feeling like everything is spinning.", "After ten cartwheels, the dog was too dizzy to bark."],
      ["😱", "panic", "Sudden great fear, with no time to think.", "There was panic at the picnic when the ants brought friends."],
      ["🗺️", "quest", "A long search for something important.", "Grandpa went on a quest for his glasses. They were on his head."],
      ["🔩", "rusty", "Covered in brown flakes, like old iron.", "The rusty robot squeaked with every step."],
      ["💦", "sweat", "The water your skin makes when you are hot.", "The sweat ran down the snowman. Then the snowman ran too."],
      ["😬", "tense", "Nervous and tight, not relaxed.", "The room was tense: the cat and the goldfish were staring."],
      ["🚶", "brisk", "Quick and full of energy, like a fast walk.", "Grandpa took a brisk walk and came back with a puppy."],
      ["🌪️", "chaos", "A total mess with no order at all.", "It was chaos: the dog had found the flour."],
      ["🏠", "dwell", "To live in a place.", "Three mice dwell in Grandpa's old boot."],
      ["🍗", "feast", "A big, special meal with lots of food.", "The ants held a feast under our picnic blanket."],
      ["✊", "grasp", "To hold tightly, or to understand.", "The monkey tried to grasp the banana and got the phone."]
    ],
    [
      ["🤪", "absurd", "So silly it makes no sense at all.", "An absurd idea: a hat for the cat's tail."],
      ["🦁", "fierce", "Wild, strong and a bit scary.", "The fierce kitten attacked a sock and won."],
      ["🕊️", "gentle", "Soft and kind, not rough.", "Be gentle with the hamster. It is having a bad day."],
      ["🕳️", "hollow", "Empty inside.", "The hollow log had a squirrel and a tiny sofa in it."],
      ["🤕", "clumsy", "Dropping and bumping into things a lot.", "The clumsy robot stepped on its own foot."],
      ["🥷", "sneaky", "Doing things secretly, like a fox.", "The sneaky cat moved the clock back an hour."],
      ["🌧️", "gloomy", "Dark and sad.", "The gloomy cloud cheered up after a joke about rain."],
      ["😌", "mellow", "Calm, soft and relaxed.", "After the bath, the dog was as mellow as a pudding."],
      ["🪙", "frugal", "Careful with money. Not wasting things.", "The frugal squirrel kept its nuts in a spreadsheet."],
      ["🤸", "nimble", "Quick and light on your feet.", "The nimble goat danced on the roof of the car."],
      ["😤", "pester", "To annoy someone again and again.", "The gulls pester Grandpa for his chips every day."],
      ["😑", "dreary", "Dull, grey and boring.", "The dreary rain stopped when the ducks started singing."],
      ["🏞️", "placid", "Calm and peaceful, not easily upset.", "The placid cow watched the storm and chewed."],
      ["🦊", "shrewd", "Clever and sharp, hard to trick.", "The shrewd fox sold the farmer his own hat."],
      ["🗣️", "candid", "Honest and open, saying what you think.", "A candid parrot said my haircut looked like a nest."],
      ["📣", "bellow", "To shout in a deep, loud voice.", "The bull let out a bellow that blew Grandpa's wig off."],
      ["🦆", "waddle", "To walk with short steps, swaying side to side.", "The ducks waddle into the shop and ask for bread."],
      ["🤐", "mumble", "To speak quietly and not clearly.", "Grandpa tends to mumble when his mouth is full of toffee."],
      ["🐌", "dawdle", "To move slowly and waste time.", "Snails do not dawdle. They are just fast in their own way."],
      ["🤭", "giggle", "To laugh in a small, silly way.", "Grandpa tried not to giggle when the cat wore his glasses."],
      ["🍮", "wobble", "To shake from side to side, like jelly.", "The tower of pancakes began to wobble and then ran away."],
      ["🌵", "cactus", "A desert plant with spikes instead of leaves.", "The cat tried to hug the cactus once. Just once."],
      ["🧩", "puzzle", "A game with pieces that fit together, or a hard question.", "The puzzle had one piece missing. The dog looked guilty."],
      ["❄️", "frosty", "Very cold, with ice on things.", "On the frosty morning, the car wore a scarf."]
    ]
  ],
  de: [
    [
      ["🎩", "Hut", "Man trägt ihn auf dem Kopf. Nicht an den Füßen.", "Opa trug seinen Hut in der Badewanne."],
      ["🍦", "Eis", "Kalt, süß, in der Waffel. Schmilzt in der Sonne.", "Das Eis war so groß, dass es einen eigenen Schatten hatte."],
      ["🚌", "Bus", "Ein langes Auto, in dem viele Leute fahren.", "Im Bus saßen zwölf Enten auf dem Weg zur Schule."],
      ["⏰", "Uhr", "Sie zeigt, wie spät es ist.", "Die Uhr war müde und ging einfach langsamer."],
      ["👂", "Ohr", "Damit hörst du. Du hast zwei davon.", "Der Hase hat ein Ohr immer auf Kekse gerichtet."],
      ["🦁", "Zoo", "Ein Ort mit vielen Tieren zum Anschauen.", "Im Zoo nahm ein Affe Opas Brille."],
      ["🐻", "Bär", "Ein großes, braunes Tier, das Honig liebt.", "Der Bär klopfte an und fragte nach Honig."],
      ["🐄", "Kuh", "Ein Tier auf dem Bauernhof. Sie macht Muh.", "Die Kuh sprang über den Mond und dann über das Auto."],
      ["🌳", "Ast", "Ein Arm vom Baum. Vögel sitzen darauf.", "Auf dem Ast saßen drei Vögel und ein Hut."],
      ["🍵", "Tee", "Ein warmes Getränk aus Blättern.", "Opa rührt seinen Tee mit einem Lineal um."],
      ["🏡", "Hof", "Der Platz vor oder hinter dem Haus.", "Im Hof spielten die Hühner Fußball."],
      ["🏞️", "See", "Viel Wasser mit Land rundherum.", "Im See schwamm ein Frosch mit Badekappe."],
      ["⚽", "Tor", "Beim Fußball soll der Ball hinein.", "Das Tor war so klein, dass der Ball sich beschwerte."],
      ["🧚", "Fee", "Eine zauberhafte Figur mit Flügeln.", "Die Fee wünschte sich selbst ein Eis."],
      ["💪", "Arm", "Er hängt an deiner Schulter. Du hast zwei.", "Mein Arm war zu kurz für den Keks ganz oben."],
      ["🛁", "Bad", "Der Raum mit Badewanne und Dusche.", "Im Bad sang die Ente lauter als Opa."],
      ["🚲", "Rad", "Es ist rund und rollt. Ein Fahrrad hat zwei.", "Das Rad rollte ganz allein zum Bäcker."],
      ["🦸", "Mut", "Wenn du keine Angst hast, auch wenn es gruselig ist.", "Die Maus hatte Mut und schimpfte mit der Katze."],
      ["🐋", "Wal", "Das größte Tier im Meer.", "Der Wal nieste, und zwei Boote flogen weg."],
      ["🦌", "Reh", "Ein scheues Tier im Wald mit dünnen Beinen.", "Das Reh klingelte und fragte nach Möhren."],
      ["🧝", "Elf", "Eine kleine Zauberfigur mit spitzen Ohren.", "Der Elf versteckte Opas Socken im Kühlschrank."],
      ["🔴", "rot", "Die Farbe von Erdbeeren und Feuerwehrautos.", "Opas Nase war rot wie eine Tomate vor Lachen."],
      ["🚂", "Zug", "Er fährt auf Schienen und ist sehr lang.", "Der Zug hielt an, weil eine Kuh eine Fahrkarte wollte."],
      ["👵", "Oma", "Die Mutter von Mama oder Papa.", "Oma fuhr mit dem Skateboard zum Bäcker."]
    ],
    [
      ["🐶", "Hund", "Ein Haustier, das bellt und mit dem Schwanz wedelt.", "Unser Hund bellte eine Stunde lang ein Blatt an."],
      ["🏠", "Haus", "Darin wohnen Menschen. Es hat ein Dach.", "Das Haus der Schnecke hat kein Klo."],
      ["🐭", "Maus", "Ein kleines Tier mit langem Schwanz. Mag Käse.", "Die Maus trug einen Hut aus Käse."],
      ["⚽", "Ball", "Rund. Man kann ihn werfen und kicken.", "Der Ball rollte bis zum Mond und kam nie zurück."],
      ["📖", "Buch", "Seiten mit einer Geschichte. Du liest es.", "Das Buch war so lustig, dass das Regal lachte."],
      ["🛏️", "Bett", "Darin schläfst du nachts.", "Die Katze nahm mein Bett, und ich schlief im Karton."],
      ["⛵", "Boot", "Es schwimmt auf dem Wasser.", "Opa ruderte sein Boot durch die Badewanne."],
      ["🌳", "Baum", "Groß, braun, mit Blättern. Vögel wohnen darin.", "Der Baum trug im Winter einen Schal."],
      ["🐰", "Hase", "Lange Ohren, hüpft. Wie loopy!", "Der Hase versteckte die Möhren in Opas Schuh."],
      ["🦔", "Igel", "Klein, rund, mit Stacheln. Rollt sich ein.", "Der Igel wollte kuscheln. Niemand wollte."],
      ["🫏", "Esel", "Ein graues Tier mit langen Ohren. Es macht I-A.", "Der Esel sang I-A, bis die Hühner weggingen."],
      ["🌹", "Rose", "Eine schöne Blume mit Dornen.", "Die Rose nieste und verlor alle Blätter."],
      ["🎵", "Lied", "Musik mit Worten zum Singen.", "Opa sang ein Lied, und die Fenster klirrten."],
      ["🌲", "Wald", "Viele Bäume zusammen.", "Im Wald tanzten die Füchse Polka."],
      ["⛰️", "Berg", "Sehr hoch, aus Stein. Man kann hinaufklettern.", "Der Berg war so hoch, dass die Wolken klingelten."],
      ["👖", "Hose", "Du trägst sie an den Beinen.", "Die Hose war so weit, dass die Katze darin wohnte."],
      ["👃", "Nase", "Mitten im Gesicht. Damit riechst du.", "Meine Nase weiß, wann es Kekse gibt."],
      ["🍪", "Keks", "Klein, süß und knusprig.", "Der Keks versteckte sich vor Opa unter dem Sofa."],
      ["🧃", "Saft", "Ein Getränk aus Obst.", "Der Saft war so sauer, dass die Zitrone staunte."],
      ["🍞", "Brot", "Daraus macht man Toast und Butterbrote.", "Das Brot war so alt, dass es einen Bart hatte."],
      ["🌙", "Mond", "Das runde Licht am Nachthimmel.", "Der Mond sah aus wie ein Keks, also biss Opa hinein."],
      ["💨", "Wind", "Luft, die sich bewegt. Man sieht ihn nicht.", "Der Wind nahm Opas Hut mit nach Italien."],
      ["🎬", "Kino", "Dort schaut man Filme auf einer großen Leinwand.", "Im Kino fraß die Kuh das ganze Popcorn."],
      ["⛺", "Zelt", "Ein Stoffhaus zum Campen.", "Im Zelt schnarchte ein Igel lauter als Papa."]
    ],
    [
      ["🍕", "Pizza", "Rund und flach, mit Käse obendrauf.", "Die Pizza war so groß, dass wir sie als Decke nahmen."],
      ["🍎", "Apfel", "Rund, rot oder grün, wächst am Baum.", "Der Apfel fiel vom Baum und sagte „Autsch“."],
      ["🐯", "Tiger", "Eine große Katze mit Streifen.", "Der Tiger malte seine Streifen über, um sich zu verstecken."],
      ["🐱", "Katze", "Ein Haustier, das schnurrt und dich ignoriert.", "Die Katze saß auf Opas Kopf wie ein Hut."],
      ["🐦", "Vogel", "Ein Tier mit Federn und Flügeln.", "Der Vogel sang den ganzen Morgen das falsche Lied."],
      ["🌸", "Blume", "Bunt, duftet, wächst im Garten.", "Die Blume bat die Biene um einen Tanz."],
      ["☁️", "Wolke", "Weiß und flauschig, am Himmel.", "Eine Wolke wie ein Hase folgte mir nach Hause."],
      ["🌧️", "Regen", "Wasser, das aus Wolken fällt.", "Der Regen war so laut, dass die Frösche Kopfhörer trugen."],
      ["☀️", "Sonne", "Der helle Ball am Himmel. Sie wärmt dich.", "Die Sonne war so heiß, dass der Schneemann ein Eis wollte."],
      ["🐴", "Pferd", "Ein großes Tier zum Reiten. Es wiehert.", "Das Pferd trug Turnschuhe beim Rennen und gewann."],
      ["🦓", "Zebra", "Ein Pferd mit schwarz-weißen Streifen.", "Das Zebra wollte unbedingt ein Streifenhörnchen sein."],
      ["🍝", "Nudel", "Lang, dünn, aus Teig. Kommt in die Suppe.", "Eine Nudel kletterte aus der Suppe und ging spazieren."],
      ["🎂", "Torte", "Ein großer, süßer Kuchen mit Sahne.", "Die Torte hatte so viele Kerzen, dass die Feuerwehr kam."],
      ["🛌", "Decke", "Darunter kuschelst du dich im Bett.", "Die Decke war weg. Der Hund trug sie als Umhang."],
      ["🎵", "Musik", "Töne, die zusammen schön klingen.", "Die Musik war so laut, dass die Nachbarn mittanzten."],
      ["🐝", "Biene", "Ein gestreiftes Insekt, das Honig macht.", "Die Biene summte ein Schlaflied für die Blume."],
      ["🕯️", "Kerze", "Wachs mit Docht. Brennt und gibt Licht.", "Die Kerze auf der Torte wollte nicht ausgehen."],
      ["🍯", "Honig", "Süß und klebrig. Bienen machen ihn.", "Der Bär steckte im Honig fest und lächelte."],
      ["🧙", "Zwerg", "Ein sehr kleiner Mann aus dem Märchen.", "Der Zwerg brauchte eine Leiter für den Keks."],
      ["🏔️", "Riese", "Ein sehr, sehr großer Mensch aus dem Märchen.", "Der Riese hatte Angst vor einer winzigen Maus."],
      ["👻", "Geist", "Durchsichtig und sagt Buh.", "Der Geist hatte Angst im Dunkeln und schlief mit Licht."],
      ["🏴‍☠️", "Pirat", "Ein Seeräuber mit Augenklappe.", "Der Pirat suchte den Schatz in Opas Keksdose."],
      ["💭", "Traum", "Eine Geschichte im Kopf beim Schlafen.", "In meinem Traum war die Lehrerin ein Pfannkuchen."],
      ["⭐", "Stern", "Ein kleines Licht am Nachthimmel.", "Ein Stern fiel in meine Suppe, und sie funkelte."]
    ],
    [
      ["🦸", "mutig", "Ohne Angst, auch wenn es gruselig ist.", "Die Maus war mutig und schimpfte mit der Katze."],
      ["🤫", "leise", "Ganz still, kaum zu hören.", "Sei leise, der Hamster schläft auf dem Kuchen."],
      ["🦚", "stolz", "Froh über etwas, das man geschafft hat.", "Der Hund war stolz auf seinen neuen Hut aus Salat."],
      ["😜", "frech", "Ein bisschen unartig, auf nette Art.", "Das Kätzchen war frech und klaute meine Socke."],
      ["🐿️", "flink", "Schnell und wendig.", "Das Eichhörnchen war so flink, dass Opa die Brille verlor."],
      ["🍋", "sauer", "Schmeckt wie Zitrone. Oder: verärgert.", "Der Saft war so sauer, dass die Zitrone staunte."],
      ["🐔", "feige", "Ängstlich, traut sich nichts.", "Das Huhn war nicht feige und jagte den Fuchs."],
      ["🔥", "Hitze", "Große Wärme, wie im Sommer.", "Bei der Hitze schmolz Opas Löffel in der Suppe."],
      ["😱", "Panik", "Plötzliche große Angst.", "Es gab Panik beim Picknick, als die Ameisen Freunde mitbrachten."],

      ["🎪", "Zirkus", "Ein großes Zelt mit Clowns und Artisten.", "Im Zirkus jonglierte der Elefant mit Opa."],
      ["🐉", "Drache", "Ein Fabeltier, das Feuer spuckt.", "Der Drache hatte Schnupfen und spuckte nur Rauchringe."],
      ["✨", "Wunder", "Etwas Erstaunliches, das man nicht erklären kann.", "Ein Wunder: Die Katze brachte den Ball zurück."],
      ["🧁", "Muffin", "Ein kleiner, runder Kuchen für eine Person.", "Der Muffin rollte vom Tisch und versteckte sich."]

};
// Keyboard rows per language. The last row gets Erase at the start and Check at the end.
const KEYS = {
  en: ["qwertyuiop", "asdfghjkl", "zxcvbnm"],
  de: ["qwertzuiopü", "asdfghjklöä", "yxcvbnm"]
};
const LENS = [3, 4, 5, 5, 6], TRIES = 6, CASES = 5;
const randInt = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randInt(arr.length)];
const lower = (w) => w.toLowerCase();
// One case: the word at this level, with its picture, meaning and sentence. The key is "en:giggle".
function entry(lang, w) { return { pic: w[0], word: w[1], letters: [...lower(w[1])], mean: w[2], sent: w[3], key: lang + ":" + w[1] }; }
function makeProblem(lang, level) { return entry(lang, pick(WORDS[lang][level - 1])); }
// Green for a letter in the right place, yellow for one that is in the word somewhere else, grey for the rest.
// A letter that is in the word twice gets two marks at most, like the real game.
function marks(guess, answer) {
  const out = guess.map(() => "x"), left = answer.slice();
  guess.forEach((c, i) => { if (c === answer[i]) { out[i] = "g"; left[i] = null; } });
  guess.forEach((c, i) => { if (out[i] === "x") { const j = left.indexOf(c); if (j !== -1) { out[i] = "y"; left[j] = null; } } });
  return out;
}
// GEN END

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), caseEl = $("case"), moreBtn = $("more"), cluesEl = $("clues"), promptEl = $("prompt"), gridEl = $("grid"),
    resultEl = $("result"), feedbackEl = $("feedback"), padEl = $("letters"), nextBtn = $("next"), sideEl = document.querySelector(".side");
  const wordsBtns = [...document.querySelectorAll("#words-seg button")];
  const levelBtns = [...document.querySelectorAll("#level-seg button")];
  const t = Loopy.t;
  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = Loopy.getAge();
  let wordsLang = store.get("wd.words", Loopy.lang === "de" ? "de" : "en", ["en", "de"]);
  let level;
  // The level is remembered per age: 3 letters up to 6, 4 at 7 to 8, 5 at 9 to 10, harder 5 at 11 to 12, then 6.
  const levelForAge = (a) => a <= 6 ? 1 : a <= 8 ? 2 : a <= 10 ? 3 : a <= 12 ? 4 : 5;
  function loadForAge() {
    level = store.get("wd.level.a" + age, levelForAge(age), [1, 2, 3, 4, 5]);
    // Opened from the grown-ups' page to practise one word length (#practise=wd-4): that level for this visit, without saving.
    const m = /^wd-([3-6])$/.exec(Loopy.log.hint || "");
    if (m) { level = LENS.indexOf(+m[1]) + 1; Loopy.log.hint = ""; }
  }
  loadForAge();
  Loopy.levels.init({ names: ["wdL1", "wdL2", "wdL3", "wdL4", "wdL5"],
    get: () => level - 1, base: () => levelForAge(age) - 1,
    set: (i) => { level = i + 1; store.set("wd.level.a" + age, level); recent = []; render(); } });
  let right = 0, tried = 0, streak = 0;
  // A case file holds 5 cases: [{ word, ok, tries }]. summary is true while the closed file is on screen.
  let current = null, typed = [], rows = [], answered = false, recent = [], clues = 0, file = [], summary = false;
  // At the two easiest levels the first clue is open from the start.
  const startClues = () => level <= 2 ? 1 : 0;
  const CLUES = 3;

  function clueText(i) {
    if (i === 0) return current.mean;
    if (i === 1) return gapped(current.sent);
    return t("wdFirstIs", { c: current.word[0].toUpperCase(), n: current.letters.length });
  }
  // The silly sentence with the word taken out: "Grandpa tried not to ___ when the cat wore his glasses."
  function gapped(s) {
    const i = lower(s).indexOf(lower(current.word));
    return i === -1 ? s : s.slice(0, i) + "\u0000" + s.slice(i + current.word.length);
  }
  function drawClues() {
    cluesEl.textContent = "";
    for (let i = 0; i < clues; i++) {
      const box = document.createElement("div"); box.className = "clue";
      const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = i === 0 ? current.pic : i === 1 ? "💬" : "🔤";
      const body = document.createElement("div");
      const b = document.createElement("b"); b.textContent = t(["wdMean", "wdHeard", "wdFirst"][i]);
      body.appendChild(b);
      const text = clueText(i);
      text.split("\u0000").forEach((part, j) => {
        if (j) { const gap = document.createElement("span"); gap.className = "gap"; gap.setAttribute("aria-label", "___"); body.appendChild(gap); }
        body.appendChild(document.createTextNode(part));
      });
      box.appendChild(ic); box.appendChild(body);
      cluesEl.appendChild(box);
    }
    cluesEl.hidden = !clues || answered;
    const left = CLUES - clues;
    moreBtn.textContent = t("wdMore") + " · " + (left ? t("wdLeft", { n: left }) : t("wdNoClues"));
    moreBtn.disabled = !left || answered;
    moreBtn.hidden = answered;
    promptEl.textContent = clues ? t("wdGuessClue") : t("wdGuess", { n: current.letters.length });
    promptEl.hidden = answered || clues > 0;
  }
  function drawCase() {
    caseEl.textContent = "";
    const n = Math.min(file.length + 1, CASES);
    const label = document.createElement("span"); label.textContent = t("wdCase", { n }) + " ";
    caseEl.appendChild(label);
    for (let i = 0; i < CASES; i++) {
      const dot = document.createElement("i");
      if (file[i]) dot.className = file[i].ok ? "ok" : "no";
      else if (i === file.length && !summary) dot.className = "now";
      caseEl.appendChild(dot);
    }
    caseEl.setAttribute("aria-label", t("wdCaseAria", { n, s: file.filter(c => c.ok).length }));
  }
  function drawGrid() {
    gridEl.textContent = "";
    gridEl.style.setProperty("--n", current.letters.length);
    gridEl.classList.toggle("done", answered);
    for (let r = 0; r < TRIES; r++) {
      const row = document.createElement("div"); row.className = "row"; row.setAttribute("role", "listitem");
      const guess = rows[r], cur = !answered && r === rows.length;
      if (cur) row.classList.add("cur");
      if (answered && r === rows.length - 1) row.classList.add("last");
      const names = [];
      for (let i = 0; i < current.letters.length; i++) {
        const cell = document.createElement("div"); cell.className = "cell";
        const c = guess ? guess.g[i] : cur ? typed[i] : "";
        if (c) cell.textContent = c;
        if (guess) { cell.classList.add(guess.m[i]); names.push(c + " " + t({ g: "wdRight", y: "wdIn", x: "wdNot" }[guess.m[i]])); }
        row.appendChild(cell);
      }
      row.setAttribute("aria-label", guess ? t("wdRow", { n: r + 1, l: names.join(", ") }) : cur && typed.length ? t("wdRow", { n: r + 1, l: typed.join(" ") }) : t("wdRowEmpty", { n: r + 1 }));
      gridEl.appendChild(row);
    }
  }
  // The keyboard: every key keeps the best mark it earned in this case (green beats yellow beats grey).
  function drawPad() {
    const best = {};
    rows.forEach(r => r.g.forEach((c, i) => { const m = r.m[i]; if (m === "g" || (m === "y" && best[c] !== "g") || !best[c]) best[c] = m; }));
    padEl.textContent = "";
    KEYS[wordsLang].forEach((line, li) => {
      const row = document.createElement("div"); row.className = "krow";
      if (li === KEYS[wordsLang].length - 1) row.appendChild(key("k-erase", "wide", t("wdErase"), t("wdEraseAria"), erase));
      [...line].forEach(c => {
        const b = key("", best[c] || "", c, "", () => add(c));
        b.dataset.k = c; b.lang = wordsLang;
        b.disabled = answered || typed.length >= current.letters.length;
        row.appendChild(b);
      });
      if (li === KEYS[wordsLang].length - 1) { const go = key("k-go", "wide go", t("wdCheck"), "", check); go.disabled = answered || typed.length < current.letters.length; row.appendChild(go); }
      padEl.appendChild(row);
    });
  }
  function key(id, cls, text, aria, fn) {
    const b = document.createElement("button");
    b.type = "button"; if (id) b.id = id; b.className = cls; b.textContent = text;
    if (aria) b.setAttribute("aria-label", aria);
    b.addEventListener("click", fn);
    return b;
  }
  // Landscape on a phone or tablet: the clues sit above the keyboard, so the grid keeps the card.
  const wide = window.matchMedia("(orientation: landscape) and (min-width: 640px)");
  function place() {
    const want = wide.matches ? sideEl : card, at = wide.matches ? padEl : promptEl;
    if (cluesEl.parentNode !== want) want.insertBefore(cluesEl, at);
  }
  function render() {
    place();
    Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    wordsBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.words === wordsLang)));
    levelBtns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.level === level)));
    drawCase();
    if (summary) return;
    drawClues();
    drawGrid();
    drawPad();
    // The browser test types the answer while the case is open: data-tries says so, data-a carries the word.
    if (answered) { card.removeAttribute("data-tries"); card.removeAttribute("data-a"); }
    else { card.setAttribute("data-tries", "on"); card.setAttribute("data-a", current.letters.join("")); }
    padEl.hidden = answered;
    nextBtn.hidden = !answered;
    nextBtn.textContent = t(file.length >= CASES ? "wdFile" : "wdNext");
  }
  // Try again: a missed word comes back later (Loopy.retry). The note is "en:giggle"; a word in the other
  // language, or longer than the words at the level set now, waits.
  const note = (p) => p.key;
  function rebuild(r) {
    const m = /^(en|de):([^\s:]{3,6})$/.exec(r);
    if (!m || m[1] !== wordsLang) return null;
    for (const list of WORDS[wordsLang]) { const w = list.find(x => x[1] === m[2]); if (w) return [...w[1]].length <= LENS[level - 1] ? entry(wordsLang, w) : null; }
    return null;
  }

  function newCase() {
    if (summary || file.length >= CASES) { file = []; summary = false; }
    current = Loopy.retry.fresh("word-detective", recent, () => makeProblem(wordsLang, level), rebuild, 15);
    typed = []; rows = []; answered = false; clues = startClues();
    card.classList.remove("good", "bad");
    resultEl.hidden = true; resultEl.textContent = "";
    gridEl.hidden = false;
    feedbackEl.className = "feedback"; feedbackEl.textContent = "";
    render();
    Loopy.speech.read();
  }
  function add(c) {
    if (answered || typed.length >= current.letters.length) return;
    typed.push(c);
    feedbackEl.textContent = "";
    render();
  }
  function erase() {
    if (answered || !typed.length) return;
    typed.pop();
    render();
  }
  function check() {
    if (answered) return;
    if (typed.length < current.letters.length) { feedbackEl.textContent = t("wdFull"); return; }
    const g = typed.slice(), m = marks(g, current.letters);
    rows.push({ g, m });
    typed = [];
    const ok = m.every(x => x === "g");
    if (ok || rows.length >= TRIES) finish(ok);
    else render();
  }
  function finish(ok) {
    answered = true; tried++;
    if (ok) { right++; streak++; } else { streak = 0; }
    const k = "wd-" + current.letters.length, last = rows[rows.length - 1].g.join("");
    if (ok) Loopy.rewards.correct("word-detective", streak, k);
    else Loopy.rewards.wrong("word-detective", { q: current.mean.slice(0, 40), a: current.word, y: last, k, r: note(current) });
    file.push({ word: current.word, pic: current.pic, ok, tries: rows.length });
    card.classList.add(ok ? "good" : "bad");
    drawResult(ok);
    render();
    nextBtn.focus({ preventScroll: true });
    Loopy.speech.read();
  }
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  // Case closed: the word, what it means, the silly sentence with the word in it, and how many tries it took.
  function drawResult(ok) {
    resultEl.textContent = "";
    resultEl.appendChild(el("span", "stamp", ok ? t("wdClosed") + " ✓" : t("wdOpen")));
    const word = el("h2", "word"); word.appendChild(el("span", "pic", current.pic)); word.appendChild(document.createTextNode(current.word)); word.lang = wordsLang;
    resultEl.appendChild(word);
    resultEl.appendChild(el("p", "mean", current.mean));
    const q = el("p", "quote"); q.lang = wordsLang;
    gapped(current.sent).split("\u0000").forEach((part, j) => { if (j) q.appendChild(el("mark", "", current.word)); q.appendChild(document.createTextNode(part)); });
    resultEl.appendChild(q);
    resultEl.appendChild(el("p", "tries", ok ? (rows.length === 1 ? t("wdTry1") : t("wdTries", { n: rows.length })) : t("wdWas", { w: current.word })));
    resultEl.hidden = false;
    cluesEl.hidden = true;
  }
  // After 5 cases: the closed case file with every word, the stars earned and a rank.
  function drawSummary() {
    summary = true;
    const solved = file.filter(c => c.ok).length, quick = file.every(c => c.ok && c.tries <= 3);
    const rank = quick ? "wdSuper" : solved === CASES ? "wdDetective" : "wdRookie";
    resultEl.textContent = "";
    gridEl.hidden = true; cluesEl.hidden = true; promptEl.hidden = true; moreBtn.disabled = true; moreBtn.hidden = true;
    card.classList.remove("good", "bad");
    resultEl.appendChild(el("h2", "big", t("wdFileDone")));
    const list = el("div", "file");
    file.forEach(c => { const box = el("div", "c " + (c.ok ? "ok" : "no")); box.appendChild(el("span", "st", c.ok ? "✅" : "❌")); box.appendChild(document.createTextNode(c.word)); box.lang = wordsLang; list.appendChild(box); });
    resultEl.appendChild(list);
    resultEl.appendChild(el("p", "mean", t("wdSolved", { n: solved })));
    const stars = el("div", "stars");
    stars.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
    stars.appendChild(document.createTextNode(t("wdStars", { n: solved })));
    resultEl.appendChild(stars);
    const box = el("div", "rank"); box.appendChild(el("span", "ic", quick ? "🕵️" : solved === CASES ? "🔎" : "🐰"));
    const txt = el("div"); txt.appendChild(el("b", "", t("wdRank", { r: t(rank) }))); txt.appendChild(el("small", "", t(quick ? "wdHowTop" : solved === CASES ? "wdHowSuper" : "wdHowDet")));
    box.appendChild(txt); resultEl.appendChild(box);
    resultEl.hidden = false;
    nextBtn.textContent = t("wdAgain");
    nextBtn.hidden = false;
    padEl.hidden = true;
    drawCase();
    nextBtn.focus({ preventScroll: true });
  }
  function next() {
    if (!answered) return;
    if (!summary && file.length >= CASES) drawSummary();
    else newCase();
  }

  nextBtn.addEventListener("click", next);
  wide.addEventListener("change", place);
  moreBtn.addEventListener("click", () => { if (clues < CLUES && !answered) { clues++; drawClues(); Loopy.speech.read(); } });
  wordsBtns.forEach(b => b.addEventListener("click", () => { wordsLang = b.dataset.words; store.set("wd.words", wordsLang); recent = []; file = []; summary = false; newCase(); }));
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; store.set("wd.level.a" + age, level); recent = []; newCase(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newCase(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; file = []; summary = false; Loopy.recent.clear("word-detective"); newCase(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".loopy-cheer.big")) return;
    const b = e.target.closest("button");
    if (e.key === "Enter") {
      // Buttons act on their own (Check, Next, Clue, Settings); only a focused letter key must not add its letter too.
      if ((b && !b.dataset.k) || e.target.closest("#settings-panel")) return;
      answered ? next() : check();
      e.preventDefault();
      return;
    }
    // Typing on a real keyboard takes the focus off any button, so Enter checks the word afterwards.
    if (e.key === "Backspace") { erase(); if (b) b.blur(); e.preventDefault(); return; }
    const c = e.key.length === 1 ? e.key.toLowerCase() : "";
    if (c && KEYS[wordsLang].join("").includes(c)) { add(c); if (b) b.blur(); }
  });

  // Read aloud: the open clues while the case runs, then the word with its meaning and sentence.
  Loopy.speech.question({ host: card, lang: () => wordsLang, text: () => {
    if (summary) return t("wdFileDone") + " " + t("wdSolved", { n: file.filter(c => c.ok).length });
    if (answered) return t("wdReadWord", { w: current.word, m: current.mean, s: current.sent });
    const open = []; for (let i = 0; i < clues; i++) open.push(clueText(i).replace("\u0000", "..."));
    return open.length ? open.map(c => t("wdReadClue", { c })).join(" ") : t("wdGuess", { n: current.letters.length });
  } });

  // Print worksheet: 20 clues, each with a box for every letter of the word.
  Loopy.worksheet({
    title: () => t("wdName"),
    level: () => [t("ageLabel", { n: age }), t("wdLevel") + ": " + t("wdL" + level), t("wdWords") + ": " + (wordsLang === "de" ? "Deutsch" : "English")].join(" · "),
    how: () => t("wdHow"),
    layout: "word",
    make: (n) => { const list = [], keys = []; let tries = 0; while (list.length < n) { const p = makeProblem(wordsLang, level); if (keys.includes(p.key) && tries++ < 400) continue; keys.push(p.key); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("div");
      box.appendChild(el("span", "ws-pic", p.pic));
      box.appendChild(el("span", "ws-q", p.mean));
      const row = el("span", "ws-word");
      p.letters.forEach(() => row.appendChild(el("span", "ws-gap")));
      box.appendChild(row);
      return box;
    },
    answer: (p) => p.pic + " " + p.word
  });

  newCase();
