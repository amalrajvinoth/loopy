<style>
/* Layout: the letter grid on a card, the word list and buttons below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg.five { grid-template-columns: repeat(5, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .seg button { font-size: 0.85rem; }
  .seg.five button { font-size: 0.72rem; padding-inline: 2px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 760px; } } /* wider than the other games: the grid is the whole game */
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 10px 12px; gap: 6px; }
.feedback { min-height: 0; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }

/* Portrait: the page is exactly one screen tall; the keyboard stays at the bottom
   and the card shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
  .gridbox { flex: 1 1 auto; }
  body:not(:has(#settings-panel:not([hidden]))) .gridbox { container-type: size; }
  /* The card hugs the grid when the grid is as wide as the card: the word list sits right under it,
     Clue and Next stay at the bottom, and the spare room is between them, not inside the card. */
  .play { container-type: inline-size; }
  .problem-card { flex-grow: 999; max-height: calc(100cqw + 104px); }
  .problem-card:has(#result:not([hidden])) { max-height: calc(100cqw + 170px); }
  .feedback { min-height: 1.5em; }
  .side { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
  .side .words { flex: 0 0 auto; }
}
/* Tablets upright: bigger word chips and buttons; the word list sits under the card, Clue at the bottom. */
@media (orientation: portrait) and (min-width: 600px) {
  .side { gap: 16px; }
  .words { gap: 10px; }
  .wd { font-size: 1.2rem; padding: 7px 14px 7px 10px; }
  .wd .e { font-size: 1.4rem; }
  .more { min-height: 54px; font-size: 1.1rem; }
  .next { font-size: 1.35rem; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .problem-card { min-height: 0; overflow: hidden; height: 100%; justify-content: center; }
  .side { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .gridbox { flex: 1 1 auto; }
  body:not(:has(#settings-panel:not([hidden]))) .gridbox { container-type: size; }
}

/* Word Trail: the topic row, the letter grid with its trail lines, the spelled letters, then the word list. */
.topic-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.topic { font-weight: 700; font-size: 1.05rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.found { color: var(--muted); font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
.gridbox { width: 100%; display: flex; justify-content: center; align-items: center; min-height: 0; }
.gridwrap { position: relative; width: min(100%, 400px, 38dvh); width: min(100%, 100cqh); container-type: inline-size; }
.grid { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 5px; touch-action: none; }
.cell {
  aspect-ratio: 1; min-width: 0; padding: 0; display: grid; place-items: center; cursor: pointer;
  border: 2px solid var(--line); border-radius: 22%; background: var(--key); color: var(--ink);
  font-family: "Fredoka", var(--font); font-weight: 700; font-size: clamp(1rem, 4.6dvh, 1.7rem); font-size: clamp(1rem, 9cqw, 3rem); text-transform: uppercase; line-height: 1;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
.grid.n4 .cell { font-size: clamp(1rem, 11cqw, 3.4rem); }
.grid.n6 .cell { font-size: clamp(0.95rem, 4dvh, 1.45rem); font-size: clamp(0.95rem, 7.5cqw, 2.4rem); }
.cell.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); transform: scale(1.06); z-index: 1; }
.cell.w { background: var(--chip); border-width: 3px; }
.cell.w1 { border-color: var(--c3); } .cell.w2 { border-color: var(--c4); } .cell.w3 { border-color: var(--c2); } .cell.w4 { border-color: var(--c1); } .cell.w5 { border-color: var(--c5); }
.cell.no { background: var(--bad-bg); border-color: var(--bad); border-width: 3px; }
.cell.hint { animation: wt-pulse 1s ease-in-out infinite; border-color: var(--mark); }
@keyframes wt-pulse { 50% { transform: scale(0.88); } }
.cell:focus-visible { outline: 3px solid var(--mark); outline-offset: 1px; }
.cell:disabled { cursor: default; }
.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.trail polyline { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }
.trail .now { stroke: var(--accent); }
.trail .w1 { stroke: var(--c3); } .trail .w2 { stroke: var(--c4); } .trail .w3 { stroke: var(--c2); } .trail .w4 { stroke: var(--c1); } .trail .w5 { stroke: var(--c5); } .trail .no { stroke: var(--bad); }
.spell-row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.spell { flex: 1 1 auto; margin: 0; text-align: center; font-family: "Fredoka", var(--font); font-size: 1.5rem; letter-spacing: 0.18em; color: var(--accent); min-height: 1.2em; text-transform: uppercase; line-height: 1.2; }
.spell-row button {
  font: inherit; font-weight: 700; font-size: 0.95rem; min-height: 40px; min-width: 44px; padding: 0 12px; border-radius: 12px; cursor: pointer;
  border: 2px solid var(--line); background: var(--key); color: var(--ink); touch-action: manipulation;
}
.result { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; text-align: center; }
.big { font-family: "Fredoka", var(--font); font-size: 1.6rem; margin: 0; line-height: 1.1; text-align: center; }
.stars { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 1.1rem; }
.stars svg { width: 22px; height: 22px; fill: var(--mark); }
.words { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%; }
.wd {
  display: inline-flex; align-items: center; gap: 5px; border: 2px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 7px;
  font-weight: 700; font-size: 1rem; background: var(--key); color: var(--ink); letter-spacing: 0.03em; line-height: 1.2;
}
.wd .e { font-size: 1.15rem; line-height: 1; }
.wd .dash { font-family: ui-monospace, Menlo, monospace; letter-spacing: 0.12em; }
.wd.now { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.wd.ok { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.wd.w1 { border-color: var(--c3); } .wd.w2 { border-color: var(--c4); } .wd.w3 { border-color: var(--c2); } .wd.w4 { border-color: var(--c1); } .wd.w5 { border-color: var(--c5); }
.wd.no { border-color: var(--bad); color: var(--bad); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row2 { display: flex; gap: 8px; width: 100%; }
.more {
  flex: 1 1 0; font: inherit; font-weight: 700; font-size: 0.95rem; color: var(--ink); background: transparent;
  border: 2px solid var(--accent); border-radius: 999px; min-height: 44px; padding: 0 12px; cursor: pointer; white-space: nowrap;
}
.more:disabled { opacity: 0.45; cursor: default; }
.next { font: inherit; font-size: 1.2rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(48px, 7dvh, 64px); cursor: pointer; width: 100%; }
.seg.topics { grid-template-columns: repeat(3, 1fr); }
.seg.topics button { font-size: 0.85rem; padding: 6px 4px; }

/* Short phones: a smaller grid and tighter rows. */
@media (max-height: 700px) and (orientation: portrait) {
  .gridwrap { width: min(100%, 36dvh); width: min(100%, 100cqh); }
  .grid { gap: 4px; }
  .spell { font-size: 1.2rem; }
  .spell-row button { min-height: 36px; }
  .wd { font-size: 0.9rem; padding: 3px 8px 3px 6px; }
  .more, .next { min-height: 40px; }
  .problem-card { gap: 6px; padding: 10px 12px; }
}
/* Landscape: the grid keeps the card, the word list and buttons sit on the right. */
@media (orientation: landscape) and (min-width: 640px) {
  .gridwrap { width: min(100%, 46dvh); width: min(100%, 100cqh); }
  .grid { gap: 4px; }
  .spell { font-size: 1.2rem; }
  .spell-row button { min-height: 36px; }
  .problem-card { gap: 6px; }
  .words { justify-content: flex-start; }
}
/* Phone landscape: a tighter card so the grid gets the height. */
@media (orientation: landscape) and (min-width: 640px) and (max-height: 500px) {
  .problem-card { padding: 8px 12px; gap: 4px; }
}
@media print {
  .loopy-sheet .ws-tg { border-collapse: collapse; margin-top: 1mm; }
  .loopy-sheet .ws-tg td { width: 5.6mm; height: 5.6mm; padding: 0; border: 0.3mm solid #000; text-align: center; font-size: 10pt; font-weight: 600; line-height: 1; }
  .loopy-sheet .ws-tg.n4 td { width: 6.5mm; height: 6.5mm; font-size: 11pt; }
  .loopy-sheet .ws-find { font-size: 11pt; font-weight: 600; margin-top: 0.5mm; letter-spacing: 0.05em; }
  .loopy-sheet .ws-find .ws-pic { font-size: 14pt; margin-right: 1mm; }
}

<body>

<div class="wrap">
  <header class="game-bar">
    <a class="home-link" href="../../">&larr; loopy</a>
    <div class="bar-right">
      <span id="star-chip"></span>
      <button type="button" id="settings-toggle" aria-controls="settings-panel"></button>
    </div>
  </header>
  <section class="top" aria-labelledby="title">
    <h1 id="title" data-t="wtName">Word Trail</h1>
    <div class="score" aria-live="polite">
      <div class="pill pill-score"><span data-t="score">Score</span><b id="score">0 / 0</b></div>
      <div id="level"></div>
      <div class="pill pill-streak"><span data-t="streak">Streak</span><b id="streak">0</b></div>
      <div id="last5" data-game="word-trail"></div>
    </div>
  </section>
  <div class="settings-panel" id="settings-panel" hidden>
    <div class="controls"><div id="age-picker"></div><div id="theme-picker"></div><button id="sound-toggle"></button><div id="lang-picker"></div></div>
    <div>
      <p class="seg-label" id="words-label" data-t="wtWords">Words in</p>
      <div class="seg two" role="group" aria-labelledby="words-label" id="words-seg">
        <button type="button" data-words="en">English</button>
        <button type="button" data-words="de">Deutsch</button>
      </div>
    </div>
    <div>
      <p class="seg-label" id="topic-label" data-t="wtTopic">Topic</p>
      <div class="seg topics" role="group" aria-labelledby="topic-label" id="topic-seg"></div>
    </div>
    <div>
      <p class="seg-label" id="level-label" data-t="wtLevel">Level</p>
      <div class="seg five" role="group" aria-labelledby="level-label" id="level-seg">
        <button type="button" data-level="1" data-t="wtL1">4 × 4, straight</button>
        <button type="button" data-level="2" data-t="wtL2">5 × 5, one bend</button>
        <button type="button" data-level="3" data-t="wtL3">6 × 6, bends</button>
        <button type="button" data-level="4" data-t="wtL4">6 × 6, 5 words</button>
        <button type="button" data-level="5" data-t="wtL5">6 × 6, long words</button>
      </div>
    </div>
    <div class="panel-foot">
      <p data-t="wtKbd">Keyboard works too: arrows move, Space or Enter picks a letter, Enter checks, Backspace goes back.</p>
      <button type="button" class="reset" id="reset" data-t="resetScore">Reset score</button>
    </div>
  </div>

  <main class="play">
    <div class="problem-card" id="card">
      <div class="topic-row"><div class="topic" id="topic"></div><span class="found" id="found"></span></div>
      <div class="gridbox"><div class="gridwrap" id="letters">
        <div class="grid" id="grid" role="group" aria-labelledby="topic"></div>
        <svg class="trail" id="trail" aria-hidden="true"></svg>
      </div></div>
      <div class="spell-row" id="spell-row">
        <button type="button" id="k-erase" data-t="wtClear" data-t-aria="wtClearAria">Clear</button>
        <p class="spell" id="spell"></p>
      </div>
      <div class="result" id="result" hidden></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
    </div>
    <div class="side">
      <div class="words" id="wordlist"></div>
      <div class="row2"><button type="button" class="more" id="more"></button></div>
      <button type="button" class="next" id="next" hidden></button>
    </div>
  </main>
</div>

    if (c) c.focus({ preventScroll: true });
  }
  function check() {
    if (answered) return;
    const s = trail.map(i => grid.cells[i]).join("");
    if (trail.length < 3) { say(t("wtShort")); clear(); backToLetters(); return; }
    const hit = grid.words.find(w => !w.done && lower(w.e.word) === s);
    if (hit) { success(hit, trail.slice()); return; }
    const old = grid.words.find(w => w.done && lower(w.e.word) === s);
    if (old) { say(t("wtAlready", { w: old.e.word })); clear(); backToLetters(); return; }
    miss(s);
  }
  // A word on the list, found: it keeps its colour. Any word on the list counts, not only the one with the ring.
  function success(w, path) {
    w.done = true; w.ok = true; w.shown = path;
    tried++; right++; streak++;
    trail = [];
    const g = grid;
    Loopy.rewards.correct(GAME, streak, kind(w));
    // A level up by itself (Loopy.levels) has started a new grid already.
    if (grid !== g) return;
    feedbackEl.className = "feedback good";
    feedbackEl.textContent = t("wtGot", { w: w.e.word });
    if (w !== target) { render(); return; }
    if (remaining().length) { const fb = feedbackEl.textContent; newQuestion(); feedbackEl.className = "feedback good"; feedbackEl.textContent = fb; }
    else summary();
  }
  // Not a word on the list: the word being looked for shows where it was, in red, and counts as a miss.
  function miss(s) {
    const w = target;
    w.done = true; w.ok = false; w.shown = w.path;
    tried++; streak = 0; answered = true; trail = [];
    Loopy.rewards.wrong(GAME, { q: themeName(grid.theme) + " " + w.e.pic, a: w.e.word, y: s, k: kind(w), r: w.e.key });
    card.classList.add("bad");
    feedbackEl.className = "feedback bad";
    feedbackEl.textContent = t("wtNotList", { w: w.e.word });
    render();
    nextBtn.focus({ preventScroll: true });
  }
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  // Every word in the grid is done: a line with the count and the stars, and Next grid.
  function summary() {
    answered = true;
    const ok = grid.words.filter(w => w.ok).length, n = grid.words.length;
    if (ok === n) card.classList.add("good");
    resultEl.textContent = "";
    resultEl.appendChild(el("h2", "big", ok === n ? t("wtAllDone", { n: Loopy.num(n) }) : t("wtSomeDone", { r: Loopy.num(ok), n: Loopy.num(n) })));
    const stars = el("div", "stars");
    stars.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
    stars.appendChild(document.createTextNode(t("wtStars", { n: Loopy.num(ok) })));
    resultEl.appendChild(stars);
    resultEl.hidden = false;
    feedbackEl.textContent = "";
    render();
    nextBtn.focus({ preventScroll: true });
    Loopy.speech.read();
  }
  function next() {
    if (!answered) return;
    if (remaining().length) newQuestion();
    else { grid = null; newQuestion(); }
  }
  // A clue: the picture and first letter in the list (when hidden), then the first box pulses, then the whole trail
  // shows and the word counts as a miss.
  function clue() {
    if (answered) return;
    clues++;
    if (clues >= maxClues()) { miss("💡"); return; }
    render();
    Loopy.speech.read();
  }

  nextBtn.addEventListener("click", next);
  moreBtn.addEventListener("click", clue);
  eraseBtn.addEventListener("click", () => { if (trail.length) { trail.pop(); render(); } });
  wordsBtns.forEach(b => b.addEventListener("click", () => { wordsLang = b.dataset.words; store.set("wt.words", wordsLang); recent = []; grid = null; newQuestion(); }));
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; store.set("wt.level.a" + age, level); recent = []; grid = null; newQuestion(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; grid = null; loadForAge(); newQuestion(); });
  window.addEventListener("resize", () => { if (grid) drawTrail(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; grid = null; Loopy.recent.clear(GAME); newQuestion(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.ctrlKey || e.metaKey || e.altKey || document.querySelector(".loopy-cheer.big")) return;
    const b = e.target.closest("button"), cell = b && b.classList.contains("cell") ? b : null;
    // Arrows move between the boxes; the box in focus is the only one in the Tab order.
    if (cell && /^Arrow/.test(e.key)) {
      const n = grid.n, i = +cell.dataset.i, r = Math.floor(i / n), c = i % n;
      const to = e.key === "ArrowRight" ? [r, c + 1] : e.key === "ArrowLeft" ? [r, c - 1] : e.key === "ArrowDown" ? [r + 1, c] : [r - 1, c];
      if (to[0] >= 0 && to[1] >= 0 && to[0] < n && to[1] < n) { cell.tabIndex = -1; const nb = gridEl.children[to[0] * n + to[1]]; nb.tabIndex = 0; nb.focus(); }
      e.preventDefault();
      return;
    }
    if (e.key === "Enter") {
      // Buttons act on their own (Next, Clue, Clear, Settings, a box); Enter elsewhere checks the trail or goes on.
      if (b || e.target.closest("#settings-panel")) return;
      answered ? next() : check();
      e.preventDefault();
      return;
    }
    if (e.key === "Backspace" && !answered) { if (trail.length) { trail.pop(); render(); } e.preventDefault(); }
    if (e.key === "Escape" && !answered) clear();
  });

  // Read aloud: the words to find while they are shown, otherwise the topic and the length of the next word.
  Loopy.speech.question({ host: card, lang: () => wordsLang, text: () => {
    if (!grid) return "";
    if (answered && !remaining().length) return t(grid.words.every(w => w.ok) ? "wtAllDone" : "wtSomeDone", { n: Loopy.num(grid.words.length), r: Loopy.num(grid.words.filter(w => w.ok).length) });
    const left = remaining();
    if (level <= 2 || (level === 3 && left.length)) return t("wtRead", { w: left.map(w => w.e.word).join(", ") });
    return t("wtReadHidden", { t: themeName(grid.theme), n: Loopy.num(left.length), l: Loopy.num(target.e.letters.length) });
  } });

  // Print worksheet: 20 small grids, one word hidden in each, with the picture (and the word at the easy levels) under it.
  Loopy.worksheet({
    title: () => t("wtName"),
    level: () => [t("ageLabel", { n: age }), t("wtLevel") + ": " + t("wtL" + level), t("wtWords") + ": " + (wordsLang === "de" ? "Deutsch" : "English")].join(" · "),
    how: () => t("wtHow"),
    layout: "word",
    make: (n) => {
      const list = [], used = [], L = lv();
      const one = { n: L.n, words: 1, min: L.min, max: L.max, bend: L.bend };
      for (let i = 0; i < n; i++) {
        const g = makeGrid(wordsLang, one, topic, used, null);
        used.push(g.words[0].e.key);
        list.push(g);
      }
      return list;
    },
    cell: (g) => {
      const box = document.createElement("div"), tbl = el("table", "ws-tg n" + g.n), w = g.words[0];
      for (let r = 0; r < g.n; r++) {
        const tr = document.createElement("tr");
        for (let c = 0; c < g.n; c++) tr.appendChild(el("td", "", g.cells[r * g.n + c].toUpperCase()));
        tbl.appendChild(tr);
      }
      box.appendChild(tbl);
      const find = el("div", "ws-find");
      find.appendChild(el("span", "ws-pic", w.e.pic));
      find.appendChild(document.createTextNode(level <= 2 ? w.e.word : w.e.word[0].toUpperCase() + " _".repeat(w.e.letters.length - 1)));
      box.appendChild(find);
      return box;
    },
    answer: (g) => { const w = g.words[0], i = w.path[0]; return w.e.pic + " " + w.e.word + " (" + t("wtAnsAt", { r: Loopy.num(Math.floor(i / g.n) + 1), c: Loopy.num(i % g.n + 1) }) + ")"; }
  });

  newQuestion();
})();
</script>
</body>
</html>
