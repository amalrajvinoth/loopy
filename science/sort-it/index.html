/* Layout: a picture and a question, answer buttons below. Shared look with the other games. */

  const sets = only ? [only] : TOPICS[topic] || TOPICS.all;
  const list = ALL.filter(x => sets.includes(x.set) && x.level <= level);
  return list.length ? list : ALL.filter(x => sets.includes(x.set) && x.level <= 3);
}
// One of them, with its group and 2 or 3 other groups of the same set to pick from.
// seen: the keys shown before, newest last. A thing not shown lately comes first, so every thing comes round before
// one comes back. While something else is left, it also skips a picture or name from the last 10 (Water is in two
// sets) and a third question of the same kind in a row.
function makeProblem(lang, topic, level, nChoices, only, seen) {
  seen = seen || [];
  const list = thingsFor(topic, level, only);
  const last = seen.slice(-10), shown = last.map(k => BY_KEY[k]).filter(Boolean);
  const looks = new Set(shown.flatMap(x => [x.pic, x.en.name]));
  const n = shown.length, run = n > 1 && shown[n - 1].set === shown[n - 2].set ? shown[n - 1].set : "";
  const keep = (arr, ok) => { const out = arr.filter(ok); return out.length ? out : arr; };
  let pool = keep(list, x => !last.includes(x.key));
  pool = keep(pool, x => !looks.has(x.pic) && !looks.has(x.en.name));
  pool = keep(pool, x => x.set !== run);
  // Never shown (or not in seen any more) first; otherwise one of the quarter shown longest ago.
  const when = (x) => seen.lastIndexOf(x.key);
  const unseen = pool.filter(x => when(x) < 0);
  const thing = unseen.length ? pick(unseen) : pick(pool.sort((a, b) => when(a) - when(b)).slice(0, Math.max(1, pool.length >> 2)));
  const others = shuffle(GROUPS[thing.set].filter(g => g !== thing.group)).slice(0, nChoices - 1);
  const options = shuffle([thing.group, ...others]);
  return { thing, text: thing[lang], options, key: thing.key, answer: thing.group };
}
// GEN END

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), picEl = $("pic"), nameEl = $("name"), qEl = $("question"), choicesEl = $("choices"), feedbackEl = $("feedback"), nextBtn = $("next");
  const topicBtns = [...document.querySelectorAll("#topic-seg button")];
  const levelBtns = [...document.querySelectorAll("#level-seg button")];
  const t = Loopy.t, lang = Loopy.lang === "de" ? "de" : "en";
  const groupName = (g) => t("so_" + g);
  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = Loopy.getAge();
  let topic = store.get("so.topic", "all", Object.keys(TOPICS));
  // Opened from the grown-ups' page to practise one set (#practise=so-animal): just that set for this visit, without saving.
  let only = "";
  { const m = /^so-([a-z]+)$/.exec(Loopy.log.hint || ""); if (m && GROUPS[m[1]]) { only = m[1]; topic = Object.keys(TOPICS).find(k => k !== "all" && TOPICS[k].includes(only)); Loopy.log.hint = ""; } }
  let level;
  // The level is remembered per age, so each age starts at the right level.
  const levelForAge = (a) => a <= 7 ? 1 : a === 8 ? 2 : a <= 10 ? 3 : 4;
  // Ages 6 to 8 pick from 3 groups, 9 and up from 4.
  const choicesForAge = (a) => a <= 8 ? 3 : 4;
  function loadForAge() { level = store.get("so.level.a" + age, levelForAge(age), [1, 2, 3, 4]); }
  loadForAge();
  Loopy.levels.init({ names: ["soL1", "soL2", "soL3", "soL4"],
    get: () => level - 1, base: () => levelForAge(age) - 1,
    set: (i) => { level = i + 1; store.set("so.level.a" + age, level); render(); } });
  let right = 0, tried = 0, streak = 0;
  let current = null, answered = false, recent = [];
  // The last 60 things shown, newest last, kept for the next visit too, so a thing does not come straight back when
  // the child plays again. Saved as each thing's place in THINGS, in base 36 ("3k.1b.a"). Not in stars codes, to keep
  // them short: on a new device it starts again.
  const SEEN = 60, SEEN_KEY = "so-seen";
  let seen = [];
  try {
    const v = Loopy.store.get(SEEN_KEY);
    if (typeof v === "string" && v.length < 400) seen = v.split(".").filter(c => /^[0-9a-z]{1,2}$/.test(c)).map(c => ALL[parseInt(c, 36)]).filter(Boolean).map(x => x.key).slice(-SEEN);
  } catch (e) { seen = []; }
  function remember(key) {
    seen.push(key);
    while (seen.length > SEEN) seen.shift();
    Loopy.store.set(SEEN_KEY, seen.map(k => (+/\d+$/.exec(k)[0]).toString(36)).join("."));
  }

  function render() {
    Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    topicBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.topic === topic)));
    levelBtns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.level === level)));
    Loopy.nextButton(nextBtn, answered);
  }
  // Try again: a missed thing comes back later (Loopy.retry). The note is "animal3" (the thing's key); a thing
  // the topic and level set now would not ask waits. The groups are mixed the way makeProblem does it.
  const note = (p) => p.key;
  function rebuild(r) {
    if (!/^[a-z]{4,8}\d{1,3}$/.test(r)) return null;
    const thing = thingsFor(topic, level, only).find(x => x.key === r);
    if (!thing) return null;
    const others = shuffle(GROUPS[thing.set].filter(g => g !== thing.group)).slice(0, choicesForAge(age) - 1);
    return { thing, text: thing[lang], options: shuffle([thing.group, ...others]), key: thing.key, answer: thing.group };
  }

  function newRound() {
    // Nothing back within 20, or, when the topic has fewer things (Space has 11), before all the others.
    const keep = Math.max(1, Math.min(20, thingsFor(topic, level, only).length - 1));
    current = Loopy.retry.fresh("sort-it", recent, () => makeProblem(lang, topic, level, choicesForAge(age), only, seen), rebuild, keep);
    remember(current.key);
    answered = false;
    picEl.textContent = current.thing.pic;
    nameEl.textContent = current.text.name;
    qEl.textContent = t("soQ_" + current.thing.set);
    choicesEl.textContent = "";
    choicesEl.classList.toggle("three", current.options.length === 3);
    current.options.forEach((g, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.id = "choice-" + i; b.textContent = groupName(g);
      b.dataset.correct = String(g === current.answer);
      b.addEventListener("click", () => choose(b));
      choicesEl.appendChild(b);
    });
    card.classList.remove("good", "bad");
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    render();
    Loopy.speech.read();
  }
  function choose(btn) {
    if (answered) return;
    answered = true; tried++;
    const ok = btn.dataset.correct === "true";
    [...choicesEl.children].forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === "true") b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    if (ok) { right++; streak++; } else { streak = 0; }
    // The progress page keeps 40 letters of the question.
    const q = (current.thing.pic + " " + current.text.name).slice(0, 40);
    if (ok) Loopy.rewards.correct("sort-it", streak);
    else Loopy.rewards.wrong("sort-it", { q, a: groupName(current.answer), y: btn.textContent, k: "so-" + current.thing.set, r: note(current) });
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    // One line of why after every answer; after a wrong one, the right group first.
    feedbackEl.appendChild(document.createTextNode((ok ? "" : t("soAnswerIs", { a: groupName(current.answer) }) + " ") + current.text.why));
    render();
    nextBtn.focus({ preventScroll: true });
  }

  nextBtn.addEventListener("click", newRound);
  topicBtns.forEach(b => b.addEventListener("click", () => { topic = b.dataset.topic; only = ""; store.set("so.topic", topic); recent = []; newRound(); }));
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; store.set("so.level.a" + age, level); newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("sort-it"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") { newRound(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !answered) { const b = choicesEl.children[n - 1]; if (b) choose(b); }
  });

  // Read aloud: "A dolphin. Which kind of animal is it? Fish, mammal, bird or reptile?"
  Loopy.speech.question({ host: card, text: () => {
    const o = current.options.map(groupName);
    return t("soReadQ", { name: current.text.name, q: t("soQ_" + current.thing.set), list: o.slice(0, -1).join(", ") + " " + t("orWord") + " " + o[o.length - 1] });
  } });

  // Print worksheet: 20 things at the game's topic and level, each with the groups to circle.
  const part = (cls, text) => { const n = document.createElement("span"); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  const TOPIC_KEYS = { all: "soAll", animals: "soAnimals", matter: "soMatter", food: "soFood", space: "soSpace", senses: "soSenses" };
  Loopy.worksheet({
    title: () => t("soName"),
    level: () => [t("ageLabel", { n: age }), t("soTopic") + ": " + t(TOPIC_KEYS[topic]), t("soLevel") + ": " + t("soL" + level)].join(" · "),
    how: () => t("soHow"),
    layout: "line",
    make: (n) => { const list = [], keys = []; while (list.length < n) { const p = makeProblem(lang, topic, level, choicesForAge(age), only, keys); keys.push(p.key); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-so";
      const q = part("ws-q");
      q.appendChild(part("", p.thing.pic));
      q.appendChild(document.createTextNode(p.text.name));
      box.appendChild(q);
      const opts = part("ws-opts");
      p.options.forEach(g => opts.appendChild(part("", groupName(g))));
      box.appendChild(opts);
      return box;
    },
    answer: (p) => p.thing.pic + " " + p.text.name + ": " + groupName(p.answer)
  });

  newRound();
})();
</script>
