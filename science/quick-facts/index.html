/* Layout: a picture and a question, answer buttons below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

/* Vertical problem, written like the worksheets: operator on the left, digits right-aligned. */
.vert {
  display: grid; grid-template-columns: auto auto; column-gap: 0.35em;
  font-size: clamp(3.4rem, 15vw, 4.6rem); font-weight: 600; line-height: 1.12;
  font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
}
.vert .num { grid-column: 2; text-align: right; min-width: 3ch; }
.vert .op { grid-column: 1; grid-row: 2; color: var(--accent); }
.vert .rule { grid-column: 1 / -1; height: 0.07em; background: var(--ink); border-radius: 2px; margin: 0.1em 0 0.12em; }
.vert .ans {
  grid-column: 2; text-align: right; min-width: 3ch; min-height: 1.12em;
  color: var(--accent); position: relative;
}
.vert .ans.empty::after {
  content: ""; position: absolute; right: 0; bottom: 0.12em; width: 0.55em; height: 0.07em;
  background: var(--mark); border-radius: 2px; animation: blink 1s steps(2, start) infinite;
}
.problem-card.good .ans { color: var(--good); }
.problem-card.bad .ans { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.06em; }
@keyframes blink { to { visibility: hidden; } }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .erase { font-size: 1.15rem; color: var(--muted); }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .pad button { min-height: 64px; font-size: 1.8rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .vert .ans.empty::after { animation: none; }
}

<script>
Loopy.addStrings({
  en: {
    qfName: "Quick Facts", qfTopic: "Topic", qfLevel: "Level", qfAll: "All", qfSpace: "Space", qfAnimals: "Animals", qfBody: "Body",
    qfL1: "Starter", qfL2: "Explorer", qfL3: "Expert",
    qfKbd: "Keyboard works too: 1 to 4 picks an answer, Enter goes on.",
    qfAnswerIs: "The answer is: {a}.", qfReadQ: "{q} Is it {list}?",
    qfHow: "Read each question. Circle the right answer."
  },
  de: {
    qfName: "Blitzwissen", qfTopic: "Thema", qfLevel: "Stufe", qfAll: "Alle", qfSpace: "Weltall", qfAnimals: "Tiere", qfBody: "Körper",
    qfL1: "Einsteiger", qfL2: "Entdecker", qfL3: "Profi",
    qfKbd: "Die Tastatur geht auch: 1 bis 4 wählt eine Antwort, Enter geht weiter.",
    qfAnswerIs: "Die Antwort ist: {a}.", qfReadQ: "{q} Ist es {list}?",
    qfHow: "Lies jede Frage. Kreise die richtige Antwort ein."
  }
});

const TOPICS = Object.keys(FACTS);
const randInt = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randInt(arr.length)];
const shuffle = (arr) => arr.slice().sort(() => Math.random() - 0.5);
// One fact as { pic, level, topic, key, en: {q, a, wrong, why}, de: {...} }. The key is the topic and its place in the list.
const ALL = TOPICS.flatMap(topic => FACTS[topic].map((f, i) => {
  const lang = (x) => ({ q: x[0], a: x[1], wrong: x[2], why: x[3] });
  return { pic: f[0], level: f[1], topic, key: topic + i, en: lang(f[2]), de: lang(f[3]) };
}));

// level 1: level 1 facts, 3 answers. Level 2: levels 1 and 2, 4 answers. Level 3: all facts, 4 answers.
function makeProblem(lang, topic, level, avoid) {
  const list = ALL.filter(f => (topic === "all" || f.topic === topic) && f.level <= level);
  let fact = pick(list);
  for (let tries = 0; tries < 40 && avoid && avoid.includes(fact.key); tries++) fact = pick(list);
  const text = fact[lang];
  const options = shuffle([text.a, ...shuffle(text.wrong).slice(0, level === 1 ? 2 : 3)]);
  return { fact, text, options, key: fact.key, answer: text.a };
}

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), picEl = $("pic"), qEl = $("question"), choicesEl = $("choices"), feedbackEl = $("feedback"), nextBtn = $("next");
  const topicBtns = [...document.querySelectorAll("#topic-seg button")];
  const levelBtns = [...document.querySelectorAll("#level-seg button")];
  const t = Loopy.t, lang = Loopy.lang === "de" ? "de" : "en";
  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(Loopy.store.get(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { Loopy.store.set(k, JSON.stringify(v)); }
  };

  let age = Loopy.getAge();
  let topic = store.get("qf.topic", "all", ["all", ...TOPICS]);
  // Opened from the grown-ups' page to practise one topic: set it for this visit, without saving.
  { const m = /^qf-([a-z]+)$/.exec(Loopy.log.hint || ""); if (m && TOPICS.includes(m[1])) { topic = m[1]; Loopy.log.hint = ""; } }
  let level;
  // The level is remembered per age, so each age starts at the right level.
  const levelForAge = (a) => a <= 8 ? 1 : a <= 10 ? 2 : 3;
  function loadForAge() { level = store.get("qf.level.a" + age, levelForAge(age), [1, 2, 3]); }
  loadForAge();
  Loopy.levels.init({ names: ["qfL1", "qfL2", "qfL3"],
    get: () => level - 1, base: () => levelForAge(age) - 1,
    set: (i) => { level = i + 1; store.set("qf.level.a" + age, level); render(); } });
  let right = 0, tried = 0, streak = 0;
  let current = null, answered = false, recent = [];

  function render() {
    Loopy.levels.render();
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    topicBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.topic === topic)));
    levelBtns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.level === level)));
    Loopy.nextButton(nextBtn, answered);
  }
  // Try again: a missed fact comes back later (Loopy.retry). The note is "en:space3" (the page language and the
  // fact's key); a fact outside the topic or level set now, or asked in the other language, waits.
  const note = (p) => lang + ":" + p.key;
  function rebuild(r) {
    const m = /^(en|de):([a-z]{3,8}\d{1,2})$/.exec(r);
    if (!m || m[1] !== lang) return null;
    const fact = ALL.find(f => f.key === m[2] && (topic === "all" || f.topic === topic) && f.level <= level);
    if (!fact) return null;
    const text = fact[lang];
    const options = shuffle([text.a, ...shuffle(text.wrong).slice(0, level === 1 ? 2 : 3)]);
    return { fact, text, options, key: fact.key, answer: text.a };
  }

  function newRound() {
    current = Loopy.retry.fresh("quick-facts", recent, () => makeProblem(lang, topic, level), rebuild, 20);
    answered = false;
    picEl.textContent = current.fact.pic;
    qEl.textContent = current.text.q;
    choicesEl.textContent = "";
    choicesEl.classList.toggle("three", current.options.length === 3);
    current.options.forEach((a, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.id = "choice-" + i; b.textContent = a;
      b.dataset.correct = String(a === current.answer);
      b.addEventListener("click", () => choose(b));
      choicesEl.appendChild(b);
    });
    card.classList.remove("good", "bad");
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    render();
    Loopy.speech.read();
  }
  function choose(btn) {
    if (answered) return;
    answered = true; tried++;
    const ok = btn.dataset.correct === "true";
    [...choicesEl.children].forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === "true") b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    if (ok) { right++; streak++; } else { streak = 0; }
    // The progress page keeps 40 letters of the question.
    const q = current.text.q.length > 40 ? current.text.q.slice(0, 39) + "…" : current.text.q;
    if (ok) Loopy.rewards.correct("quick-facts", streak, "qf-" + current.fact.topic);
    else Loopy.rewards.wrong("quick-facts", { q, a: current.answer, y: btn.textContent, k: "qf-" + current.fact.topic, r: note(current) });
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    // One line of why after every answer; after a wrong one, the right answer first.
    feedbackEl.appendChild(document.createTextNode((ok ? "" : t("qfAnswerIs", { a: current.answer }) + " ") + current.text.why));
    render();
    nextBtn.focus({ preventScroll: true });
  }

  nextBtn.addEventListener("click", newRound);
  topicBtns.forEach(b => b.addEventListener("click", () => { topic = b.dataset.topic; store.set("qf.topic", topic); recent = []; newRound(); }));
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; store.set("qf.level.a" + age, level); newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("quick-facts"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") { newRound(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !answered) { const b = choicesEl.children[n - 1]; if (b) choose(b); }
  });

  // Read aloud: "Which planet do we live on? Is it Mars, Earth, Venus or Jupiter?"
  Loopy.speech.question({ host: card, text: () => {
    const o = current.options;
    return t("qfReadQ", { q: current.text.q, list: o.slice(0, -1).join(", ") + " " + t("orWord") + " " + o[o.length - 1] });
  } });

  // Print worksheet: 20 questions at the game's level and topic, each with its answers to circle.
  const part = (cls, text) => { const n = document.createElement("span"); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  const TOPIC_KEYS = { all: "qfAll", space: "qfSpace", animals: "qfAnimals", body: "qfBody" };
  Loopy.worksheet({
    title: () => t("qfName"),
    level: () => [t("ageLabel", { n: age }), t("qfTopic") + ": " + t(TOPIC_KEYS[topic]), t("qfLevel") + ": " + t("qfL" + level)].join(" · "),
    how: () => t("qfHow"),
    layout: "line",
    make: (n) => { const list = [], keys = []; while (list.length < n) { const p = makeProblem(lang, topic, level, keys); keys.push(p.key); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-qf";
      const q = part("ws-q");
      q.appendChild(part("", p.fact.pic));
      q.appendChild(document.createTextNode(p.text.q));
      box.appendChild(q);
      const opts = part("ws-opts");
      p.options.forEach(a => opts.appendChild(part("", a)));
      box.appendChild(opts);
      return box;
    },
    answer: (p) => p.fact.pic + " " + p.answer
  });

  newRound();
})();
</script>
</body>
</html>
