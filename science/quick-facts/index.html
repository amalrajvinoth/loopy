<style>
/* Layout: a picture and a question, answer buttons below. Shared look with the other games. */
:root {
  --bg: #f3f6fb;
  --card: #ffffff;
  --ink: #1d2a3f;
  --muted: #5d6b82;
  --line: #d5dde9;
  --accent: #2457c5;
  --accent-ink: #ffffff;
  --mark: #e2622b;
  --good: #1f8a4c;
  --good-bg: #e3f5ea;
  --bad: #c23a3a;
  --bad-bg: #fbe6e6;
  --chip: #e6ecf6;
  --key: #ffffff;
  --font: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; text-wrap: balance; }
.score { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 1rem; white-space: nowrap; }
.pill span { color: var(--muted); font-weight: 400; margin-right: 4px; }

.settings { display: flex; flex-direction: column; gap: 8px; }
.seg-label { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 4px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--chip); padding: 5px; border-radius: 14px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  font: inherit; font-size: 0.95rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 10px; padding: 8px 6px; min-height: 44px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }

.problem-card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.problem-card.good { border-color: var(--good); box-shadow: 0 0 0 2px var(--good) inset; }
.problem-card.bad { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad) inset; }

/* Vertical problem, written like the worksheets: operator on the left, digits right-aligned. */
.vert {
  display: grid; grid-template-columns: auto auto; column-gap: 0.35em;
  font-size: clamp(3.4rem, 15vw, 4.6rem); font-weight: 600; line-height: 1.12;
  font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
}
.vert .num { grid-column: 2; text-align: right; min-width: 3ch; }
.vert .op { grid-column: 1; grid-row: 2; color: var(--accent); }
.vert .rule { grid-column: 1 / -1; height: 0.07em; background: var(--ink); border-radius: 2px; margin: 0.1em 0 0.12em; }
.vert .ans {
  grid-column: 2; text-align: right; min-width: 3ch; min-height: 1.12em;
  color: var(--accent); position: relative;
}
.vert .ans.empty::after {
  content: ""; position: absolute; right: 0; bottom: 0.12em; width: 0.55em; height: 0.07em;
  background: var(--mark); border-radius: 2px; animation: blink 1s steps(2, start) infinite;
}
.problem-card.good .ans { color: var(--good); }
.problem-card.bad .ans { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 0.06em; }
@keyframes blink { to { visibility: hidden; } }

.feedback { min-height: 3.1em; text-align: center; font-size: 1.1rem; line-height: 1.45; margin: 0; max-width: 34ch; }
.feedback strong { display: block; font-size: 1.45rem; }
.feedback.good strong { color: var(--good); }
.feedback.bad strong { color: var(--bad); }
.feedback .hint { color: var(--muted); }

.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad button {
  font: inherit; font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink);
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: 72px; cursor: pointer;
  transition: transform .08s ease, border-color .15s ease;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.pad button:hover:not(:disabled) { border-color: var(--accent); }
.pad button:active:not(:disabled) { transform: scale(0.96); }
.pad button:disabled { opacity: 0.4; cursor: default; }
.pad .erase { font-size: 1.15rem; color: var(--muted); }
.pad .go { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 1.35rem; }
.pad .go:hover:not(:disabled) { border-color: var(--accent); filter: brightness(1.08); }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.foot p { margin: 0; color: var(--muted); font-size: 0.9rem; }
.reset { font: inherit; font-size: 0.95rem; color: var(--muted); background: transparent; border: 2px solid var(--line); border-radius: 14px; padding: 0 16px; min-height: 44px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--mark); outline-offset: 3px; }

@media (max-width: 420px) {
  h1 { font-size: 1.35rem; }
  .pad button { min-height: 64px; font-size: 1.8rem; }
  .seg button { font-size: 0.85rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .vert .ans.empty::after { animation: none; }
}

<style>
/* Phones and tablets: the game fills one screen; settings sit behind a button. */
body { min-height: 100vh; min-height: 100dvh; padding-block: 12px 16px; }
.wrap { gap: 12px; }
.game-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bar-right { display: flex; align-items: center; gap: 8px; }
.top { gap: 8px 12px; }
.play { display: flex; flex-direction: column; gap: 12px; -webkit-user-select: none; user-select: none; }
@media (min-width: 600px) and (orientation: portrait) { .wrap { max-width: 640px; } }
@media (orientation: landscape) and (min-width: 640px) {
  .wrap { max-width: 1100px; }
  .play { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center; }
}

.problem-card { padding: 14px 14px 12px; gap: 8px; }
.vert { font-size: clamp(2.4rem, min(15vw, 8.5vh), 5rem); font-size: clamp(2.4rem, min(15vw, 8.5dvh), 5rem); }
.feedback { min-height: 2.9em; font-size: 1.05rem; }
.feedback strong { font-size: 1.3rem; }
.pad { gap: 8px; }
.pad button { min-height: clamp(50px, 8vh, 92px); min-height: clamp(50px, 8dvh, 92px); }
@media (min-width: 600px) and (orientation: portrait) {
  .vert { font-size: clamp(3rem, 10dvh, 7rem); }
  .pad button { min-height: clamp(60px, 10dvh, 120px); font-size: 2.4rem; }
}
@media (orientation: landscape) and (min-width: 640px) {
  .problem-card { height: 100%; justify-content: center; }
  .vert { font-size: clamp(2.2rem, min(7vw, 13dvh), 7rem); }
  .pad button { min-height: clamp(44px, calc((100dvh - 150px) / 4.4), 130px); }
}
/* Short phones: keep long explanations from pushing the number pad off screen. */
@media (max-height: 760px) and (orientation: portrait) {
  .feedback { font-size: 0.95rem; line-height: 1.35; }
  .feedback strong { font-size: 1.15rem; }
}

/* Portrait: the page is exactly one screen tall; the pad or answers stay at the bottom
   and the top part shrinks to fit. With settings open, the page scrolls normally. */
@media (orientation: portrait) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; }
}
@media (orientation: portrait) {
  .problem-card { flex: 1 1 auto; min-height: 0; justify-content: center; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
@media (orientation: landscape) and (min-width: 640px) {
  body { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  body:has(#settings-panel:not([hidden])) { height: auto; overflow: visible; }
  .wrap { flex: 1 1 auto; min-height: 0; width: 100%; }
  .play { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); }
  .problem-card { min-height: 0; overflow: hidden; }
  .feedback { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
}
/* After answering on smaller screens, shrink the sum so the reason has room. */
@media (max-height: 900px), (max-width: 599px) {
  .problem-card.good .vert, .problem-card.bad .vert { zoom: 0.7; }
}
@media (max-height: 500px) {
  .feedback { font-size: 0.9rem; line-height: 1.3; }
  .feedback strong { font-size: 1.05rem; }
}



/* Quick Facts: a picture, a question, and answer buttons to pick from. */
.pic { font-size: clamp(2.6rem, 11dvh, 6.5rem); line-height: 1.1; }
.question { margin: 0; font-size: clamp(1.15rem, min(5.2vw, 3.4dvh), 1.9rem); font-weight: 700; line-height: 1.25;
  text-align: center; max-width: 30ch; text-wrap: balance; }
.side { display: flex; flex-direction: column; gap: 10px; }
.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choices.three button:last-child { grid-column: 1 / -1; }
.choices button {
  font: inherit; font-size: clamp(1rem, min(4.4vw, 2.9dvh), 1.5rem); font-weight: 700; color: var(--ink); line-height: 1.2;
  background: var(--key); border: 2px solid var(--line); border-radius: 18px; min-height: clamp(56px, 9dvh, 96px); padding: 6px 10px; cursor: pointer;
  overflow-wrap: anywhere; hyphens: auto;
  transition: transform .08s ease, border-color .15s ease; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.choices button:hover:not(:disabled) { border-color: var(--accent); }
.choices button:active:not(:disabled) { transform: scale(0.96); }
.choices button:disabled { cursor: default; }
.choices button.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.choices button.faded { opacity: 0.45; }
.next { font: inherit; font-size: 1.25rem; font-weight: 700; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 16px; min-height: clamp(52px, 7dvh, 72px); cursor: pointer; width: 100%; }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg button { padding-inline: 4px; }
@media (min-width: 600px) and (orientation: portrait) {
  .choices button { min-height: clamp(64px, 10dvh, 120px); }
}
@media (orientation: landscape) and (min-width: 640px) {
  .problem-card { height: 100%; justify-content: center; }
  .side { height: 100%; justify-content: center; }
  .choices button { min-height: clamp(52px, 14dvh, 130px); }
}
/* After the answer the picture gets smaller, so the question and the reason have room. */
@media (max-height: 900px), (max-width: 599px) {
  .problem-card.good .pic, .problem-card.bad .pic { zoom: 0.6; }
}
@media (max-height: 700px) {
  .pic { font-size: clamp(2.2rem, 9dvh, 4.5rem); }
  .question { font-size: clamp(1.05rem, min(4.8vw, 3.2dvh), 1.5rem); }
  .problem-card.good .pic, .problem-card.bad .pic { display: none; }
}
@media (max-height: 500px) {
  .question { font-size: 1rem; }
}

/* Worksheet cells (only printed): the question, then the answers to circle. */
@media print {
  .sheet-grid li > div.ws-qf { align-items: flex-start; gap: 0.6mm; padding-right: 2mm; }
  .ws-qf .ws-q { font-size: 9.5pt; font-weight: 600; line-height: 1.2; }
  .ws-qf .ws-q span { margin-right: 1.5mm; }
  .ws-qf .ws-opts { display: flex; flex-wrap: wrap; gap: 0.2mm 3mm; font-size: 8.5pt; line-height: 1.2; color: #333; }
  .ws-qf .ws-opts span::before { content: "○ "; }
}

      ["Wann sehen wir die Sterne am besten?", "Nachts", ["Mittags", "Morgens", "Zum Mittagessen"], "Sterne leuchten immer, aber am Tag überstrahlt die helle Sonne sie."]],
    ["🌕", 1, ["What is on the Moon?", "Rocks and dust", ["Grass and trees", "Lakes and fish", "Clouds and rain"], "The Moon is made of rock and covered with grey dust. It has no air."],
      ["Was gibt es auf dem Mond?", "Steine und Staub", ["Gras und Bäume", "Seen und Fische", "Wolken und Regen"], "Der Mond besteht aus Gestein und ist mit grauem Staub bedeckt. Er hat keine Luft."]],
    ["🌝", 1, ["Why does the Moon shine at night?", "Sunlight hits it", ["It has lamps", "It is on fire", "It is a star"], "The Moon has no light of its own. Sunlight bounces off it."],
      ["Warum leuchtet der Mond in der Nacht?", "Die Sonne scheint drauf", ["Er hat Lampen", "Er brennt", "Er ist ein Stern"], "Der Mond hat kein eigenes Licht. Er wirft das Sonnenlicht zurück."]],
    ["🌌", 1, ["How many planets go around our Sun?", "8", ["5", "12", "20"], "Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune."],
      ["Wie viele Planeten kreisen um unsere Sonne?", "8", ["5", "12", "20"], "Merkur, Venus, Erde, Mars, Jupiter, Saturn, Uranus und Neptun."]],
    ["🌡️", 2, ["Which planet is closest to the Sun?", "Mercury", ["Venus", "Earth", "Neptune"], "Mercury is the closest planet to the Sun, and also the smallest."],
      ["Welcher Planet ist der Sonne am nächsten?", "Merkur", ["Venus", "Erde", "Neptun"], "Merkur ist der Sonne am nächsten und auch der kleinste Planet."]],
    ["🥶", 2, ["Which planet is farthest from the Sun?", "Neptune", ["Mars", "Saturn", "Mercury"], "Neptune is so far away that it gets very little sunlight. It is icy cold."],
      ["Welcher Planet ist am weitesten von der Sonne weg?", "Neptun", ["Mars", "Saturn", "Merkur"], "Neptun ist so weit weg, dass er kaum Sonnenlicht bekommt. Er ist eisig kalt."]],
    ["🔥", 2, ["Which planet is the hottest?", "Venus", ["Mercury", "Mars", "Earth"], "Venus is even hotter than Mercury, because its thick clouds trap the heat."],
      ["Welcher Planet ist am heißesten?", "Venus", ["Merkur", "Mars", "Erde"], "Die Venus ist sogar heißer als Merkur, weil ihre dicken Wolken die Wärme festhalten."]],
    ["👣", 2, ["Who was the first person to walk on the Moon?", "Neil Armstrong", ["Yuri Gagarin", "Albert Einstein", "Isaac Newton"], "Neil Armstrong stepped onto the Moon in 1969."],
      ["Wer betrat als erster Mensch den Mond?", "Neil Armstrong", ["Juri Gagarin", "Albert Einstein", "Isaac Newton"], "Neil Armstrong betrat 1969 den Mond."]],
    ["🧲", 2, ["What keeps the planets going around the Sun?", "Gravity", ["The wind", "Magnets", "Light"], "The Sun's gravity pulls on the planets and keeps them on their paths."],
      ["Was hält die Planeten auf ihrer Bahn um die Sonne?", "Die Schwerkraft", ["Der Wind", "Magnete", "Das Licht"], "Die Schwerkraft der Sonne zieht an den Planeten und hält sie auf ihrer Bahn."]],
    ["🌠", 2, ["What is a shooting star really?", "A burning space rock", ["A falling star", "A firework", "A planet"], "It is a tiny rock from space that burns up as it zooms into our air."],
      ["Was ist eine Sternschnuppe wirklich?", "Ein glühender Stein", ["Ein fallender Stern", "Ein Feuerwerk", "Ein Planet"], "Es ist ein winziger Stein aus dem Weltall, der in unserer Luft verglüht."]],
    ["☄️", 2, ["What is a comet made of?", "Ice and dust", ["Hot metal", "Gold", "Glass"], "Near the Sun, a comet's ice turns to gas and makes a long, glowing tail."],
      ["Woraus besteht ein Komet?", "Aus Eis und Staub", ["Aus heißem Metall", "Aus Gold", "Aus Glas"], "In der Nähe der Sonne wird das Eis zu Gas und bildet einen langen, leuchtenden Schweif."]],
    ["🌋", 2, ["Which planet has the tallest volcano we know?", "Mars", ["Earth", "Venus", "Mercury"], "Olympus Mons on Mars is more than twice as tall as Mount Everest."],
      ["Auf welchem Planeten steht der höchste bekannte Vulkan?", "Mars", ["Erde", "Venus", "Merkur"], "Der Olympus Mons auf dem Mars ist mehr als doppelt so hoch wie der Mount Everest."]],
    ["🌍", 2, ["How long does the Earth take to spin around once?", "One day", ["One month", "One year", "One hour"], "One full spin takes 24 hours. That is one day."],
      ["Wie lange braucht die Erde für eine ganze Drehung?", "Einen Tag", ["Einen Monat", "Ein Jahr", "Eine Stunde"], "Eine ganze Drehung dauert 24 Stunden. Das ist ein Tag."]],
    ["🛰️", 2, ["What is the ISS?", "A space station", ["A planet", "A star", "A moon"], "The International Space Station circles the Earth. Astronauts live on board."],
      ["Was ist die ISS?", "Eine Raumstation", ["Ein Planet", "Ein Stern", "Ein Mond"], "Die Internationale Raumstation kreist um die Erde. Astronauten wohnen an Bord."]],
    ["🧑‍🚀", 2, ["Why do astronauts wear space suits outside?", "There is no air", ["To look cool", "To stay clean", "To fly faster"], "Space has no air. The suit gives them air and keeps them safe from heat and cold."],
      ["Warum tragen Astronauten draußen Raumanzüge?", "Es gibt keine Luft", ["Um cool auszusehen", "Um sauber zu bleiben", "Um schneller zu fliegen"], "Im Weltall gibt es keine Luft. Der Anzug gibt ihnen Luft und schützt vor Hitze und Kälte."]],
    ["🌀", 3, ["What is the Milky Way?", "Our galaxy", ["A planet", "A comet", "A moon"], "The Milky Way is our galaxy: billions of stars. The Sun is one of them."],
      ["Was ist die Milchstraße?", "Unsere Galaxie", ["Ein Planet", "Ein Komet", "Ein Mond"], "Die Milchstraße ist unsere Galaxie: Milliarden Sterne. Die Sonne ist einer davon."]],
    ["💡", 3, ["About how long does sunlight take to reach the Earth?", "About 8 minutes", ["1 second", "1 day", "1 year"], "Light is very fast, but the Sun is 150 million km away. So it takes about 8 minutes."],
      ["Wie lange braucht Sonnenlicht ungefähr bis zur Erde?", "Etwa 8 Minuten", ["1 Sekunde", "1 Tag", "1 Jahr"], "Licht ist sehr schnell, aber die Sonne ist 150 Millionen km weit weg. Darum dauert es etwa 8 Minuten."]],
    ["🍂", 3, ["Why does the Earth have seasons?", "The Earth is tilted", ["The Sun comes closer", "The Moon moves", "The wind changes"], "The Earth is tilted. For part of the year your half leans toward the Sun and gets more sunlight."],
      ["Warum gibt es Jahreszeiten?", "Die Erde ist geneigt", ["Die Sonne kommt näher", "Der Mond wandert", "Der Wind dreht sich"], "Die Erdachse ist geneigt. Einen Teil des Jahres neigt sich deine Erdhälfte zur Sonne und bekommt mehr Licht."]],
    ["🌚", 3, ["What happens in a solar eclipse?", "The Moon blocks the Sun", ["The Earth blocks the Moon", "The Sun switches off", "A big cloud comes"], "The Moon moves between the Sun and the Earth and blocks the sunlight."],
      ["Was passiert bei einer Sonnenfinsternis?", "Der Mond verdeckt die Sonne", ["Die Erde verdeckt den Mond", "Die Sonne geht aus", "Eine große Wolke kommt"], "Der Mond schiebt sich zwischen Sonne und Erde und verdeckt das Sonnenlicht."]],
    ["🏋️", 3, ["How heavy would you feel on the Moon?", "Lighter", ["Heavier", "The same", "Twice as heavy"], "The Moon's gravity is about one sixth of the Earth's. You could jump very high."],
      ["Wie schwer würdest du dich auf dem Mond fühlen?", "Leichter", ["Schwerer", "Genauso schwer", "Doppelt so schwer"], "Die Schwerkraft auf dem Mond ist etwa ein Sechstel so stark wie auf der Erde. Du könntest sehr hoch springen."]],
    ["🔭", 3, ["Which planet spins on its side?", "Uranus", ["Venus", "Mars", "Earth"], "Uranus is tipped over, so it rolls around the Sun on its side."],
      ["Welcher Planet dreht sich auf der Seite liegend?", "Uranus", ["Venus", "Mars", "Erde"], "Uranus ist umgekippt. Er rollt auf der Seite liegend um die Sonne."]],
    ["✨", 3, ["Which star is closest to the Earth?", "The Sun", ["The North Star", "Sirius", "The Moon"], "The Sun is a star, and it is much closer to us than any other star."],
      ["Welcher Stern ist der Erde am nächsten?", "Die Sonne", ["Der Polarstern", "Sirius", "Der Mond"], "Die Sonne ist ein Stern und viel näher an uns als jeder andere Stern."]]
  ],
  animals: [
    ["🐄", 1, ["What does a cow give us to drink?", "Milk", ["Juice", "Water", "Tea"], "Cows give milk. We also make cheese and butter from it."],
      ["Was gibt uns die Kuh zum Trinken?", "Milch", ["Saft", "Wasser", "Tee"], "Kühe geben Milch. Daraus macht man auch Käse und Butter."]],
    ["🐛", 1, ["What does a caterpillar turn into?", "A butterfly", ["A bird", "A snake", "A spider"], "A caterpillar rests in a hard case, then comes out as a butterfly."],
      ["Was wird aus einer Raupe?", "Ein Schmetterling", ["Ein Vogel", "Eine Schlange", "Eine Spinne"], "Die Raupe verpuppt sich und schlüpft dann als Schmetterling."]],
    ["🕷️", 1, ["How many legs does a spider have?", "8", ["6", "4", "10"], "Spiders have 8 legs. Insects have 6."],
      ["Wie viele Beine hat eine Spinne?", "8", ["6", "4", "10"], "Spinnen haben 8 Beine. Insekten haben 6."]],
    ["🐞", 1, ["How many legs does an insect have?", "6", ["8", "4", "2"], "All insects, like ladybirds, bees and ants, have 6 legs."],
      ["Wie viele Beine hat ein Insekt?", "6", ["8", "4", "2"], "Alle Insekten, wie Marienkäfer, Bienen und Ameisen, haben 6 Beine."]],
    ["🐟", 1, ["How do fish breathe under water?", "With gills", ["With a nose", "With their tail", "They hold their breath"], "Gills take the oxygen out of the water."],
      ["Wie atmen Fische unter Wasser?", "Mit Kiemen", ["Mit der Nase", "Mit dem Schwanz", "Sie halten die Luft an"], "Kiemen holen den Sauerstoff aus dem Wasser."]],
    ["🐸", 1, ["What does a tadpole grow into?", "A frog", ["A fish", "A snail", "A duck"], "Tadpoles live in water. Then they grow legs and become frogs."],
      ["Was wird aus einer Kaulquappe?", "Ein Frosch", ["Ein Fisch", "Eine Schnecke", "Eine Ente"], "Kaulquappen leben im Wasser. Dann wachsen ihnen Beine und sie werden Frösche."]],
    ["🐝", 1, ["What do bees make?", "Honey", ["Milk", "Silk", "Bread"], "Bees turn the sweet nectar from flowers into honey."],
      ["Was machen Bienen?", "Honig", ["Milch", "Seide", "Brot"], "Bienen machen aus dem süßen Nektar der Blüten Honig."]],
    ["🐻", 1, ["What do many bears do in winter?", "Sleep for months", ["Fly away", "Swim in the sea", "Lay eggs"], "Many bears rest in a den all winter, when there is little food."],
      ["Was machen viele Bären im Winter?", "Monatelang schlafen", ["Wegfliegen", "Im Meer schwimmen", "Eier legen"], "Viele Bären ruhen den ganzen Winter in einer Höhle, weil es dann wenig Futter gibt."]],
    ["🐔", 1, ["Which animal lays eggs?", "A hen", ["A cow", "A dog", "A cat"], "Birds, like hens, lay eggs. Baby chicks hatch from them."],
      ["Welches Tier legt Eier?", "Das Huhn", ["Die Kuh", "Der Hund", "Die Katze"], "Vögel wie Hühner legen Eier. Daraus schlüpfen Küken."]],
    ["🐋", 1, ["Which is the biggest animal ever?", "The blue whale", ["The elephant", "The giraffe", "T. rex"], "The blue whale is the biggest animal we know of, bigger than any dinosaur."],
      ["Welches ist das größte Tier aller Zeiten?", "Der Blauwal", ["Der Elefant", "Die Giraffe", "Der T. rex"], "Der Blauwal ist das größte Tier, das wir kennen, größer als jeder Dinosaurier."]],
    ["🦒", 1, ["Which animal has the longest neck?", "The giraffe", ["The horse", "The elephant", "The camel"], "Its long neck helps a giraffe eat leaves high up in the trees."],
      ["Welches Tier hat den längsten Hals?", "Die Giraffe", ["Das Pferd", "Der Elefant", "Das Kamel"], "Mit ihrem langen Hals frisst die Giraffe Blätter hoch oben in den Bäumen."]],
    ["🐆", 1, ["Which is the fastest land animal?", "The cheetah", ["The horse", "The dog", "The tortoise"], "For a short time, a cheetah can run as fast as a car on a country road."],
      ["Welches ist das schnellste Landtier?", "Der Gepard", ["Das Pferd", "Der Hund", "Die Schildkröte"], "Ein Gepard rennt kurz so schnell wie ein Auto auf der Landstraße."]],
    ["🐧", 1, ["Penguins are birds. What can't they do?", "Fly", ["Swim", "Walk", "Lay eggs"], "Penguins can't fly, but they are great swimmers."],
      ["Pinguine sind Vögel. Was können sie nicht?", "Fliegen", ["Schwimmen", "Laufen", "Eier legen"], "Pinguine können nicht fliegen, aber sie sind tolle Schwimmer."]],
    ["🐪", 2, ["What does a camel store in its hump?", "Fat", ["Water", "Sand", "Milk"], "The hump holds fat. The camel can live on it when there is no food."],
      ["Was speichert ein Kamel im Höcker?", "Fett", ["Wasser", "Sand", "Milch"], "Im Höcker ist Fett. Davon lebt das Kamel, wenn es kein Futter gibt."]],
    ["🦇", 2, ["Which animal finds its way in the dark with echoes?", "The bat", ["The cat", "The snail", "The cow"], "Bats make very high calls and listen for the echo to find their way."],
      ["Welches Tier findet sich im Dunkeln mit Echos zurecht?", "Die Fledermaus", ["Die Katze", "Die Schnecke", "Die Kuh"], "Fledermäuse rufen sehr hoch und hören auf das Echo, um sich zurechtzufinden."]],
    ["🐬", 2, ["What kind of animal is a dolphin?", "A mammal", ["A fish", "A bird", "A reptile"], "Dolphins breathe air and feed their babies milk, so they are mammals."],
      ["Was für ein Tier ist ein Delfin?", "Ein Säugetier", ["Ein Fisch", "Ein Vogel", "Ein Reptil"], "Delfine atmen Luft und säugen ihre Jungen mit Milch. Darum sind sie Säugetiere."]],
    ["🐍", 2, ["Snakes, lizards and turtles are all...", "Reptiles", ["Mammals", "Insects", "Birds"], "Reptiles have dry, scaly skin, and most of them lay eggs."],
      ["Schlangen, Eidechsen und Schildkröten sind alle...", "Reptilien", ["Säugetiere", "Insekten", "Vögel"], "Reptilien haben trockene, schuppige Haut, und die meisten legen Eier."]],
    ["🦎", 2, ["What can many lizards do if you grab their tail?", "Drop the tail", ["Fly away", "Grow wings", "Turn to stone"], "The tail keeps wiggling and tricks the hunter. A new tail grows back."],
      ["Was können viele Eidechsen tun, wenn man ihren Schwanz packt?", "Den Schwanz abwerfen", ["Wegfliegen", "Flügel bekommen", "Zu Stein werden"], "Der Schwanz zappelt weiter und lenkt den Jäger ab. Ein neuer wächst nach."]],
    ["🦉", 2, ["When do most owls hunt?", "At night", ["At midday", "Only in winter", "In the morning"], "Most owls hunt at night. They have great eyes and ears for the dark."],
      ["Wann jagen die meisten Eulen?", "Nachts", ["Mittags", "Nur im Winter", "Morgens"], "Die meisten Eulen jagen nachts. Sie haben sehr gute Augen und Ohren für die Dunkelheit."]],
    ["🐼", 2, ["What do giant pandas eat most?", "Bamboo", ["Fish", "Meat", "Honey"], "Pandas spend many hours a day eating bamboo."],
      ["Was fressen Große Pandas am meisten?", "Bambus", ["Fisch", "Fleisch", "Honig"], "Pandas fressen viele Stunden am Tag Bambus."]],
    ["🐘", 2, ["What is an elephant's trunk?", "Its nose", ["Its tail", "A tooth", "An ear"], "The trunk is a long nose and top lip. It smells, drinks and grabs things."],
      ["Was ist der Rüssel eines Elefanten?", "Seine Nase", ["Sein Schwanz", "Ein Zahn", "Ein Ohr"], "Der Rüssel ist Nase und Oberlippe in einem. Damit riecht, trinkt und greift der Elefant."]],
    ["🐙", 2, ["How many arms does an octopus have?", "8", ["6", "10", "4"], "\"Octo\" means eight. Each arm is covered in suckers."],
      ["Wie viele Arme hat ein Oktopus?", "8", ["6", "10", "4"], "„Okto“ heißt acht. Jeder Arm ist voller Saugnäpfe."]],
    ["🦈", 2, ["What kind of animal is a shark?", "A fish", ["A mammal", "A reptile", "A bird"], "Sharks are fish. They breathe with gills."],
      ["Was für ein Tier ist ein Hai?", "Ein Fisch", ["Ein Säugetier", "Ein Reptil", "Ein Vogel"], "Haie sind Fische. Sie atmen mit Kiemen."]],
    ["🐿️", 2, ["What do squirrels do in autumn?", "Hide nuts", ["Fly south", "Lose their tails", "Lay eggs"], "Squirrels bury nuts to eat in winter. Forgotten nuts can grow into trees."],
      ["Was machen Eichhörnchen im Herbst?", "Nüsse verstecken", ["Nach Süden fliegen", "Den Schwanz verlieren", "Eier legen"], "Eichhörnchen vergraben Nüsse für den Winter. Vergessene Nüsse können zu Bäumen wachsen."]],
    ["🐦", 2, ["Why do many birds fly south in autumn?", "To find food", ["To see the sea", "To lay eggs on ice", "To hide from rain"], "In winter, food is hard to find, so they fly to warmer places."],
      ["Warum fliegen viele Vögel im Herbst nach Süden?", "Um Futter zu finden", ["Um das Meer zu sehen", "Um Eier aufs Eis zu legen", "Um sich vor Regen zu verstecken"], "Im Winter gibt es hier wenig Futter. Darum fliegen sie in wärmere Länder."]],
    ["🦎", 2, ["Which lizard is famous for changing its color?", "The chameleon", ["The crocodile", "The turtle", "The snake"], "Chameleons change color to show how they feel and to warm up or cool down."],
      ["Welche Echse ist dafür bekannt, ihre Farbe zu ändern?", "Das Chamäleon", ["Das Krokodil", "Die Schildkröte", "Die Schlange"], "Chamäleons ändern die Farbe, um Gefühle zu zeigen und um sich zu wärmen oder abzukühlen."]],
    ["🦘", 2, ["Where does a baby kangaroo grow up?", "In a pouch", ["In a nest", "In an egg", "Under water"], "A newborn kangaroo is as small as a bean. It grows in its mother's pouch."],
      ["Wo wächst ein Kängurubaby auf?", "Im Beutel", ["In einem Nest", "In einem Ei", "Unter Wasser"], "Ein neugeborenes Känguru ist so klein wie eine Bohne. Es wächst im Beutel der Mutter heran."]],
    ["🐳", 3, ["How do whales breathe?", "Through a blowhole", ["With gills", "Through their tail", "They don't need air"], "Whales are mammals with lungs. They come up and breathe through the blowhole on top of their head."],
      ["Wie atmen Wale?", "Durch ein Blasloch", ["Mit Kiemen", "Durch den Schwanz", "Sie brauchen keine Luft"], "Wale sind Säugetiere mit Lungen. Sie tauchen auf und atmen durch das Blasloch oben auf dem Kopf."]],
    ["🌿", 3, ["What do we call an animal that eats only plants?", "A herbivore", ["A carnivore", "An omnivore", "A predator"], "Herbivores eat plants. Carnivores eat meat. Omnivores eat both."],
      ["Wie nennt man ein Tier, das nur Pflanzen frisst?", "Pflanzenfresser", ["Fleischfresser", "Allesfresser", "Raubtier"], "Pflanzenfresser fressen Pflanzen, Fleischfresser Fleisch und Allesfresser beides."]],
    ["🦖", 3, ["When did the big dinosaurs die out?", "66 million years ago", ["500 years ago", "5,000 years ago", "100 years ago"], "A huge rock from space hit the Earth. Birds are the dinosaurs' living relatives."],
      ["Wann sind die großen Dinosaurier ausgestorben?", "Vor 66 Millionen Jahren", ["Vor 500 Jahren", "Vor 5.000 Jahren", "Vor 100 Jahren"], "Ein riesiger Stein aus dem Weltall schlug auf der Erde ein. Vögel sind die heutigen Verwandten der Dinosaurier."]],
    ["🐜", 3, ["Which animal lives in a big group with a queen?", "The ant", ["The cat", "The frog", "The owl"], "Ants live in huge colonies. The queen lays all the eggs."],
      ["Welches Tier lebt in einem großen Volk mit einer Königin?", "Die Ameise", ["Die Katze", "Der Frosch", "Die Eule"], "Ameisen leben in riesigen Völkern. Die Königin legt alle Eier."]],
    ["🐸", 3, ["Frogs and newts live on land and in water. They are...", "Amphibians", ["Reptiles", "Mammals", "Fish"], "Amphibians start life in water, and most move onto land later."],
      ["Frösche und Molche leben an Land und im Wasser. Sie sind...", "Amphibien", ["Reptilien", "Säugetiere", "Fische"], "Amphibien beginnen ihr Leben im Wasser, und die meisten gehen später an Land."]]

  body: [
    ["🫀", 1, ["Which part of your body pumps blood?", "The heart", ["The lungs", "The stomach", "The brain"], "Your heart is a strong muscle. It beats about 100,000 times a day."],
      ["Welcher Teil des Körpers pumpt das Blut?", "Das Herz", ["Die Lunge", "Der Magen", "Das Gehirn"], "Dein Herz ist ein starker Muskel. Es schlägt etwa 100.000 Mal am Tag."]],
    ["🫁", 1, ["What do you breathe with?", "Your lungs", ["Your heart", "Your stomach", "Your bones"], "Your lungs take in air and pass the oxygen into your blood."],
      ["Womit atmest du?", "Mit der Lunge", ["Mit dem Herzen", "Mit dem Magen", "Mit den Knochen"], "Deine Lunge holt Luft und gibt den Sauerstoff ins Blut."]],
    ["🧠", 1, ["What do you think with?", "Your brain", ["Your heart", "Your stomach", "Your knees"], "Your brain controls everything you think, feel and do."],
      ["Womit denkst du?", "Mit dem Gehirn", ["Mit dem Herzen", "Mit dem Magen", "Mit den Knien"], "Dein Gehirn steuert alles, was du denkst, fühlst und tust."]],
    ["👃", 1, ["What do you use your nose for?", "Smelling", ["Hearing", "Seeing", "Touching"], "Your nose can tell thousands of smells apart."],
      ["Wofür brauchst du deine Nase?", "Zum Riechen", ["Zum Hören", "Zum Sehen", "Zum Tasten"], "Deine Nase kann Tausende Gerüche unterscheiden."]],
    ["👀", 1, ["How many senses do we usually count?", "5", ["2", "3", "10"], "Seeing, hearing, smelling, tasting and touching."],
      ["Wie viele Sinne zählt man meistens?", "5", ["2", "3", "10"], "Sehen, Hören, Riechen, Schmecken und Tasten."]],
    ["🪥", 1, ["What keeps your teeth healthy?", "Brushing twice a day", ["Lots of sweets", "Never brushing", "Fizzy drinks"], "Brushing takes away the germs and bits of food that make holes in teeth."],
      ["Was hält deine Zähne gesund?", "Zweimal am Tag putzen", ["Viele Süßigkeiten", "Nie putzen", "Limonade"], "Putzen entfernt Keime und Essensreste, die Löcher in die Zähne machen."]],
    ["🦴", 1, ["What holds your body up and gives it shape?", "Your skeleton", ["Your skin", "Your hair", "Your blood"], "Your skeleton is made of bones. It holds you up and protects your insides."],
      ["Was hält deinen Körper aufrecht und gibt ihm Form?", "Das Skelett", ["Die Haut", "Die Haare", "Das Blut"], "Dein Skelett besteht aus Knochen. Es hält dich aufrecht und schützt dein Inneres."]],
    ["🧼", 1, ["Why do we wash our hands before eating?", "To wash off germs", ["To make them grow", "To make them warm", "To change their color"], "Soap washes away tiny germs that can make you sick."],
      ["Warum waschen wir vor dem Essen die Hände?", "Gegen Keime", ["Damit sie wachsen", "Damit sie warm werden", "Damit sie die Farbe ändern"], "Seife wäscht winzige Keime ab, die krank machen können."]],
    ["👂", 1, ["What do your ears do?", "Hear", ["See", "Smell", "Taste"], "Your ears catch sounds and send them to your brain."],
      ["Was machen deine Ohren?", "Hören", ["Sehen", "Riechen", "Schmecken"], "Deine Ohren fangen Geräusche auf und schicken sie ans Gehirn."]],
    ["😴", 1, ["Why do children need lots of sleep?", "To grow and rest", ["To miss school", "To get hungry", "To make noise"], "While you sleep, your body grows and your brain sorts what you learned."],
      ["Warum brauchen Kinder viel Schlaf?", "Zum Wachsen und Ausruhen", ["Um Schule zu verpassen", "Um Hunger zu bekommen", "Um laut zu sein"], "Im Schlaf wächst dein Körper, und dein Gehirn sortiert, was du gelernt hast."]],
    ["💧", 1, ["What is the best drink when you are thirsty?", "Water", ["Cola", "Lemonade", "Syrup"], "Your body needs water most, and it has no sugar."],
      ["Was ist das beste Getränk bei Durst?", "Wasser", ["Cola", "Limonade", "Sirup"], "Wasser braucht dein Körper am meisten, und es hat keinen Zucker."]],
    ["👅", 1, ["What do you taste with?", "Your tongue", ["Your ears", "Your elbows", "Your hair"], "Your tongue has thousands of taste buds for sweet, salty, sour and more."],
      ["Womit schmeckst du?", "Mit der Zunge", ["Mit den Ohren", "Mit den Ellbogen", "Mit den Haaren"], "Auf deiner Zunge sind Tausende Geschmacksknospen für süß, salzig, sauer und mehr."]],

      ["Wie viele Knochen hat ein Erwachsener ungefähr?", "206", ["50", "100", "1.000"], "Babys haben etwa 300 Knochen. Manche wachsen zusammen, darum haben Erwachsene 206."]],

    ["🌞", 3, ["Which vitamin does your skin make in sunlight?", "Vitamin D", ["Vitamin C", "Vitamin A", "Vitamin B"], "Sunlight helps your skin make vitamin D, which keeps your bones strong."],
      ["Welches Vitamin bildet deine Haut im Sonnenlicht?", "Vitamin D", ["Vitamin C", "Vitamin A", "Vitamin B"], "Mit Sonnenlicht bildet deine Haut Vitamin D. Das hält die Knochen stark."]]
  ]
};
const TOPICS = Object.keys(FACTS);
const randInt = (n) => Math.floor(Math.random() * n);
const pick = (arr) => arr[randInt(arr.length)];
const shuffle = (arr) => arr.slice().sort(() => Math.random() - 0.5);
// One fact as { pic, level, topic, key, en: {q, a, wrong, why}, de: {...} }. The key is the topic and its place in the list.
const ALL = TOPICS.flatMap(topic => FACTS[topic].map((f, i) => {
  const lang = (x) => ({ q: x[0], a: x[1], wrong: x[2], why: x[3] });
  return { pic: f[0], level: f[1], topic, key: topic + i, en: lang(f[2]), de: lang(f[3]) };
}));

// level 1: level 1 facts, 3 answers. Level 2: levels 1 and 2, 4 answers. Level 3: all facts, 4 answers.
function makeProblem(lang, topic, level, avoid) {
  const list = ALL.filter(f => (topic === "all" || f.topic === topic) && f.level <= level);
  let fact = pick(list);
  for (let tries = 0; tries < 40 && avoid && avoid.includes(fact.key); tries++) fact = pick(list);
  const text = fact[lang];
  const options = shuffle([text.a, ...shuffle(text.wrong).slice(0, level === 1 ? 2 : 3)]);
  return { fact, text, options, key: fact.key, answer: text.a };
}
// GEN END

(function () {
  const $ = (id) => document.getElementById(id);
  const card = $("card"), picEl = $("pic"), qEl = $("question"), choicesEl = $("choices"), feedbackEl = $("feedback"), nextBtn = $("next");
  const topicBtns = [...document.querySelectorAll("#topic-seg button")];
  const levelBtns = [...document.querySelectorAll("#level-seg button")];
  const t = Loopy.t, lang = Loopy.lang === "de" ? "de" : "en";
  const store = {
    // ok: the values this setting may have; anything else falls back to the default.
    get(k, d, ok) { try { const v = JSON.parse(localStorage.getItem(k)); return ok.includes(v) ? v : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  let age = Loopy.getAge();
  let topic = store.get("qf.topic", "all", ["all", ...TOPICS]);
  let level;
  // The level is remembered per age, so each age starts at the right level.
  function loadForAge() { level = store.get("qf.level.a" + age, age <= 8 ? 1 : age <= 10 ? 2 : 3, [1, 2, 3]); }
  loadForAge();
  let right = 0, tried = 0, streak = 0;
  let current = null, answered = false, recent = [];

  function render() {
    $("score").textContent = right + " / " + tried;
    $("streak").textContent = streak;
    topicBtns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.topic === topic)));
    levelBtns.forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.level === level)));
    nextBtn.textContent = t(answered ? "qfNext" : "qfNew");
  }
  function newRound() {
    current = makeProblem(lang, topic, level, recent);
    recent.push(current.key);
    if (recent.length > 20) recent.shift();
    answered = false;
    picEl.textContent = current.fact.pic;
    qEl.textContent = current.text.q;
    choicesEl.textContent = "";
    choicesEl.classList.toggle("three", current.options.length === 3);
    current.options.forEach((a, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.id = "choice-" + i; b.textContent = a;
      b.dataset.correct = String(a === current.answer);
      b.addEventListener("click", () => choose(b));
      choicesEl.appendChild(b);
    });
    card.classList.remove("good", "bad");
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    render();
    Loopy.speech.read();
  }
  function choose(btn) {
    if (answered) return;
    answered = true; tried++;
    const ok = btn.dataset.correct === "true";
    [...choicesEl.children].forEach(b => {
      b.disabled = true;
      if (b.dataset.correct === "true") b.classList.add("right");
      else if (b === btn) b.classList.add("wrong");
      else b.classList.add("faded");
    });
    if (ok) { right++; streak++; } else { streak = 0; }
    // The progress page keeps 40 letters of the question.
    const q = current.text.q.length > 40 ? current.text.q.slice(0, 39) + "…" : current.text.q;
    if (ok) Loopy.rewards.correct("quick-facts", streak, harder());
    else Loopy.rewards.wrong("quick-facts", { q, a: current.answer, y: btn.textContent, k: "qf-" + current.fact.topic });
    card.classList.remove("good", "bad");
    card.classList.add(ok ? "good" : "bad");
    feedbackEl.className = "feedback " + (ok ? "good" : "bad");
    feedbackEl.innerHTML = "<strong></strong>";
    feedbackEl.firstChild.textContent = ok ? (streak >= 3 ? t("correctRow", { n: streak }) : t("correct")) : t("notQuite");
    // One line of why after every answer; after a wrong one, the right answer first.
    feedbackEl.appendChild(document.createTextNode((ok ? "" : t("qfAnswerIs", { a: current.answer }) + " ") + current.text.why));
    render();
    nextBtn.focus({ preventScroll: true });
  }
  // What "Make it harder" does after 10 in a row: Explorer, then Expert questions.
  function harder() {
    if (level < 3) return { label: t(level === 1 ? "qfTryL2" : "qfTryL3"), apply: () => { level++; store.set("qf.level.a" + age, level); render(); } };
    return null;
  }

  nextBtn.addEventListener("click", newRound);
  topicBtns.forEach(b => b.addEventListener("click", () => { topic = b.dataset.topic; store.set("qf.topic", topic); recent = []; newRound(); }));
  levelBtns.forEach(b => b.addEventListener("click", () => { level = +b.dataset.level; store.set("qf.level.a" + age, level); newRound(); }));
  window.addEventListener("loopy:age", (e) => { age = e.detail; recent = []; loadForAge(); newRound(); });
  $("reset").addEventListener("click", () => { right = 0; tried = 0; streak = 0; Loopy.recent.clear("quick-facts"); newRound(); });
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || document.querySelector(".loopy-cheer.big")) return;
    if (e.key === "Enter" && answered && e.target.tagName !== "BUTTON") { newRound(); return; }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 4 && !answered) { const b = choicesEl.children[n - 1]; if (b) choose(b); }
  });

  // Read aloud: "Which planet do we live on? Is it Mars, Earth, Venus or Jupiter?"
  Loopy.speech.question({ host: card, text: () => {
    const o = current.options;
    return t("qfReadQ", { q: current.text.q, list: o.slice(0, -1).join(", ") + " " + t("orWord") + " " + o[o.length - 1] });
  } });

  // Print worksheet: 20 questions at the game's level and topic, each with its answers to circle.
  const part = (cls, text) => { const n = document.createElement("span"); if (cls) n.className = cls; if (text) n.textContent = text; return n; };
  const TOPIC_KEYS = { all: "qfAll", space: "qfSpace", animals: "qfAnimals", body: "qfBody" };
  Loopy.worksheet({
    title: () => t("qfName"),
    level: () => [t("ageLabel", { n: age }), t("qfTopic") + ": " + t(TOPIC_KEYS[topic]), t("qfLevel") + ": " + t("qfL" + level)].join(" · "),
    how: () => t("qfHow"),
    layout: "line",
    make: (n) => { const list = [], keys = []; while (list.length < n) { const p = makeProblem(lang, topic, level, keys); keys.push(p.key); list.push(p); } return list; },
    cell: (p) => {
      const box = document.createElement("div");
      box.className = "ws-qf";
      const q = part("ws-q");
      q.appendChild(part("", p.fact.pic));
      q.appendChild(document.createTextNode(p.text.q));
      box.appendChild(q);
      const opts = part("ws-opts");
      p.options.forEach(a => opts.appendChild(part("", a)));
      box.appendChild(opts);
      return box;
    },
    answer: (p) => p.fact.pic + " " + p.answer
  });

  newRound();
})();
</script>
